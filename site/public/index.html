}
async function initCloud(){
  if(!window.claude || typeof claude.use!=='function'){ setSyncStatus('local'); return; }
  let db=null, user=null;
  try{ [db,user] = await Promise.all([claude.use('db'), claude.use('user')]); }catch(e){}
  if(db){
    db.collection('updates').onSnapshot(snap=>{
      DB_UPDATES = snap.docs.map(d=>d.data()).filter(u=>u && typeof u.id==='string' && typeof u.title==='string');
      buildNav(); if(view==='updates' || view==='dash') rerenderKeepScroll();
    }, ()=>{});
  }
  if(!db || !user){ setSyncStatus('local'); return; }
  let uid=null; try{ uid = await user.id(); }catch(e){}
  if(!uid){ setSyncStatus('local'); return; }
  SYNC.db=db; SYNC.base='data/users/'+uid;
  try{
    const [ps,cs] = await Promise.all([db.doc(SYNC.base+'/progress').get(), db.doc(SYNC.base+'/content').get()]);
    if(ps.exists || cs.exists){
      let p={}, c={};
      try{ p = ps.exists ? JSON.parse(ps.data().json||'{}') : {}; }catch(e){}
      try{ c = cs.exists ? JSON.parse(cs.data().json||'{}') : {}; }catch(e){}
      lastSent.p = ps.exists ? (ps.data().json||'') : '';
      lastSent.c = cs.exists ? (cs.data().json||'') : '';
      applyState(Object.assign({}, p, c));
    }
    SYNC.ready=true; setSyncStatus('synced'); if(typeof loadReports==='function') loadReports(); if(typeof checkBadges==='function') checkBadges();

function fmtTutor(s){
  // minimal, safe formatting: escape, then code fences and inline code, bold, line breaks

}
async function sendTutor(){

function dueInfo(deckFilter){
  ensureState(); const t=todayKey(); const all=buildDeck().filter(c=>deckFilter==='all'||c.deck===deckFilter);
  const due=all.filter(c=>S.cards[c.id] && S.cards[c.id].due<=t);
  const fresh=all.filter(c=>!S.cards[c.id]);
  const newDone=(S.cardDay[t]||{}).new||0; const newLeft=Math.max(0,S.settings.newPerDay-newDone);
  return {all, due, fresh, newLeft, newToday:fresh.slice(0,newLeft)};
}
function nextIntervals(c){
  const st=S.cards[c.id]||{ef:2.5,iv:0,reps:0};
  const calc=g=>{ if(g===0) return 0; if(st.reps===0) return g===3?3:1; if(st.reps===1) return g===1?3:g===2?4:6; return Math.max(1,Math.round(st.iv*(g===1?1.2:g===2?st.ef:st.ef*1.3))); };
  return [0,1,2,3].map(calc);
}
function rateCard(c,g){
  const t=todayKey(); const isNew=!S.cards[c.id];
  const st=S.cards[c.id]||{ef:2.5,iv:0,reps:0,lapses:0};
  const iv=nextIntervals(c)[g];
  if(g===0){ st.lapses=(st.lapses||0)+1; st.reps=0; st.iv=0; st.ef=Math.max(1.3,st.ef-0.2); }
  else { st.iv=iv; st.reps++; st.ef=Math.max(1.3, st.ef + (g===1?-0.15:g===3?0.15:0)); }
  st.due=dkey(addDays(new Date(), g===0?0:iv)); S.cards[c.id]=st;
  const day=S.cardDay[t]=S.cardDay[t]||{rev:0,new:0,again:0}; day.rev++; if(isNew) day.new++; if(g===0) day.again++;
  const a=S.areaScore[c.area]=S.areaScore[c.area]||{fc:0.6,n:0}; a.fc=0.85*a.fc+0.15*(g>=2?1:g===1?0.6:0); a.n++;
  save();
}

function areaSkill(a){
  ensureState(); const parts=[];
  const fc=S.areaScore[a]; if(fc && fc.n>=3) parts.push(fc.fc);
  const ms=S.mockTopic[a]; if(ms && ms.length) parts.push(ms.slice(-5).reduce((x,y)=>x+y,0)/Math.min(5,ms.length)/10);
  if(MODS[a]){ const ex=CURR.filter(w=>w.mod===a).flatMap(w=>w.items).filter(i=>i.type==='exam'&&S.scores[i.id]!=null).map(i=>S.scores[i.id]/100); if(ex.length) parts.push(ex.reduce((x,y)=>x+y,0)/ex.length);
    const cd=currentDay()||0; const due=LESSONS.map((L,i)=>[L,i+1]).filter(([L,n])=>L.m===a&&n<=cd); if(due.length) parts.push(due.filter(([L,n])=>S.lessons[n]).length/due.length); }
  else { const t=IV_TOPICS.find(x=>x.id===a); if(t){ const sc=t.scen; const cov=((S.ivRead&&S.ivRead[a])?0.5:0)+(sc.length?0.5*sc.filter(id=>S.ivDone&&S.ivDone[id]).length/sc.length:0); if(cov>0) parts.push(cov); } }
  if(!parts.length) return null;
  return Math.round(parts.reduce((x,y)=>x+y,0)/parts.length*100);
}

const FOCUS={on:false, phase:'work', left:0, t:null, cycles:0};
function openFocus(){ $('#focus').hidden=false; if(!FOCUS.on) startFocus('work'); renderFocus(); }
function startFocus(phase){
  FOCUS.on=true; FOCUS.phase=phase; FOCUS.left=(phase==='work'?S.settings.focusWork:S.settings.focusBreak)*60;
  if(phase==='work' && !S.timer.running) toggleTimer();
  if(phase==='break' && S.timer.running) toggleTimer();
  clearInterval(FOCUS.t); FOCUS.t=setInterval(()=>{ FOCUS.left--; if(FOCUS.left<=0){ beep(); if(FOCUS.phase==='work'){ FOCUS.cycles++; toast('Focus block done — take a break'); startFocus('break'); } else { toast('Break over — next focus block'); startFocus('work'); } } renderFocus(); },1000);
}
function stopFocus(){ clearInterval(FOCUS.t); FOCUS.on=false; if(S.timer.running) toggleTimer(); $('#focus').hidden=true; render(); }

let MOCK=null; // active session
function pickWeighted(items, weightFn, n){ const pool=[...items], out=[]; while(out.length<n && pool.length){ const ws=pool.map(weightFn), tot=ws.reduce((a,b)=>a+b,0); let r=Math.random()*tot, i=0; while(i<pool.length-1 && (r-=ws[i])>0) i++; out.push(pool.splice(i,1)[0]); } return out; }
function buildMock(focus, mins){
  const weight=a=>{ const s=areaSkill(a); return s==null?1.2:1+(100-s)/40; };
  const items=[{kind:'intro', topic:null, q:'Tell me about yourself, and a recent Salesforce project you are proud of.', model:'Keep it to 90 seconds: current role and context; 1–2 projects with your specific contribution, tech and a measurable result; why this role. Close by linking your skills to the job.'}];
  let tech=[];
  if(focus!=='clouds'){ const qs=IV_TOPICS.filter(t=>focus==='all'||focus==='core'||t.id===focus).flatMap(t=>t.qa.map(qa=>({t:t.id,qa}))); tech.push(...pickWeighted(qs, x=>weight(x.t), focus==='clouds'?0:(focus==='all'?3:5))); }
  if(focus==='all'||focus==='clouds'){ const ls=LESSONS.map((L,i)=>({L,n:i+1})).filter(x=>['dc','rc','af'].includes(x.L.m) && x.L.min===150).flatMap(x=>x.L.q.map(qa=>({t:x.L.m,qa}))); tech.push(...pickWeighted(ls, x=>weight(x.t), focus==='clouds'?5:2)); }
  tech.forEach(x=>items.push({kind:'tech', topic:x.t, q:x.qa[0], model:x.qa[1]}));
  const code=IV_SCENARIOS.filter(s=>s.files && (focus==='all'||focus==='core'||focus==='clouds'||s.topic===focus));
  const design=IV_SCENARIOS.filter(s=>!s.files);
  const c=pickWeighted(code.length?code:IV_SCENARIOS.filter(s=>s.files), s=>(S.ivDone&&S.ivDone[s.id]?0.5:1.5)*weight(s.topic),1)[0];
  const d=pickWeighted(design, s=>weight(s.topic),1)[0];
  if(c) items.push({kind:'code', topic:c.topic, q:c.title+' — '+c.prompt, model:c.talk+' (Reference solution: scenario '+c.id+' in Interview Prep.)', scen:c.id});
  if(d) items.push({kind:'design', topic:d.topic, q:d.title+' — '+d.prompt, model:plain(d.solution||d.talk), scen:d.id});
  return {id:uid(), date:todayKey(), started:Date.now(), focus, mins, idx:0, items:items.map(x=>Object.assign(x,{answer:''}))};
}

function trendSvg(vals){
  if(vals.length<2) return '';
  const W=600,H=120,p=24, x=i=>p+i*(W-2*p)/(vals.length-1), y=v=>H-p-(v/10)*(H-2*p);

  return `<div style="overflow-x:auto"><svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" role="img" aria-label="Mock interview score trend"><line x1="${p}" x2="${W-p}" y1="${y(8)}" y2="${y(8)}" stroke="var(--ok)" stroke-dasharray="4 4" opacity=".6"/><text x="${W-p}" y="${y(8)-4}" fill="var(--ok)" font-size="11" text-anchor="end">8 = ready</text><polyline points="${pts}" fill="none" stroke="var(--vc)" stroke-width="3" stroke-linejoin="round"/>${vals.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="${i===vals.length-1?6:4}" fill="var(--vc)"/>`).join('')}</svg></div>`;

async function finishMock(){
  const m=MOCK; const unanswered=m.items.filter(x=>!x.answer.trim()).length;
  if(unanswered && !(await askConfirm(unanswered+' question(s) have no answer. Score anyway?','Score now'))) return;
  m.result=true; m.scoring=true; m.durationMin=Math.round((Date.now()-m.started)/60000); render();
  const prompt=`You are a senior Salesforce technical interviewer. Score this mock interview strictly but fairly. For each item compare the candidate's answer with the reference notes (the reference is guidance, not the only correct answer). Unanswered items score 0.
Reply with only JSON: {"overall": number 0-10 (one decimal), "items":[{"score": integer 0-10, "feedback": "2-3 sentences: what was good, what was missing, how to improve"}], "strengths":["..."], "gaps":["..."], "plan":["3-5 concrete next steps"]}. The items array must have exactly ${m.items.length} entries in order.

${m.items.map((x,i)=>`ITEM ${i+1} (${x.kind}${x.topic?', '+(AREA_LABEL[x.topic]||x.topic):''})
QUESTION: ${x.q}
REFERENCE: ${String(x.model).slice(0,1500)}
ANSWER: ${x.answer.trim().slice(0,4000)||'(no answer)'}`).join('\n\n')}`;
  try{
    const r=await askJson(prompt,{modelTier:'default'});
    if(!r || !Array.isArray(r.items)) throw {code:'invalid_json'};
    m.items.forEach((x,i)=>{ const s=r.items[i]||{}; x.score=Math.max(0,Math.min(10,Math.round(+s.score||0))); x.feedback=String(s.feedback||''); });
    m.overall=Math.round((+r.overall||m.items.reduce((s,x)=>s+x.score,0)/m.items.length)*10)/10;

    commitMock(m);
  }catch(e){ m.scoring=false; m.mode='self'; m.aiError=aiErr(e); render(); }
}

{"role":"short role title","score": integer 0-100 overall fit,"matched":[{"skill":"...","evidence":"where the candidate shows it"}],"gaps":[{"skill":"...","action":"concrete way to close or address it","topic":"one portal topic id or empty"}],"highlight":["resume bullets rewritten to fit this job, max 4"],"revise":["portal topic ids to revise first, max 5"],"questions":["8 likely interview questions for this role"],"pitch":"a 3-sentence answer to 'why are you a fit for this role'"}

${jd.slice(0,12000)}`;

  const js=$('#jobSave'); if(js) js.onclick=()=>{ const j=readJob(); if(!j.company){ toast('Add the company name'); return; } const i=S.jobs.findIndex(x=>x.id===j.id); if(i>=0) S.jobs[i]=j; else S.jobs.unshift(j); save(); toast('Saved'); jobEdit=null; render(); checkBadges(); };
  const jd=$('#jobDel'); if(jd) jd.onclick=async()=>{ if(await askConfirm('Delete this application?','Delete')){ S.jobs=S.jobs.filter(x=>x.id!==jobEdit.id); save(); jobEdit=null; render(); } };
  const jm=$('#jobMatch'); if(jm) jm.onclick=async()=>{ const j=readJob(); const r=await runMatch(j.jd||'', $('#jobMatchOut')); if(r){ j.match=r; const i=S.jobs.findIndex(x=>x.id===j.id); if(i>=0){ S.jobs[i]=j; save(); } } };
  const jp=$('#jobPractise'); if(jp) jp.onclick=()=>{ const j=readJob(); openTutor(`Run a mock interview for ${j.role||'this role'} at ${j.company||'this company'}. Ask me these questions one at a time, wait for my answer, then score it and suggest a stronger answer:\n${j.questions.map((q,i)=>(i+1)+'. '+q).join('\n')}`); };
  // standalone matcher
  const md=$('#mdGo'); if(md) md.onclick=async()=>{ window._jdDraft=$('#mdJd').value; const r=await runMatch(window._jdDraft, $('#mdOut')); if(r) window._jdResult=r; };
  const ms=$('#mdSave'); if(ms) ms.onclick=()=>{ const jdText=$('#mdJd').value; const r=window._jdResult; jobEdit={id:uid(),stage:'Wishlist',questions:[],jd:jdText,role:r&&r.role||'',match:r||null}; careerTab='jobs'; render(); };
  // certs
  $$('[data-certadd]').forEach(b=>b.onclick=()=>{ const s=CERT_SUGGEST.find(x=>x.name===b.dataset.certadd); S.certs.push({id:uid(),name:s.name,areas:s.areas,status:'Planned',date:''}); save(); render(); });
  $$('[data-certdel]').forEach(b=>b.onclick=()=>{ S.certs=S.certs.filter(c=>c.id!==b.dataset.certdel); save(); render(); });
  $$('[data-certf]').forEach(el=>el.onchange=()=>{ const [id,f]=el.dataset.certf.split('.'); const c=S.certs.find(x=>x.id===id); if(c){ c[f]=el.value; save(); render(); } });
  bindMatchLinks();
}

/* ---------------- GLOSSARY & CHEAT SHEETS ---------------- */
function vGlossary(){
  const q=(window._gq||'').toLowerCase(); const f=window._gf||'all';
  const list=GLOSSARY.filter(([t,a,d])=>(f==='all'||a===f)&&(!q||(t+' '+d).toLowerCase().includes(q)));
  const areas=[['all','All'],['dc','Data 360'],['rc','Revenue Cloud'],['af','Agentforce'],['core','Core platform']];
  const colOf=a=>a==='core'?'#2563eb':MODS[a].color;
  return `<h1>Glossary</h1><p class="sub">${GLOSSARY.length} terms in plain English. Every term is also a flashcard.</p>
  <div class="card" style="margin-bottom:16px"><div class="stat"><div class="k">Cheat sheets to download</div></div><p class="muted" style="margin:6px 0 10px">One-page revision sheets built from your lessons, glossary and interview answers. Download as a web page and print or save as PDF from your browser.</p>
   <div class="row">${[['dc','Data 360'],['rc','Revenue Cloud'],['af','Agentforce'],['core','Core platform & clouds']].map(([k,l])=>`<button class="btn" data-sheet="${k}" style="--vc:${colOf(k)}">${l}</button>`).join('')}</div></div>
  <div class="tabs">${areas.map(([k,l])=>`<button class="tab ${f===k?'active':''}" data-gf="${k}">${l}</button>`).join('')}</div>
  <input type="text" id="gq" placeholder="Search terms…" value="${esc(window._gq||'')}" style="margin-bottom:12px">
  <div class="gloss">${list.map(([t,a,d])=>`<div class="gterm" style="--c:${colOf(a)}"><b>${esc(t)}</b><span>${esc(d)}</span></div>`).join('')||'<p class="muted">No matching terms.</p>'}</div>`;
}
function cheatSheet(k){
  const title={dc:'Data 360',rc:'Revenue Cloud',af:'Agentforce',core:'Core platform & clouds'}[k];
  const days={dc:[7,14,21],rc:[28,35,42],af:[49,56,63],core:[]}[k];
  const terms=GLOSSARY.filter(g=>g[1]===k);
  const topics=k==='core'?IV_TOPICS:[];
  const sec=days.map(n=>READ[n]?`<section><h2>${esc(LESSONS[n-1].t)}</h2>${READ[n].r}</section>`:'').join('');
  const qa=topics.map(t=>`<section><h2>${esc(t.title)}</h2>${t.qa.map(([q,a])=>`<p><b>${esc(q)}</b><br>${esc(a)}</p>`).join('')}</section>`).join('');
  return `<!doctype html><html><head><meta charset="utf-8"><title>${title} cheat sheet</title><style>body{font:13px/1.5 system-ui,sans-serif;max-width:900px;margin:24px auto;padding:0 16px;color:#1b2033}h1{font-size:22px}h2{font-size:15px;margin:18px 0 6px;border-bottom:1px solid #ddd;padding-bottom:4px}h5{margin:10px 0 4px}dt{font-weight:700}dd{margin:0 0 6px}ul{padding-left:18px}@media print{section{break-inside:avoid}}</style></head><body><h1>${title} — cheat sheet</h1><p>Generated ${todayKey()} from Tri-Cloud Lab.</p>${sec}${qa}${terms.length?`<section><h2>Glossary</h2><dl>${terms.map(([t,a,d])=>`<dt>${esc(t)}</dt><dd>${esc(d)}</dd>`).join('')}</dl></section>`:''}</body></html>`;
}
function bindGlossary(){
  $$('[data-gf]').forEach(b=>b.onclick=()=>{ window._gf=b.dataset.gf; render(); });
  const g=$('#gq'); if(g) g.oninput=debounce(()=>{ window._gq=g.value; render(); const n=$('#gq'); n.focus(); n.setSelectionRange(n.value.length,n.value.length); },200);
  $$('[data-sheet]').forEach(b=>b.onclick=()=>downloadText('cheat-sheet-'+b.dataset.sheet+'.html', cheatSheet(b.dataset.sheet)));
}

/* ---------------- PLAYGROUND ---------------- */
const PG_LANGS={apex:'Apex',lwcjs:'LWC JavaScript',html:'LWC HTML',soql:'SOQL',other:'Other / pseudo-code'};
const PG_STARTERS={
 blank:{lang:'apex',code:'public with sharing class MyClass {\n    \n}\n'},
 trigger:{lang:'apex',code:'trigger ContactTrigger on Contact (before insert, before update) {\n    for (Contact c : Trigger.new) {\n        // TODO\n    }\n}\n'},
 buggy:{lang:'apex',code:'// Find the problems in this trigger\ntrigger OppTrigger on Opportunity (after update) {\n    for (Opportunity o : Trigger.new) {\n        Account a = [SELECT Id, Total__c FROM Account WHERE Id = :o.AccountId];\n        a.Total__c = a.Total__c + o.Amount;\n        update a;\n    }\n}\n'},
 lwc:{lang:'lwcjs',code:"import { LightningElement, api, wire } from 'lwc';\n\nexport default class MyComponent extends LightningElement {\n    @api recordId;\n}\n"},
 soql:{lang:'soql',code:'SELECT Id, Name, (SELECT Id, Email FROM Contacts)\nFROM Account\nWHERE CreatedDate = LAST_N_DAYS:30\n'}
};
function vPlay(){
  const pg=S.drafts&&S.drafts.playground||{lang:'apex',code:PG_STARTERS.buggy.code};
  const lines=(pg.code.match(/\n/g)||[]).length+1;
  return `<h1>Code Playground</h1><p class="sub">Write Apex, LWC or SOQL and get instant feedback from Claude on bugs, governor limits, security and tests. Code isn't executed here — deploy to your org to run it.</p>
  <div class="pg"><div class="card" style="min-width:0"><div class="row" style="gap:8px;margin-bottom:8px"><select id="pgLang" style="width:auto">${Object.entries(PG_LANGS).map(([k,v])=>`<option value="${k}" ${pg.lang===k?'selected':''}>${v}</option>`).join('')}</select>
    <select id="pgStarter" style="width:auto"><option value="">Load a starter…</option><option value="buggy">Spot the bugs (trigger)</option><option value="trigger">Trigger skeleton</option><option value="lwc">LWC skeleton</option><option value="soql">SOQL example</option><option value="blank">Blank class</option></select>
    <button class="btn sm" id="pgSave" style="margin-left:auto">Save as snippet</button></div>
   <div class="editor"><pre class="gutter" id="pgGutter" aria-hidden="true">${Array.from({length:lines},(_,i)=>i+1).join('\n')}</pre><textarea id="pgCode" spellcheck="false" aria-label="Code editor">${esc(pg.code)}</textarea></div>
   <div class="row" style="margin-top:10px">${[['review','Review my code'],['explain','Explain it'],['tests','Write a test class'],['bulk','Make it bulk-safe'],['security','Security check']].map(([k,l],i)=>`<button class="btn ${i===0?'primary':''}" data-pg="${k}">${l}</button>`).join('')}<button class="btn" id="pgStop" hidden>Stop</button></div></div>
   <div class="card pgout" style="min-width:0"><div class="stat"><div class="k">Feedback</div></div><div id="pgOut" class="tbody">${window._pgOut?fmtTutor(window._pgOut):'<p class="muted">Choose an action. Try "Spot the bugs" with Review — it has three classic interview mistakes.</p>'}</div></div></div>`;
}
let pgCtl=null;
function bindPlay(){
  const ta=$('#pgCode'), gut=$('#pgGutter'); if(!ta) return;
  const persist=debounce(()=>{ S.drafts=S.drafts||{}; S.drafts.playground={lang:$('#pgLang').value, code:ta.value}; save(); },600);
  const syncG=()=>{ const n=(ta.value.match(/\n/g)||[]).length+1; gut.textContent=Array.from({length:n},(_,i)=>i+1).join('\n'); gut.scrollTop=ta.scrollTop; };
  ta.oninput=()=>{ syncG(); persist(); }; ta.onscroll=()=>{ gut.scrollTop=ta.scrollTop; };
  ta.onkeydown=e=>{ if(e.key==='Tab'){ e.preventDefault(); const s=ta.selectionStart, en=ta.selectionEnd; ta.value=ta.value.slice(0,s)+'    '+ta.value.slice(en); ta.selectionStart=ta.selectionEnd=s+4; syncG(); persist(); } };
  $('#pgLang').onchange=persist;
  $('#pgStarter').onchange=e=>{ const st=PG_STARTERS[e.target.value]; if(!st) return; ta.value=st.code; $('#pgLang').value=st.lang; syncG(); persist(); e.target.value=''; };
  $('#pgSave').onclick=()=>{ S.snippets.unshift({id:uid(),mod:'iv',title:'Playground '+todayKey(),kind:PG_LANGS[$('#pgLang').value],body:ta.value,date:todayKey()}); save(); toast('Saved to Notes & Snippets'); };
  const asks={review:'Review this code like a senior Salesforce developer in a code review. List bugs, governor-limit risks, security issues (CRUD/FLS/sharing, injection) and missing tests in order of severity, then show a corrected version.',explain:'Explain what this code does, step by step, for an interview walkthrough. Then list two follow-up questions an interviewer might ask.',tests:'Write a complete test class for this code: bulk (200 records), positive and negative cases, mocks where needed, and Assert class assertions. Explain coverage briefly.',bulk:'Rewrite this code to be fully bulk-safe (no SOQL/DML in loops, collections and maps), explaining each change.',security:'Do a security review: CRUD/FLS, sharing, SOQL injection, XSS (for LWC), secrets, and how to fix each issue.'};
  $$('[data-pg]').forEach(b=>b.onclick=async()=>{ const out=$('#pgOut'); const code=ta.value.trim(); if(!code){ toast('Write some code first'); return; } out.innerHTML='<p class="muted">Thinking…</p>'; $('#pgStop').hidden=false; pgCtl=new AbortController();
    try{ const {text}=await ask(asks[b.dataset.pg]+'\n\nLanguage: '+PG_LANGS[$('#pgLang').value]+'\n\nCODE:\n'+code.slice(0,20000),{cache:false,signal:pgCtl.signal,onText:({text})=>{ out.innerHTML=fmtTutor(text); }}); window._pgOut=text; out.innerHTML=fmtTutor(text); }
    catch(e){ out.innerHTML=(e&&e.text?fmtTutor(e.text):'')+'<p class="muted">'+esc(aiErr(e))+'</p>'; }
    $('#pgStop').hidden=true; });
  $('#pgStop').onclick=()=>{ if(pgCtl) pgCtl.abort(); };
}

/* ---------------- WEEKLY REPORTS (written by the Sunday task) ---------------- */
async function loadReports(){
  if(!SYNC.ready || !SYNC.db) return;
  try{ const snap=await SYNC.db.collection(SYNC.base).get(); window.REPORTS=snap.docs.filter(d=>d.id.startsWith('weekly-')).map(d=>d.data()).filter(r=>r&&r.date).sort((a,b)=>String(b.date).localeCompare(String(a.date))).slice(0,8); if(view==='today') rerenderKeepScroll(); }catch(e){}
}

/* ---------------- dispatcher ---------------- */
function bindFeatures(){
  if(view==='today') bindToday();
  else if(view==='cards') bindCards();
  else if(view==='mock') bindMock();
  else if(view==='career') bindCareer();
  else if(view==='glossary') bindGlossary();
  else if(view==='play') bindPlay();
}

ensureState(); if(S.mockDraft && S.mockDraft.items){ MOCK=S.mockDraft; }
buildNav(); render(); bindTutor(); bindFocus(); initCloud(); checkBadges();
</script>
