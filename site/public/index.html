/* ---------------- WEEK 2 ---------------- */
READ[8] = {r:`
<p><b>Mapping</b> turns source-shaped DLO records into standard DMO records. One DLO can — and usually should — feed several DMOs.</p>
<h5>A worked example</h5>
<p>An app-user DLO with columns id, first name, last name, email and phone maps to:</p>
<ul>
<li><b>Individual</b>: Individual Id ← id; First/Last Name.</li>
<li><b>Contact Point Email</b>: its own Id (derived from the source key), Email Address ← normalised email, Party ← id.</li>
<li><b>Contact Point Phone</b>: same pattern.</li>
<li><b>Party Identification</b>: Id ← a prefixed key, Identification Name ← constant "Nimbus App ID", Identification Number ← id, Party ← id.</li>
</ul>
<h5>Rules of thumb</h5>
<ul>
<li>Every DMO record needs a stable unique ID. Derive it from the source primary key so re-ingestion updates rather than duplicates.</li>
<li>Always populate <b>Party</b> on contact points and Party Identification.</li>
<li>IDs must be unique across sources too — prefixes (APP-, BILL-) avoid collisions.</li>
<li>Only map what you need; unmapped fields remain in the DLO for later.</li>
<li>CRM starter bundles create these mappings for Contacts and Leads automatically — study them as reference patterns.</li>
</ul>`,
 iv:"I map one DLO to several DMOs — Individual, contact points and Party Identification — deriving every DMO ID from the source key so re-ingestion is idempotent, and always populating the Party reference so identity resolution can use the contact points.",
 refs:[REF.DCINT,THS("Data Cloud data mapping")]};

READ[9] = {r:`
<p>Standard DMOs cover people and common engagement, but most businesses have data that needs <b>custom DMOs</b> — subscriptions, devices, usage events, policies.</p>
<h5>Creating custom DMOs</h5>
<p>You can create a custom DMO directly from the mapping screen. Choose the right category (Engagement for usage events, Other for subscription summaries) and keep field names business-friendly; the API name gets the __dlm suffix and fields get __c.</p>
<h5>Relationships</h5>
<p>A relationship tells Data 360 how two DMOs join, with cardinality (1:1, N:1). Usage Event → Individual is N:1: many events belong to one person. Without relationships:</p>
<ul><li>segment builder can't filter people by related data,</li><li>calculated insights joins become harder to reason about,</li><li>data graphs can't include the related object.</li></ul>
<h5>Engagement data specifics</h5>
<p>Engagement DMOs need an event-time field and are usually large. Keep them lean: an ID, the person reference, an event type, a quantity and a timestamp go a long way. Pre-aggregate into insights rather than scanning raw events repeatedly.</p>`,
 iv:"Custom DMOs model business data the standard model lacks; I set the right category and define relationships with correct cardinality so segments, insights and data graphs can traverse from the unified individual to related records.",
 refs:[REF.DCINT,THS("Data Cloud data model relationships")]};

READ[10] = {r:`
<p><b>Identity resolution</b> decides which records refer to the same real person (or account) and builds a unified profile. It is the heart of Data 360 and the most common interview topic.</p>
<h5>Rulesets</h5>
<p>A ruleset targets Individual (or Account) and contains <b>match rules</b> and <b>reconciliation rules</b>. You can have more than one ruleset, for example a strict one for service and a looser one for marketing.</p>
<h5>Match rules</h5>
<ul>
<li>Each rule has one or more criteria that must <i>all</i> match.</li>
<li>If <i>any</i> rule matches, records link — so rules are OR-ed together. One loose rule can cause false merges across the whole data set.</li>
<li>Methods: <b>exact</b>, <b>exact normalised</b> (ignores case, spacing and formatting for emails, phones and addresses) and <b>fuzzy</b> (available on a limited set of fields, notably first name, at configurable precision).</li>
<li>Party Identification matching (ID type + value) is highly reliable when systems share IDs.</li>
</ul>
<h5>Reconciliation rules</h5>
<p>When linked records disagree, reconciliation picks the value for the unified profile: <b>Last Updated</b>, <b>Most Frequent</b> or <b>Source Priority</b> (rank the sources). You can set a default and override it per field.</p>
<h5>Outputs</h5>
<p>A run produces <b>Unified Individual</b> records and <b>unified link</b> objects mapping every source record ID to its unified ID. The link object is what you join through in SQL and what lets you get from a unified profile back to the CRM Contact. The <b>consolidation rate</b> shows how much the record count shrank.</p>
<h5>Design trade-off</h5>
<p>False negatives (missed matches) annoy marketers; false positives (merging two different people) can leak one customer's data to another — far worse, especially when agents use the profile. Prefer stricter rules for service and agent use cases.</p>`,
 iv:"A ruleset combines match rules — OR-ed together, each with AND-ed criteria using exact, normalised or fuzzy methods — with reconciliation rules such as source priority or last updated. Outputs are unified profiles plus link objects. I bias toward precision because a false merge can expose one customer's data to another, especially through agents.",
 refs:[REF.DCQS,THS("Data Cloud identity resolution")]};

READ[11] = {r:`
<p>Today you run the ruleset and judge whether the result is right.</p>
<h5>Reading the result</h5>
<ul>
<li><b>Consolidation rate</b> vs your oracle (~40%).</li>
<li><b>Profile Explorer</b>: search a known overlapping person and confirm all expected sources appear on one profile, and that reconciled values (such as email from CRM) are correct.</li>
<li><b>Spot checks</b>: a person who should <i>not</i> merge (same surname, different phone) stays separate.</li>
</ul>
<h5>Troubleshooting</h5>
<ul>
<li>Too few merges: emails not normalised, Party missing on contact points, or the wrong field mapped.</li>
<li>Too many merges: a rule with a single weak criterion (surname only, fuzzy on its own).</li>
<li>Results unchanged after edits: rulesets run on a schedule or on demand — rerun after changes and allow processing time.</li>
</ul>
<h5>Operating it</h5>
<p>In production, identity runs are scheduled (often daily). Document every rule with its business reason — auditors and future admins will ask why two records merged.</p>`,

READ[12] = {r:`
<p>SQL is how you prove things in Data 360. It also powers calculated insights and code that calls Data 360.</p>
<h5>Naming conventions</h5>
<ul><li>DMO API names end in <b>__dlm</b>; DLOs in <b>__dll</b>.</li><li>Standard DMO fields typically carry the <b>ssot__</b> prefix (for example ssot__EmailAddress__c); custom fields end __c.</li><li>Unified objects and link objects created by your ruleset may carry a ruleset suffix — copy names from the Data Model tab.</li></ul>
<h5>Where SQL runs</h5>
<ul>
<li><b>Query Editor</b> in the Data 360 app for ad-hoc checks.</li>
<li><b>Query API</b> (REST) for external apps.</li>
<li><b>ConnectApi in Apex</b> (CdpQuery) to query from Flows and agent actions.</li>
<li><b>Calculated insights</b> (persisted aggregations).</li>
</ul>
<h5>Useful validation queries</h5>
<ul><li>Count records per source DLO and compare with the source system.</li><li>Find emails linked to more than one unified ID (missed matches).</li><li>Count source records per unified ID and inspect the largest (possible over-merging).</li></ul>
<h5>Performance tips</h5>
<p>Select only needed columns, filter early, and prefer querying insights over raw engagement data.</p>`,
 iv:"I use ANSI SQL over __dlm objects in Query Editor to validate ingestion and identity — for example finding emails linked to multiple unified IDs — and call the same queries from Apex via ConnectApi or externally through the Query API.",
 refs:[REF.DCQS,THS("Data Cloud query API")]};

READ[13] = {r:`
<p>The <b>Ingestion API</b> lets any system push data into Data 360.</p>
<h5>Two modes</h5>
<ul>
<li><b>Streaming</b>: send small JSON batches to an object endpoint; processed asynchronously within minutes. Required for streaming insights.</li>
<li><b>Bulk</b>: create a job, upload CSV files, close the job — for large historical loads.</li>
</ul>
<h5>Setup sequence</h5>
<ol>
<li>Write an <b>OpenAPI (YAML) schema</b> describing each object and field type.</li>
<li>Create an <b>Ingestion API connector</b> and upload the schema.</li>
<li>Create a <b>data stream</b> per object, choosing category, primary key and event time.</li>
<li>Create an OAuth app (External Client App in newer orgs) with the Data 360 ingestion scope.</li>
<li>Authenticate: get a Salesforce access token, then <b>exchange</b> it at the a360 token endpoint for a Data 360 token plus the tenant URL.</li>
<li>POST to the tenant's ingest endpoint for your connector and object. A <b>202 Accepted</b> means queued, not yet queryable.</li>
</ol>
<h5>Good practice</h5>
<ul><li>Make event IDs unique (UUIDs) so retries don't duplicate.</li><li>Batch events (hundreds per call) rather than one per call.</li><li>Never hard-code secrets; use named credentials or environment variables.</li><li>Note: the OAuth username-password flow is being retired (Winter ’27) — use client credentials or JWT for integrations.</li></ul>`,
 iv:"Define an OpenAPI schema, create the connector and stream, authenticate with an OAuth app and exchange the token for a Data 360 token, then POST JSON batches for streaming or CSV jobs for bulk. 202 means accepted asynchronously; I use unique event IDs so retries are idempotent.",
 refs:[REF.DCING,REF.DCBULK,REF.DCQS]};

READ[14] = {r:`
<h5>Week 2 cheat sheet</h5>
<ul>
<li><b>Mapping</b>: one DLO → many DMOs; derive DMO IDs from source keys; always set Party.</li>
<li><b>Custom DMOs</b> + <b>relationships</b> (N:1 events → Individual) enable segments, insights and data graphs.</li>
<li><b>Identity</b>: match rules OR-ed, criteria AND-ed; exact / exact normalised / fuzzy; Party Identification matches.</li>
<li><b>Reconciliation</b>: Last Updated, Most Frequent, Source Priority — default plus per-field overrides.</li>
<li><b>Outputs</b>: Unified Individual + unified link objects; consolidation rate.</li>
<li><b>SQL</b>: __dlm DMOs, ssot__ fields; Query Editor, Query API, ConnectApi.</li>
<li><b>Ingestion API</b>: YAML schema → connector → stream → OAuth app → token exchange → POST (202).</li>
</ul>
<h5>Typical scenario questions</h5>

/* ---------------- WEEK 3 ---------------- */
READ[15] = {r:`
<p><b>Calculated insights</b> are reusable, persisted metrics defined in SQL (or a visual builder).</p>
<h5>Structure</h5>
<ul><li><b>Dimensions</b> are the group-by keys (for example unified individual ID, product).</li><li><b>Measures</b> are aggregations (SUM, COUNT, AVG) — names end in __c.</li><li>An insight must group by its dimensions; every non-aggregated column must be a dimension.</li></ul>
<h5>The standard join pattern</h5>
<p>Engagement DMO → unified link object (source ID → unified ID) → Unified Individual. This rolls activity from every source up to the real person.</p>
<h5>Using insights</h5>
<ul><li>Segment filters ("errors in last 30 days greater than 5").</li><li>Copy Field enrichment onto CRM records.</li><li>Agent grounding and prompt templates.</li><li>Data actions (on change).</li></ul>
<h5>Operations</h5>
<p>Insights run on a schedule; choose the slowest schedule the business accepts. Use the syntax checker — function support (especially date arithmetic) can vary by release. Test the SQL in Query Editor first.</p>`,
 iv:"Calculated insights are scheduled SQL aggregations with dimensions and measures; I join engagement data through the unified link to unified individuals, then reuse the result in segments, CRM enrichment and agent grounding.",
 refs:[REF.DCQS,THS("Data Cloud calculated insights")]};

READ[16] = {r:`
<p><b>Streaming insights</b> evaluate data continuously as it arrives, over time windows, to detect conditions in near real time.</p>
<h5>How they differ from calculated insights</h5>
<ul><li>Input: streaming sources only (Ingestion API streaming, Web/Mobile SDK).</li><li>Output: short-lived windowed results (for example error count per user per 5 minutes).</li><li>Purpose: triggering <b>data actions</b>, not reporting.</li></ul>
<h5>Windows</h5>
<p>A window groups events by event time (for example 5 minutes). Results become available after the window closes, so detection latency is roughly window length plus processing time. Shorter windows react faster but see less data.</p>
<h5>Design tips</h5>
<ul><li>Group by the identifier you'll need downstream (app user ID or unified ID).</li><li>Make the threshold a business decision and document it.</li><li>Expect duplicates if events are resent — dedupe on event ID at ingestion.</li></ul>`,
 iv:"Streaming insights aggregate streaming data over time windows to detect conditions in near real time — such as an error spike — and exist mainly to trigger data actions. Latency is roughly the window length plus processing.",
 refs:[REF.DCQS,THS("Data Cloud streaming insights")]};

READ[17] = {r:`
<p><b>Segments</b> define audiences; <b>activations</b> deliver them somewhere.</p>
<h5>Segments</h5>
<ul><li>Built on a target (usually Unified Individual) with filters on attributes, related data and insights.</li><li>Published on a schedule (standard or rapid publish for some targets).</li><li>Can be nested or excluded (in segment A but not B).</li></ul>
<h5>Activation targets and activations</h5>
<ul><li><b>Targets</b>: Marketing Cloud Engagement, cloud storage, ad platforms, Salesforce orgs and others.</li><li><b>Activation</b>: chooses the segment, the target, the contact points to send (for example email) and additional attributes.</li><li>Consent should be applied before activation.</li></ul>
<h5>Segment vs data action</h5>
<p>Segments are batch audiences for campaigns. Data actions react to individual events in near real time. In interviews, choosing the right one for the scenario is often the whole question.</p>`,
 iv:"Segments are scheduled audiences built on unified profiles and insights; activations send them with chosen contact points to targets like Marketing Cloud or ad platforms. For per-customer real-time reactions I use data actions instead.",
 refs:[REF.DCQS,THS("Data Cloud segmentation activation")]};

READ[18] = {r:`
<p><b>Data actions</b> connect Data 360 events to business processes.</p>
<h5>Flow of a data action</h5>
<ol><li>A <b>data action target</b> defines the destination: Salesforce platform event, webhook, or Marketing Cloud.</li><li>A <b>data action</b> watches a streaming insight or DMO, with a rule (for example error_count ≥ 6), optionally enriched with related fields.</li><li>For Salesforce targets, the platform publishes the standard <b>DataObjectDataChgEvent</b>; the record values are JSON in <b>PayloadCurrentValue</b>, and the action name is available for filtering.</li><li>A <b>platform event–triggered Flow</b> subscribes, filters on the action name, and calls invocable Apex to parse JSON or query Data 360.</li></ol>
<h5>Gotchas</h5>
<ul><li>Platform-event flows run as the Automated Process user by default — set a running user if your Apex or queries need specific permissions.</li><li>Capture one real payload before writing parsing code.</li><li>Design idempotency: the same condition may fire repeatedly; check for an existing open task or case first.</li></ul>`,
 iv:"A data action target defines the destination; the data action applies a rule to a streaming insight or DMO. For Salesforce targets it publishes DataObjectDataChgEvent, which a platform-event Flow consumes, parsing PayloadCurrentValue in Apex. I set a running user and make the handler idempotent.",
 refs:[REF.DCQS,THS("Data Cloud data actions")]};

READ[19] = {r:`
<p>Two ways to make Data 360 useful inside CRM and to agents: <b>enrichment</b> and <b>data graphs</b>.</p>
<h5>Enrichment</h5>
<ul><li><b>Copy Field</b>: writes selected Data 360 values (for example a 30-day usage measure) onto a CRM field, so reports, Flows and list views can use it.</li><li><b>Related List</b>: shows Data 360 records (for example recent events) on a CRM record page without copying them.</li></ul>
<p>Copy only summary values — copying raw events wastes storage.</p>
<h5>Data graphs</h5>
<p>A data graph pre-joins a primary object (for example Unified Individual) with related DMOs and insights into a JSON document optimised for fast lookup. They power real-time personalisation and are a key grounding source for Agentforce. Summer ’26 added row-level security for data graphs, so agents only retrieve what the user is allowed to see.</p>`,
 iv:"Copy Field enrichment puts summary metrics on CRM records; related lists show Data 360 records in context. Data graphs pre-join a unified profile with related data for low-latency lookups and are how I'd ground agents securely, now with row-level security.",
 refs:[REF.DCQS,REF.DCS26,THS("Data Cloud data graph")]};

READ[20] = {r:`

/* ---------------- WEEK 4 · Revenue Cloud catalog ---------------- */
READ[22] = {r:`
<p><b>Revenue Cloud</b> on the core platform — also called Revenue Lifecycle Management (RLM) or Revenue Cloud Advanced, and labelled <b>Revenue Management</b> in the newest preview docs — manages the whole product-to-cash process natively on Salesforce objects.</p>
<h5>How it differs from legacy Salesforce CPQ</h5>
<ul><li>Legacy CPQ is a managed package (SBQQ objects, price rules, the CPQ calculator). RLM is built into the platform with standard objects and APIs.</li><li>Pricing uses <b>pricing procedures</b> and <b>context definitions</b> rather than price rules.</li><li>Configuration uses the Product Configurator with constraint modelling.</li><li>Everything is API-first: the UI and the Connect REST APIs call the same services, so agents and integrations can quote headlessly.</li></ul>
<h5>Components</h5>
<ul>
<li><b>Product Catalog Management</b>: products, attributes, classifications, bundles, selling models, catalogs.</li>
<li><b>Salesforce Pricing</b>: price books, pricing procedures, adjustments, decision tables, price waterfall.</li>
<li><b>Product Configurator</b>: guided configuration and rules.</li>
<li><b>Transaction Management</b>: quotes and orders.</li>
<li><b>Asset lifecycle</b>: assets, amendments, renewals, cancellations.</li>
<li><b>Billing</b>, <b>Dynamic Revenue Orchestrator</b> (fulfilment), <b>Usage Management</b>, contracts and document generation.</li>
</ul>
<h5>Recent changes worth knowing</h5>
<p>Winter ’26 added a guided setup (Salesforce GO), multiple formulas per pricing formula element, catalog caching, quote deep clone, an enhanced transaction line editor and asset transfers between accounts.</p>`,
 iv:"Revenue Cloud is Salesforce's native, API-first quote-to-cash: catalog management, Salesforce Pricing with pricing procedures, a configurator, transaction management, assets, billing, fulfilment orchestration and usage. Unlike legacy CPQ it isn't a managed package and doesn't use the SBQQ price-rule engine.",
 refs:[REF.RCTH1,REF.RCDEV,THS("Revenue Cloud")]};

READ[23] = {r:`
<p>Knowing the object model lets you debug almost any catalog problem.</p>
<h5>Core objects</h5>

READ[24] = {r:`
<p>A <b>product selling model</b> describes the commercial shape of a sale.</p>
<h5>The three types</h5>
<ul><li><b>One Time</b>: a single charge (hardware, set-up fees).</li><li><b>Term Defined</b>: recurring for a fixed term, such as 12 months; renewals create a new term.</li><li><b>Evergreen</b>: recurring with no end until cancelled (monthly plans).</li></ul>
<h5>Pricing term</h5>
<p>Pricing term and unit say what the list price means: £18 with a 1-month pricing term is £18 per month. Over a 12-month term the total is 12 × unit price × quantity (before adjustments).</p>
<h5>Proration</h5>
<p>A <b>proration policy</b> decides how partial periods are charged when a customer amends mid-term — for example whole months plus a daily remainder. It directly affects amendment totals, so define it before testing.</p>
<h5>Design tips</h5>
<p>Create the minimum set of selling models the business actually uses, give them clear names, and price each product per model explicitly.</p>`,
 iv:"One Time, Term Defined and Evergreen selling models define the commercial shape; pricing term and unit define what list price means; proration policies govern partial-period charges on amendments.",
 refs:[REF.RCTH4,REF.RCDEV]};

READ[25] = {r:`
<p>Attributes describe configurable characteristics (colour, connectivity, size) without creating a separate product for every combination.</p>
<h5>The building blocks</h5>
<ol><li><b>Attribute picklists</b>: allowed values (4G, 5G).</li><li><b>Attribute definitions</b>: the attribute itself, its data type, default and whether it's required.</li><li><b>Attribute categories</b>: groups of definitions.</li><li><b>Product classifications</b>: templates bundling attribute categories; products based on a classification inherit its attributes.</li></ol>
<h5>Why classifications</h5>
<p>They keep large catalogs consistent: change the classification and every product based on it gets the change. They also feed attribute-based pricing and configuration rules.</p>
<h5>Avoid</h5>
<p>Creating SKUs for every variant ("Tracker 4G Dash", "Tracker 5G OBD"...). That explodes catalog size and makes pricing changes painful.</p>`,
 iv:"Picklists feed attribute definitions, which group into categories and then classifications; products based on a classification inherit its attributes. That avoids SKU explosion and drives both attribute-based pricing and configuration rules.",
 refs:[REF.RCTH4,REF.RCTH2]};

READ[26] = {r:`
<p><b>Catalogs</b> and <b>categories</b> control what sellers browse; price books control what things cost — keep the two ideas separate.</p>
<h5>Catalogs</h5>
<ul><li>A catalog groups categories for a purpose (region, channel, partner).</li><li>Categories can nest; a product can sit in several categories.</li><li>Winter ’26 added custom sort order for categories and caching for large catalogs.</li></ul>
<h5>Qualification</h5>
<p>Qualification and disqualification rules decide which products a particular customer or context is allowed to see (for example region-specific products). They're evaluated at browse time using context data.</p>
<h5>Design guidance</h5>
<p>Organise categories by how sellers think (needs, solutions), not by internal product codes.</p>`,
 iv:"Catalogs and categories organise what sellers can browse, qualification rules filter by context, and price books separately determine price.",
 refs:[REF.RCTH2,REF.RCDEV]};

READ[27] = {r:`

/* ---------------- WEEK 5 · Pricing & configuration ---------------- */
READ[29] = {r:`
<p><b>Salesforce Pricing</b> calculates prices with a configurable sequence of steps instead of hard-coded rules.</p>
<h5>Context definitions</h5>
<p>A context definition describes the data available to a pricing run — header (for example SalesTransaction) and line nodes (SalesTransactionItem), each with attributes — and <b>maps</b> those attributes to records such as Quote and QuoteLineItem. The standard definition is SalesTransactionContext.</p>
<h5>Pricing procedures</h5>
<p>A pricing procedure is an expression set (usage type Pricing) made of ordered <b>elements</b>: list price lookup, adjustments, discounts, formulas and rollups. It reads from and writes to the context.</p>
<h5>Decision tables</h5>
<p>Fast lookup tables (for example tier → discount) used by elements. They must be active and kept in sync.</p>
<h5>Price waterfall</h5>
<p>Each line shows how its price was built step by step — the main debugging and explanation tool for reps, finance and agents.</p>`,
 iv:"Pricing runs a pricing procedure — an ordered expression set of elements — over a context definition that maps quote and line data. Decision tables give fast lookups, and the price waterfall shows every step for each line.",
 refs:[REF.RCTH3,REF.RCDEV]};

READ[30] = {r:`
<h5>Price adjustment schedules</h5>
<p>Schedules apply discounts or prices by quantity bands.</p>
<ul><li><b>Volume</b>: once quantity reaches a tier, <i>all</i> units get that tier's price or discount.</li><li><b>Tiered (slab)</b>: each band is priced separately — the first 49 at one rate, the next units at another.</li></ul>
<p>Example, 60 units at £18 with 0% for 1–49 and 8% for 50+: volume gives 60 × 18 × 0.92 = £993.60; tiered gives 49 × 18 + 11 × 18 × 0.92 = £1,064.16.</p>
<h5>Attribute-based pricing</h5>
<p>Adjust price by attribute value (5G adds £30) without separate products. Define adjustments against the product and attribute; the pricing procedure applies them.</p>
<h5>Decision tables for business rules</h5>
<p>Partner discounts by customer tier are a natural decision table: input tier, output percentage.</p>`,
 iv:"Volume schedules apply the reached tier to all units; tiered schedules price each band separately. Attribute-based adjustments change price by configuration, and decision tables handle rule-style discounts such as partner tiers.",
 refs:[REF.RCTH3,REF.RCDEV]};

READ[31] = {r:`
<p>Context definitions are where most custom pricing projects succeed or fail.</p>
<h5>Anatomy</h5>
<ul><li><b>Nodes</b>: the shape of the data (header, items, related items).</li><li><b>Attributes</b>: the values a node exposes (quantity, list price, customer tier).</li><li><b>Mappings</b>: how attributes load from and save to objects and fields for each use (quote, order).</li></ul>
<h5>Extending</h5>

READ[32] = {r:`
<p>Building the procedure is ordering business logic.</p>
<h5>Typical order</h5>
<ol><li>List price (from the entry for the line's selling model).</li><li>Attribute-based adjustments.</li><li>Volume or tiered schedules.</li><li>Customer or partner discounts (decision table).</li><li>Manual discounts.</li><li>Subtotals and totals.</li></ol>
<p>Order changes results: a percentage discount before an uplift gives a different total than after. Agree the order with finance and document it.</p>
<h5>Operational steps</h5>

READ[33] = {r:`

/* ---------------- WEEK 7 · Agentforce foundations ---------------- */
READ[43] = {r:`
<p><b>Agentforce</b> is Salesforce's platform for AI agents that understand requests, reason about them and take actions on your data. Since Dreamforce 2025 it sits under the <b>Agentforce 360</b> umbrella, and agents are built in <b>Agentforce Studio</b> with the new Agentforce Builder.</p>
<h5>Anatomy of an agent</h5>
<ul>
<li><b>Subagents</b> (called <i>topics</i> in the legacy builder): areas of work such as Order Status or Device Troubleshooting, each with a description used for routing, instructions and allowed actions.</li>
<li><b>Instructions</b>: how to behave within a subagent.</li>
<li><b>Actions</b>: what the agent can do — Flows, Apex, prompt templates, APIs, standard actions.</li>
<li><b>Reasoning engine</b>: classifies the request, chooses a subagent, plans, calls actions and composes the reply.</li>
<li><b>Agent user</b>: the identity the agent runs as; its permissions limit what it can see and do.</li>
<li><b>Channels</b>: messaging, voice, Slack, Lightning (Agentforce Coworker) and external apps.</li>
</ul>
<h5>Agent types</h5>
<p>Service agents serve customers; employee agents help internal users. At Dreamforce 2026 (15 September) Salesforce also announced pre-configured "job-ready" agents and dropped "Agentforce" from the CRM app names.</p>
<h5>What changed in 2026</h5>
<p>The new builder adds <b>Agent Script</b> and hybrid reasoning. From 13 July 2026, new agents are created in Agentforce Studio rather than the legacy Setup builder; existing agents keep working and can be upgraded.</p>`,
 iv:"An agent is subagents (formerly topics) with routing descriptions and instructions, plus actions, orchestrated by a reasoning engine and running as a dedicated agent user. In 2026 agents are built in Agentforce Studio with Agent Script for deterministic control.",
 refs:[REF.AFDEV,REF.AFBEN,THS("Agentforce")]};

READ[44] = {r:`
<p>The <b>Einstein Trust Layer</b> is the set of protections between your data and the large language models.</p>
<h5>Main protections</h5>
<ul>
<li><b>Secure data retrieval and grounding</b>: data is fetched respecting user permissions before it reaches the prompt.</li>
<li><b>Data masking</b>: sensitive values (PII) can be masked before sending to the model and restored afterwards.</li>
<li><b>Zero data retention</b>: contracted model providers don't store prompts or responses or train on them.</li>
<li><b>Toxicity and safety detection</b>: responses are scored and can be filtered.</li>
<li><b>Audit trail</b>: prompts, responses and scores can be logged (stored in Data 360) for review.</li>
</ul>
<h5>Shared responsibility</h5>
<p>The Trust Layer doesn't replace good design: least-privilege agent users, clear scope, confirmation before sensitive actions and human escalation are still your job.</p>`,

READ[45] = {r:`
<p>The <b>new Agentforce Builder</b> offers two synchronised views of one agent.</p>
<h5>Canvas and Script</h5>
<ul><li><b>Agent Canvas</b>: visual, low-code editing with blocks.</li><li><b>Agent Script</b>: a text language mixing natural-language instructions with programming constructs. Editing either view updates the other.</li></ul>
<h5>Agent Script building blocks</h5>
<ul>
<li><b>config</b>: developer name, label, description, runtime options.</li>
<li><b>system</b>: global instructions and required messages (welcome, error).</li>
<li><b>variables</b>: typed, mutable values referenced as @variables.name.</li>
<li><b>start_agent</b>: the entry subagent that routes requests, often via transitions to other subagents.</li>
<li><b>subagent</b> blocks: description, reasoning instructions and actions.</li>
<li>Other blocks: access (default agent user), language, modality (voice), connection (escalation), connected subagents (beta) for multi-agent setups.</li>
</ul>
<h5>Hybrid reasoning</h5>
<p>Deterministic constructs (conditions, required sequences, transitions, actions that always run before reasoning) handle rules that must never vary; LLM reasoning handles open conversation. Put compliance steps — such as identity verification — in deterministic logic.</p>`,
 iv:"The new builder has a visual Canvas and Agent Script views that stay in sync. Script defines config, system, typed variables, a start_agent router and subagents with reasoning and actions, letting me mix deterministic rules with LLM reasoning.",
 refs:[REF.AFSCR,REF.AFBLK,REF.AFBEN]};

READ[46] = {r:`
<p>Routing quality decides whether an agent feels smart.</p>

<ul><li>Specific and testable: "Ask for the device ID before running diagnostics."</li><li>One idea per instruction.</li><li>Use deterministic logic instead of instructions for rules that must always happen.</li><li>Avoid vague goals like "be helpful".</li></ul>
<h5>Fixing misroutes</h5>

READ[50] = {r:`
<p>Flow actions are the fastest way to give an agent business logic.</p>
<h5>Requirements</h5>

<p>Guardrails work in layers; no single layer is enough.</p>

<li><b>Deterministic logic</b>: required steps (identity checks) enforced in Agent Script.</li>
<li><b>Permissions</b>: least-privilege agent user — instructions can be talked around; permissions can't.</li>
<li><b>Confirmation</b>: ask before sensitive actions such as creating cases or changing data.</li>

<li><b>Escalation</b>: hand to a human when unsure or asked.</li>

<p>Test with adversarial prompts: injection attempts, requests for other customers' data, and attempts to skip verification.</p>`,

READ[64] = {r:`
<p>The capstone combines all three clouds into one business process: <b>usage-based upsell</b>.</p>
<h5>The business case</h5>
<p>SaaS customers who consistently use close to (or beyond) what they bought are the best upsell candidates — and also at risk of a poor experience if limits bite. Spotting them manually doesn't scale.</p>
<h5>Division of responsibility</h5>
<ul><li><b>Data 360</b>: ingests and unifies usage, computes utilisation per customer, raises the signal.</li><li><b>Revenue Cloud</b>: knows what the customer owns (assets, entitlements), prices the upgrade, governs approval and ordering.</li><li><b>Agentforce</b>: explains the situation to the account team or customer and drafts the next step.</li></ul>
<h5>End-to-end flow</h5>
<p>Usage events → utilisation insight → data action → signal record (deduplicated) → draft upsell quote priced by the procedure → approval → agent-assisted outreach → order → updated assets.</p>`,
 iv:"Data 360 detects customers outgrowing their entitlement, Revenue Cloud prices and governs the upgrade from their assets, and Agentforce turns the signal into a grounded conversation — with approval before anything commercial is sent.",
 refs:[REF.DCQS,REF.RCDEV,REF.AFDEV]};

READ[65] = {r:`
<p>Utilisation needs two inputs: what was used (usage events in Data 360) and what was bought (assets or entitlements in CRM).</p>
<h5>Approach</h5>
<ol><li>Stream Asset (or entitlement) records into Data 360 with the CRM connector.</li><li>Relate them to the unified account or individual.</li><li>Calculated insight: usage over the period divided by entitled quantity.</li><li>Threshold rule (for example above 85% for two periods) defines the signal.</li></ol>
<h5>Why Data 360 rather than Apex</h5>
<p>Volume, scheduling, reuse (segments, agents, dashboards) and identity resolution across sources.</p>`,
 iv:"I bring assets into Data 360, relate them to unified accounts, and compute utilisation as usage divided by entitlement in a calculated insight, with a sustained threshold as the signal.",
 refs:[REF.DCINT,REF.RCDEV]};

READ[66] = {r:`
<p>Event-driven integrations need reliability design.</p>
<h5>Principles</h5>
<ul>
<li><b>Idempotency</b>: processing the same event twice must not create two quotes. Store a signal record with a unique key (customer + period) and check it first.</li>
<li><b>Retries</b>: platform events and data actions can redeliver; handlers must tolerate that.</li>
<li><b>Ordering</b>: don't assume events arrive in order; use timestamps.</li>
<li><b>Observability</b>: log what fired, when and what it did.</li>
<li><b>Failure handling</b>: fault paths in Flow; dead-letter records for manual review.</li>
</ul>`,
 iv:"I make event handlers idempotent with a unique signal key, tolerate redelivery and out-of-order events, log every action and route failures to a review queue.",
 refs:[THS("Platform events best practices")]};

PROJECTS.p1.html = `
<div class="callout info"><b>Naming note.</b> Salesforce renamed Data Cloud to <b>Data 360</b> at Dreamforce 2025. Setup pages, permission sets and docs may show either name; this guide uses "Data 360" with the older label where the UI often still uses it.</div>

<h2>1. Business scenario & problem statement</h2>
<p><b>Company:</b> <i>Nimbus Fleet Ltd</i> (fictional) — a UK B2B SaaS business selling GPS trackers plus a per-vehicle fleet-telematics subscription to around 2,000 logistics SMEs. The same company is used in all four projects so they connect into one portfolio story.</p>
<p><b>Operational pain points</b></p>
<ul>
 <li>The same customer exists in three places: Salesforce CRM Contacts, the product app's user table and the billing system — with different IDs, mixed-case emails and nicknames. Nobody trusts the "customer count".</li>
 <li>Customer Success Managers (CSMs) cannot see product usage, so churn risk is spotted only when the customer cancels.</li>
 <li>When devices start throwing errors, support hears about it days later from an angry fleet manager.</li>
</ul>
<p><b>Objectives (measurable)</b></p>
<ul>
 <li>Unify ~500 source records into ~300 unified individuals with a documented ruleset (≈40% consolidation on the synthetic data set).</li>
 <li>Ingest usage events through the Ingestion API and make them queryable within minutes.</li>
 <li>Compute a 30-day health insight (usage, errors, active devices) per unified customer and show it on the CRM Contact.</li>
 <li>Detect an error spike (≥6 <code class="i">alert_error</code> events in 5 minutes) and automatically create a CSM task and flag the Contact as <i>At Risk</i>.</li>
</ul>

<h2>2. Architecture & prerequisites</h2>
${C(`
 Salesforce CRM (Account, Contact) ─┐
 App users CSV (upload / cloud bucket)┤
 Billing accounts CSV ───────────────┼─► Data Streams ─► DLOs ─► DMOs
 Usage events (Ingestion API, stream)┘        (Individual, Contact Point Email/Phone,
                                               Party Identification, Product Usage Event)
                                                          │
                                         Identity Resolution ruleset
                                                          ▼
                                                 Unified Individual
                              ┌───────────────────────────┴───────────────────────────┐
              Calculated Insight (30-day health)                     Streaming Insight (5-min error window)
                              │                                                       │
          Copy Field enrichment → Contact.Usage_30d__c      Data Action → Platform Event (DataObjectDataChgEvent)
                                                                      → Platform-event Flow + invocable Apex
                                                                      → Task for CSM + Contact.Usage_Health__c = At Risk`,'Solution architecture')}
<h3>Org & tooling</h3>
<ul>
 <li><b>Org:</b> a Data 360-enabled Developer Edition. The Agentforce Developer Edition sign-up includes Data 360 and is the best choice because Projects 3 and 4 reuse it. Credits are limited, so keep data volumes small (hundreds to low thousands of rows) and avoid scheduling insights more often than you need.</li>
 <li><b>Permissions:</b> assign yourself the Data Cloud / Data 360 admin permission set (search "Data Cloud" in Permission Sets; label varies by release).</li>
 <li><b>Local tools:</b> VS Code + Salesforce CLI (<code class="i">sf</code>), Python 3 with <code class="i">requests</code>, and curl or Postman.</li>
</ul>
<h3>Data model</h3>
<table>
<tr><th>Source</th><th>Stream category</th><th>Primary key</th><th>Maps to (DMO)</th></tr>
<tr><td>CRM Contact (via Salesforce CRM connector)</td><td>Profile</td><td>Id</td><td>Standard Sales bundle mappings (Individual, Contact Point Email/Phone)</td></tr>

import os, uuid, random, datetime as dt, requests
URL = f"{os.environ['TENANT_URL']}/api/v1/ingest/sources/Nimbus_Usage/usage_event"
H = {"Authorization": f"Bearer {os.environ['DC_TOKEN']}", "Content-Type": "application/json"}

def ev(user, etype, ts, q=1):
    return {"event_id": str(uuid.uuid4()), "app_user_id": user,
            "device_id": f"TRK-{random.randint(500, 560)}", "event_type": etype,

def baseline(n=2000):
    now = dt.datetime.now(dt.timezone.utc)

               random.choices(["gps_ping", "api_call", "alert_error"], [80, 18, 2])[0],
               now - dt.timedelta(minutes=random.randint(0, 30 * 24 * 60)),
               random.randint(1, 20)) for _ in range(n)]

        r = requests.post(URL, headers=H, json={"data": rows[i:i + 200]})
        print(i, r.status_code)

def burst(user="APP-10060", k=6):
    now = dt.datetime.now(dt.timezone.utc)

<h3>Architecture summary (portfolio write-up)</h3>
<p>Built a real-time customer intelligence layer on Salesforce Data 360 for a fictional fleet-telematics SaaS. Three profile sources (CRM, product app, billing) and one streaming engagement source (Ingestion API) are harmonised to the Customer 360 Data Model, with stream-level normalisation and source-derived IDs for idempotent re-ingestion. A three-rule identity ruleset (normalised email, fuzzy name + phone, app ID) with source-priority reconciliation produces unified individuals. A SQL calculated insight computes 30-day health per unified customer and is pushed back to CRM via Copy Field enrichment; a streaming insight over 5-minute windows detects error spikes and triggers a data action → DataObjectDataChgEvent → platform-event Flow, where invocable Apex uses the Data 360 Query API to traverse the identity graph back to the CRM Contact and create a CSM task.</p>

function todaySec(){
  const t=dkey(); let s=S.log[t]||0;
  if(S.timer.running && S.timer.date===t) s += (Date.now()-S.timer.since)/1000;
  return s;
}
function commitTimer(){
  if(!S.timer.running) return;
  const now=Date.now(), today=dkey();
  if(S.timer.date!==today){ // crossed midnight: credit old day up to midnight
    const mid=new Date(); mid.setHours(0,0,0,0);
    const part=Math.max(0,(mid.getTime()-S.timer.since)/1000);
    S.log[S.timer.date]=(S.log[S.timer.date]||0)+part;
    S.timer.since=mid.getTime(); S.timer.date=today;
  }
  S.log[today]=(S.log[today]||0)+(now-S.timer.since)/1000;
  S.timer.since=now; save({localOnly:true});
}
function totalSec(){ let s=0; for(const k in S.log) s+=S.log[k]; if(S.timer.running) s+=(Date.now()-S.timer.since)/1000; return s; }
function daySec(k){ return k===dkey()? todaySec() : (S.log[k]||0); }
function streak(){
  const min=S.settings.streakMin*60; let d=new Date(), n=0;
  if(daySec(dkey(d))<min) d=addDays(d,-1);
  while(daySec(dkey(d))>=min){ n++; d=addDays(d,-1); }
  return n;
}
function weekSec(){ let s=0; for(let i=0;i<7;i++) s+=daySec(dkey(addDays(new Date(),-i))); return s; }
function modProgress(m){
  if(m==='iv') return ivProgress();
  const ids=[]; CURR.filter(w=>w.mod===m).forEach(w=>w.items.forEach(i=>ids.push(i.id)));
  const g=GSTEPS[MODS[m].project]||[];
  const ls=LESSONS.map((l,i)=>l.m===m?i+1:0).filter(Boolean);
  const total=ids.length+g.length+ls.length;
  const done=ids.filter(i=>S.checks[i]).length + g.filter(i=>S.guide[i]).length + ls.filter(n=>S.lessons[n]).length;
  return {done,total,pct: total? Math.round(done/total*100):0};
}
function overall(){ let d=0,t=0; Object.keys(MODS).forEach(m=>{const p=modProgress(m); d+=p.done; t+=p.total;}); return {done:d,total:t,pct:t?Math.round(d/t*100):0}; }
function currentDay(){
  if(!S.settings.startDate) return null;
  const st=new Date(S.settings.startDate+'T00:00:00'), t=new Date(); t.setHours(0,0,0,0);
  return Math.max(1, Math.min(LESSONS.length, Math.round((t-st)/86400000)+1));
}
function planEnd(){ if(!S.settings.startDate) return null; return addDays(new Date(S.settings.startDate+'T00:00:00'), LESSONS.length-1); }
function fmtDate(d){ return d.toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short',year:'numeric'}); }
function courseInfo(c){
  const u=S.courses[c.id]||{};
  const hours = (u.hours!==undefined && u.hours!=='' && u.hours!==null) ? Number(u.hours) : c.hours;
  const done = Math.min(c.lectures, Number(u.done)||0);
  const frac = u.complete ? 1 : (c.lectures? done/c.lectures : 0);
  if(!hours) return {hours:null, frac, done, complete:!!u.complete};
  const eff = hours*S.settings.pace, rem = eff*(1-frac);
  let d=new Date(); d.setHours(0,0,0,0);
  if(!done && !u.complete && S.settings.startDate){ const sch=addDays(new Date(S.settings.startDate+'T00:00:00'),(c.startWeek-1)*7); if(sch>d) d=sch; }
  const startD=new Date(d); let left = rem*60, days=0;
  if(left<=0) return {hours, eff, rem:0, frac, done, finish:null, days:0, complete:true};
  while(left>0 && days<730){ left -= isWeekend(d)?S.settings.courseWe:S.settings.courseWd; if(left>0){ d=addDays(d,1); days++; } }
  return {hours, eff, rem, frac, done, start:startD, finish:d, days:days+1, complete:!!u.complete};
}
function currentWeek(){
  if(!S.settings.startDate) return null;
  const st=new Date(S.settings.startDate+'T00:00:00'); const diff=Math.floor((new Date()-st)/86400000);
  if(diff<0) return 0; return Math.min(12, Math.floor(diff/7)+1);
}

function importPack(text){

  if(!items){ toast('No items found in that pack'); return; }
  const ok=items.filter(u=>u && typeof u.id==='string' && typeof u.title==='string' && u.date).map(u=>({
    id:String(u.id).slice(0,120), date:String(u.date).slice(0,10), cloud:String(u.cloud||'platform').slice(0,20), status:u.status?String(u.status).slice(0,40):'',

  const m=new Map((S.updates||[]).map(u=>[u.id,u])); let added=0; ok.forEach(u=>{ if(!m.has(u.id)) added++; m.set(u.id,u); });

}

let lastCommit=Date.now();
function tick(){
  if(view!=='dash') return;
  const s=todaySec(), tgt=targetSec();
  const clock=$('#clock'); if(!clock) return;
  clock.textContent=fmt(s);
  const pct=Math.min(1,tgt?s/tgt:0);
  $('#ringfg').setAttribute('stroke-dashoffset', (389.6*(1-pct)).toFixed(1));
  $('#remain').textContent = s>=tgt ? 'Target reached — '+fmt(s-tgt)+' extra' : fmt(tgt-s)+' remaining of '+fmt(tgt);
  const t=$('#stTotal'); if(t){ t.textContent=hrs(totalSec()); $('#stWeek').textContent=hrs(weekSec())+' h in last 7 days'; $('#stStreak').textContent=streak(); }
  if(s>=tgt && tgt>0 && !S.celebrated[dkey()]){ S.celebrated[dkey()]=true; save(); toast('Daily target reached. Great work!'); }
}
setInterval(()=>{
  if(S.timer.running){
    if(Date.now()-lastCommit>30000 || S.timer.date!==dkey()){ commitTimer(); lastCommit=Date.now(); }
  }
  tick();
},1000);

{id:"apex", title:"Apex fundamentals & governor limits", area:"Apex", scen:["A9","A10"], read:`
<p>Apex is Salesforce's strongly typed, Java-like language. It runs on shared, multi-tenant servers, so every transaction is metered by <b>governor limits</b>. Interviews test whether you write code that is correct for one record <i>and</i> for 200.</p>
<h5>Limits worth memorising (per transaction)</h5>
<ul><li>SOQL queries: 100 synchronous / 200 asynchronous; rows retrieved: 50,000.</li><li>DML statements: 150; rows processed by DML: 10,000.</li><li>CPU time: 10 s synchronous / 60 s asynchronous.</li><li>Heap: raised in Winter ’27 to 10 MB synchronous / 25 MB asynchronous (previously 6 / 12 MB).</li><li>Callouts: 100, with a cumulative timeout of 120 s.</li><li>@future calls: 50; Queueable jobs enqueued: 50 synchronously, 1 from an async job.</li></ul>
<p>Use the <b>Limits</b> class (Limits.getQueries(), Limits.getLimitQueries()) to inspect consumption at run time.</p>
<h5>Bulkification</h5>
<ul><li>Never query or do DML inside a loop. Collect Ids into a Set, query once, build a Map, loop over the map.</li><li>Triggers receive up to 200 records per chunk; write every handler for a List.</li><li>Use partial-success DML (Database.insert(list, false)) where one bad record shouldn't fail the rest, and inspect SaveResults.</li></ul>
<h5>Collections</h5>
<p>List (ordered, duplicates allowed), Set (unique, fast contains), Map (key → value, fast lookup). Map&lt;Id, SObject&gt; built directly from a query is the most common idiom: new Map&lt;Id, Account&gt;([SELECT ...]).</p>
<h5>Sharing keywords</h5>
<p><b>with sharing</b> enforces the running user's record access; <b>without sharing</b> ignores it; <b>inherited sharing</b> takes the caller's mode (and defaults to with sharing at entry points). Sharing keywords do not enforce CRUD or field-level security — use WITH USER_MODE / AccessLevel.USER_MODE or Security.stripInaccessible for that.</p>
<h5>Exceptions</h5>
<p>Catch specific exceptions (DmlException, QueryException, CalloutException), add context, and decide: rethrow a custom exception, log, or return a friendly error. Use addError on records in triggers to block saves with a message.</p>`,
qa:[
["Why is SOQL inside a for loop a problem?","Each iteration runs a query; with 200 records you hit the 100-query limit. Query once with IN :ids before the loop and use a Map."],
["What's the difference between with sharing, without sharing and inherited sharing?","They control record-level access only. with sharing applies the user's sharing, without sharing ignores it, inherited sharing uses the caller's mode (with sharing when it is the entry point). CRUD/FLS need USER_MODE or stripInaccessible."],
["How do you enforce field-level security in Apex today?","Run queries and DML in user mode — WITH USER_MODE in SOQL, AccessLevel.USER_MODE on Database methods — or strip fields with Security.stripInaccessible. WITH SECURITY_ENFORCED is older and only covers reads."],
["List vs Set vs Map — when do you use each?","List for ordered data and DML; Set for uniqueness and fast membership checks (collecting Ids); Map for lookups by key, especially Map<Id, SObject> from a query."],
["How would you handle partial failures in a bulk update?","Use Database.update(records, false), iterate the SaveResults, collect errors with record Ids and log or report them rather than failing the whole batch."],
["What changed for Apex in Winter ’27?","Higher heap limits (10/25 MB), Apex integration tests in developer preview, the Apex Symbol API in beta, selective recompilation and a SOQL FORMULA() function in beta."],
["How do you check governor consumption at run time?","The Limits class, for example Limits.getQueries() versus Limits.getLimitQueries(), plus debug logs and the Apex profiling in the developer console."],
["What is a static variable used for in triggers?","State that lives for the transaction — recursion guards, caches of queried data, or bypass flags."]]},

{id:"triggers", title:"Triggers, frameworks & order of execution", area:"Apex", scen:["A1","A2","A3"], read:`
<p>Triggers run Apex before or after records are inserted, updated, deleted or undeleted. Senior interviews focus on design, not syntax.</p>
<h5>Before vs after</h5>
<ul><li><b>Before</b> triggers modify the records being saved (no DML needed) and validate with addError.</li><li><b>After</b> triggers have Ids and system fields; use them to create or update <i>related</i> records.</li></ul>
<h5>Context variables</h5>
<p>Trigger.new, Trigger.old, Trigger.newMap, Trigger.oldMap, Trigger.isInsert/isUpdate/…, Trigger.isBefore/isAfter and Trigger.operationType (an enum you can switch on). Trigger.new is read-only in after triggers.</p>
<h5>Framework pattern</h5>
<ul><li>One trigger per object, with no logic in the body.</li><li>The trigger calls a handler class with methods per event.</li><li>Business logic in services that can be called from triggers, batch jobs, APIs and Flows.</li><li>A bypass mechanism for data loads and tests, and a recursion guard (static Set of processed Ids).</li></ul>
<h5>Order of execution (simplified)</h5>
<ol><li>System validation.</li><li><b>Before-save record-triggered flows</b>.</li><li><b>Before triggers</b>.</li><li>Custom validation rules, then duplicate rules.</li><li>Record saved (not committed).</li><li><b>After triggers</b>.</li><li>Assignment, auto-response, workflow and escalation rules.</li><li><b>After-save record-triggered flows</b>.</li><li>Entitlement rules, roll-up summaries on parents (which can fire the parent's triggers), criteria-based sharing.</li><li>Commit; then post-commit work such as emails and async jobs.</li></ol>
<p>Field updates from workflow or flows can re-run update triggers in the same transaction — the main reason for recursion guards.</p>`,
qa:[
["When would you use a before trigger versus an after trigger?","Before to change or validate the triggering records without DML; after when you need Ids or must change other records."],
["Why one trigger per object?","Multiple triggers on the same event have no guaranteed order. One trigger delegating to a handler makes order explicit and testable."],
["How do you stop a trigger running recursively?","A static Set<Id> of processed records (better than a static Boolean, which breaks with chunks of 200), or compare old and new values so logic only fires on real changes."],
["Where do record-triggered flows fit in the order of execution?","Before-save flows run before Apex before triggers; after-save flows run after triggers and after legacy workflow/assignment rules."],
["How would you roll up a count of child records without a master-detail relationship?","An after insert/update/delete/undelete trigger on the child that collects parent Ids (old and new when re-parented) and recalculates with one aggregate query."],
["Can you make a callout from a trigger?","Not synchronously. Enqueue a Queueable with Database.AllowsCallouts (or @future(callout=true)), or publish a platform event and handle it asynchronously."],
["How do you test a trigger properly?","Single and bulk (200) records, positive and negative cases, every event path (insert, update, delete, undelete, re-parent), and assertions on outcomes rather than just coverage."],
["What is Trigger.operationType?","A System.TriggerOperation enum such as BEFORE_INSERT or AFTER_UPDATE, convenient for switch statements in handlers."]]},

{id:"async", title:"Asynchronous Apex", area:"Apex", scen:["A4","A5"], read:`
<p>Asynchronous Apex runs later, with higher limits, and is how you do callouts from triggers, process large volumes and decouple work.</p>
<h5>The four tools</h5>
<ul>
<li><b>@future</b>: simplest; static method, primitive parameters only, no chaining, no job Id. callout=true for HTTP. Largely superseded by Queueable.</li>
<li><b>Queueable</b>: a class with execute(QueueableContext); takes complex objects, returns a job Id, can chain one job from another, and supports AsyncOptions (for example a delay or duplicate signature to avoid double-enqueueing).</li>
<li><b>Batch Apex</b>: start / execute / finish for large data sets (QueryLocator up to 50 million rows); each execute gets its own limits; scope default 200 (max 2,000); Database.Stateful keeps instance variables between chunks; up to 5 batches run concurrently with up to 100 holding in the flex queue.</li>
<li><b>Schedulable</b>: runs a class on a cron schedule (System.schedule), usually to start a batch.</li>
</ul>
<h5>Choosing</h5>
<ul><li>A callout after a record save → Queueable with Database.AllowsCallouts.</li><li>Millions of records → Batch.</li><li>Nightly job → Schedulable that starts a Batch.</li><li>Decoupled reactions across systems → platform events.</li></ul>
<h5>Other points</h5>
<p>Mixed DML (setup objects such as User with non-setup objects) is solved by moving one part to async. Test.startTest/stopTest forces async work to finish inside tests.</p>`,
qa:[
["Future vs Queueable — which and why?","Queueable: accepts objects, returns a job Id for monitoring, supports chaining and AsyncOptions. Future only takes primitives and can't be chained."],
["How does Database.Stateful work?","It keeps instance variables across execute() calls of a batch — for running totals or error lists. Without it, state resets each chunk."],
["How many records can a batch process and how is it chunked?","A QueryLocator can return up to 50 million rows; execute receives scope-sized chunks (default 200, max 2,000), each with fresh limits."],
["How do you make a callout from a batch?","Implement Database.AllowsCallouts on the batch class and respect the per-execute callout limit (100) by sizing scope."],
["How do you chain Queueables safely?","Enqueue the next job at the end of execute with remaining work, guard against infinite chains, and in tests avoid chaining (Test.isRunningTest or AsyncOptions)."],
["What is the mixed DML error and how do you fix it?","Setup objects (User, Group, PermissionSetAssignment) and non-setup objects can't be modified in the same transaction; move one operation to async or use System.runAs in tests."],
["How would you schedule a nightly batch?","A Schedulable class whose execute calls Database.executeBatch, registered with System.schedule and a cron expression such as '0 0 2 * * ?'."],
["How do you test async Apex?","Wrap the call in Test.startTest/Test.stopTest so the job completes before assertions; mock callouts with HttpCalloutMock."]]},

{id:"soql", title:"SOQL, SOSL & data access", area:"Apex", scen:["A10"], read:`
<h5>SOQL essentials</h5>
<ul><li><b>Parent fields</b> with dot notation (Account.Name); <b>child records</b> with subqueries using the relationship name (SELECT Id, (SELECT Id FROM Contacts) FROM Account; custom: __r).</li><li><b>Aggregates</b>: COUNT, SUM, AVG, MIN, MAX with GROUP BY and HAVING; results are AggregateResult.</li><li><b>Semi- and anti-joins</b>: WHERE Id IN (SELECT AccountId FROM Opportunity …) / NOT IN.</li><li><b>FOR UPDATE</b> locks rows for the transaction to prevent race conditions.</li><li>OFFSET is capped at 2,000; use keyset paging (WHERE Id &gt; :lastId ORDER BY Id) for large sets.</li></ul>
<h5>Selectivity and large data volumes</h5>
<p>Queries on large objects must be selective: filter on indexed fields (Id, Name, external IDs, lookups, CreatedDate, SystemModstamp, custom indexes). Use the Query Plan tool to see cost. Avoid leading-wildcard LIKE and negative filters on big tables. Skinny tables and custom indexes are requested from Support for very large volumes.</p>
<h5>Dynamic SOQL and injection</h5>
<p>Never concatenate user input. Use bind variables — Database.queryWithBinds with a Map — or String.escapeSingleQuotes as a minimum. Whitelist anything that can't be bound (field names, sort order).</p>
<h5>Security</h5>
<p>WITH USER_MODE enforces CRUD, FLS and sharing for the query; WITH SECURITY_ENFORCED is older and throws on inaccessible fields.</p>
<h5>SOSL</h5>
<p>FIND 'term' IN ALL FIELDS RETURNING Account(Name), Contact(Email) — full-text search across objects; good for global search boxes.</p>`,
qa:[
["How do you query parent and child records in one query?","Parent fields with dot notation; children with a subquery on the child relationship name, such as (SELECT Id FROM Contacts) or __r for custom relationships."],
["What makes a SOQL query selective?","Filters on indexed fields that return a small enough share of rows (thresholds depend on object size); check with the Query Plan tool."],
["How do you prevent SOQL injection?","Bind variables (static binds or Database.queryWithBinds), whitelisting for field names and sort, and escapeSingleQuotes as a last resort."],
["SOQL vs SOSL?","SOQL queries one object (and relationships) with precise filters; SOSL searches text across many objects using the search index."],
["How do you page through 1 million records?","Batch Apex with a QueryLocator, or keyset pagination (Id > :lastId ORDER BY Id LIMIT n); OFFSET stops at 2,000."],
["What does FOR UPDATE do?","Locks the selected rows until the transaction ends so concurrent transactions can't change them — used for counters and allocation logic."],
["WITH USER_MODE vs WITH SECURITY_ENFORCED?","USER_MODE enforces sharing plus CRUD/FLS and reports all inaccessible fields; SECURITY_ENFORCED only checks read access and throws on the first issue."],
["How do you count records per account in SOQL?","SELECT AccountId, COUNT(Id) FROM Contact GROUP BY AccountId — returned as AggregateResult rows."]]},

{id:"testing", title:"Testing Apex", area:"Apex", scen:["A1","A4","A7"], read:`
<p>Salesforce requires 75% Apex coverage to deploy to production, but interviewers care about <b>meaningful tests</b>.</p>
<ul>
<li><b>Isolation</b>: tests don't see org data by default (SeeAllData=false). Create data in the test or in an @TestSetup method, ideally through a test data factory class.</li>
<li><b>Test.startTest / Test.stopTest</b>: gives the code under test a fresh set of limits and forces async jobs (future, queueable, batch) and platform events to complete.</li>
<li><b>Assertions</b>: use the Assert class (Assert.areEqual, Assert.isTrue, Assert.fail) with messages.</li>
<li><b>Callouts</b>: implement HttpCalloutMock (or use StaticResourceCalloutMock) and call Test.setMock.</li>
<li><b>Sharing and permissions</b>: System.runAs(user) runs code as a specific user.</li>
<li><b>Platform events</b>: Test.getEventBus().deliver() delivers published events immediately.</li>
<li><b>Stub API</b>: System.StubProvider lets you mock classes for true unit tests.</li>
<li>Test bulk (200), negative paths and boundaries, not just the happy path.</li>
</ul>
<p>Winter ’27 adds Apex integration tests (developer preview) that can make real callouts — useful for end-to-end checks, not as a replacement for mocked unit tests.</p>`,
qa:[
["What does Test.startTest() do?","Resets governor limits for the code under test and, with stopTest, forces queued async work and published events to run before assertions."],
["How do you test a callout?","Implement HttpCalloutMock returning a fake HttpResponse, register it with Test.setMock, then call the code."],
["Why avoid SeeAllData=true?","Tests become dependent on org data, fail across environments and can be slow; create your own data instead."],
["How do you test code as a specific user?","Create or query a user and wrap the code in System.runAs(user)."],
["What should a good trigger test cover?","Single and bulk records, every event, positive and negative cases, and assertions on results."],
["How do you test platform event subscribers?","Publish inside Test.startTest/stopTest or call Test.getEventBus().deliver(), then assert the subscriber's effects."]]},

{id:"lwc", title:"Lightning Web Components", area:"LWC", scen:["L1","L2"], read:`
<p>LWC is Salesforce's standards-based UI framework built on web components.</p>
<h5>Decorators</h5>
<ul><li><b>@api</b>: public property or method set by the parent (such as recordId).</li><li><b>@wire</b>: reactive data from Apex (cacheable=true) or Lightning Data Service adapters such as getRecord.</li><li><b>@track</b>: only needed to observe mutations inside objects/arrays; all fields are reactive to reassignment.</li></ul>
<h5>Lifecycle hooks</h5>
<p>constructor → connectedCallback (component inserted; start subscriptions) → render → renderedCallback (after each render; avoid changing state here) → disconnectedCallback (clean up timers and subscriptions); errorCallback catches errors from child components.</p>
<h5>Data</h5>
<ul><li><b>Lightning Data Service</b> (lightning-record-form, getRecord, updateRecord) — cached, shares data across components and respects FLS. Prefer it for single records.</li><li><b>Wired Apex</b> for reactive reads; <b>imperative Apex</b> for on-demand calls and DML.</li><li><b>refreshApex</b> refreshes wired results; notifyRecordUpdateAvailable tells LDS that data changed.</li></ul>
<h5>Communication</h5>
<ul><li>Parent → child: @api properties and methods.</li><li>Child → parent: dispatch a CustomEvent.</li><li>Unrelated components: Lightning Message Service.</li></ul>
<h5>Quality and security</h5>
<p>Jest unit tests with @salesforce/sfdx-lwc-jest; Lightning Web Security isolates components by namespace; use lwc:if/lwc:else; Winter ’27 makes complex template expressions and third-party web components (lwc:external) generally available.</p>`,
qa:[
["Wire vs imperative Apex?","Wire is reactive and cached (requires cacheable=true) and re-runs when $parameters change; imperative is called on demand and is required for DML or non-cacheable methods."],
["How do child and parent components communicate?","Parent to child through @api properties/methods; child to parent with CustomEvent; unrelated components through Lightning Message Service."],
["When is @track still needed?","Only to make the component react to changes inside an object's properties or an array's items; reassigning a field is already reactive."],
["How do you refresh data after saving?","refreshApex(wiredResult) for wired Apex, or notifyRecordUpdateAvailable / LDS adapters which update automatically."],
["Why prefer Lightning Data Service?","No Apex needed for single-record CRUD, built-in caching shared across components, and automatic FLS and sharing enforcement."],
["What do you put in disconnectedCallback?","Clearing timers, unsubscribing from message channels or empApi, removing listeners — to avoid memory leaks."],
["How do you debounce a search input?","Clear and reset a setTimeout on each keystroke and update the reactive wire parameter only when the user pauses (about 300 ms)."],
["How do you test an LWC?","Jest with sfdx-lwc-jest: createElement, append to document, emit data through mocked wire adapters, await a microtask, and assert on the shadow DOM."]]},

{id:"integration", title:"Integration", area:"Integration", scen:["A4","A6","I1"], read:`
<h5>Patterns (Salesforce integration patterns)</h5>
<ul><li><b>Request–reply</b>: Salesforce calls out and waits (synchronous UI lookups).</li><li><b>Fire-and-forget</b>: Salesforce sends and moves on (platform events, async callouts).</li><li><b>Batch data synchronisation</b>: scheduled bulk loads (Bulk API 2.0, ETL).</li><li><b>Remote call-in</b>: external systems call Salesforce (REST/SOAP, custom Apex REST).</li><li><b>UI update based on data changes</b>: streaming/CDC to refresh screens.</li><li><b>Data virtualisation</b>: Salesforce Connect external objects; zero-copy in Data 360.</li></ul>
<h5>Authentication</h5>
<p><b>Named Credentials</b> with <b>External Credentials</b> store endpoints and auth outside code; principals are granted through permission sets. Common OAuth flows: JWT bearer and client credentials for server-to-server, web server (authorization code) for user apps. The username-password flow is being retired (Winter ’27).</p>
<h5>APIs</h5>
<p>REST and SOAP for record operations; Composite for multiple operations in one call; Bulk API 2.0 for large volumes; Pub/Sub API (gRPC) for events and CDC; custom Apex REST (@RestResource) for business-specific endpoints.</p>
<h5>Reliability</h5>
<ul><li>Idempotency: upsert on external IDs so retries don't duplicate.</li><li>Retries with backoff for transient errors; dead-letter logging for permanent ones.</li><li>Callouts can't run after uncommitted DML in the same transaction or synchronously in triggers — use async.</li><li>External Services generate invocable actions from an OpenAPI spec for Flow and agents.</li></ul>`,
qa:[
["How do you store credentials for a callout?","Named Credential plus External Credential, with access granted via permission set; the code references callout:Name and never holds secrets."],
["Which OAuth flow for a server-to-server integration?","JWT bearer or client credentials; avoid the retiring username-password flow."],
["How do you keep an integration idempotent?","Use external ID fields and upsert, include unique message IDs, and check before creating."],
["When would you use Bulk API 2.0?","Loading or extracting large volumes (tens of thousands to millions of records) asynchronously."],
["How would an ERP be notified when an order is activated?","Publish a platform event or use Change Data Capture; the ERP or middleware subscribes via Pub/Sub API."],
["Why can't you call out after DML in the same transaction?","Uncommitted work pending prevents callouts; do the callout first or move it to async."],
["Custom Apex REST vs standard REST API?","Standard API for generic CRUD; Apex REST when the external system needs a business operation, validation or a stable contract that hides the data model."],
["What is Salesforce Connect?","External objects that read external data on demand (OData or custom adapters) without copying it into Salesforce."]]},

{id:"flows", title:"Flows & automation", area:"Flow", scen:["A8","F1","F2"], read:`
<h5>Flow types</h5>
<ul><li><b>Record-triggered</b>: before-save (fast field updates on the same record, no DML) or after-save (related records, actions, async paths).</li><li><b>Screen flows</b>: guided UI.</li><li><b>Schedule-triggered</b>: run on a schedule over a set of records.</li><li><b>Platform event–triggered</b>: react to events, including Data 360's data actions.</li><li><b>Autolaunched</b>: called from Apex, other flows, buttons, or as agent actions.</li><li><b>Orchestrations and approval orchestrations</b>: multi-step, multi-user processes.</li></ul>
<h5>Best practices</h5>
<ul><li>Tight entry conditions; run only when the relevant field changes.</li><li>No Get Records or DML inside loops — collect into collection variables and do one operation.</li><li><b>Fault paths</b> on every element that can fail.</li><li>Subflows for reuse; invocable Apex for complex logic.</li><li>One record-triggered flow per object/context, or use Flow Trigger Explorer to control order.</li></ul>
<h5>Flow vs Apex</h5>
<p>Flow for declarative, admin-maintainable logic; Apex for complex algorithms, heavy volumes, callouts with complex handling, or when you need unit tests and fine control.</p>
<h5>Winter ’27</h5>
<p>A redesigned builder, Split by Field Value and Split by Date elements, flow tags, version edit history and Flow Test Mode (beta) with coverage and mock outputs.</p>`,
qa:[
["Before-save vs after-save record-triggered flow?","Before-save updates fields on the triggering record cheaply without DML; after-save works with related records, actions and async paths."],
["How do you bulkify a flow?","Avoid elements that query or update inside loops; gather records in collections and update once; record-triggered flows are batched by the platform."],
["How do you handle errors in Flow?","Fault connectors on elements that can fail, logging (for example to a custom object or platform event) and user-friendly messages in screen flows."],
["When would you choose Apex over Flow?","Complex logic or algorithms, very high volume, sophisticated callout handling, reuse across many contexts, or when strict unit testing is required."],
["How do you call Apex from Flow?","An @InvocableMethod with @InvocableVariable inputs and outputs; it appears as an Apex action."],
["How do you control order between multiple record-triggered flows?","Trigger order values in Flow Trigger Explorer, or consolidate into fewer flows."]]},

{id:"events", title:"Platform events & Change Data Capture", area:"Integration", scen:["A7"], read:`
<h5>Platform events</h5>
<p>Custom event messages (objects ending __e) for decoupled, event-driven integration inside and outside Salesforce.</p>
<ul><li><b>Publish</b> from Apex (EventBus.publish), Flow, or APIs. Choose <b>Publish After Commit</b> (only if the transaction commits) or <b>Publish Immediately</b> (even if it rolls back — useful for logging).</li><li><b>Subscribe</b> with Apex triggers (after insert only), platform event–triggered flows, the Pub/Sub API, CometD/empApi in LWC.</li><li>High-volume events are retained for 72 hours; subscribers can replay from a <b>ReplayId</b>.</li><li>Apex event triggers run as the Automated Process user by default (configurable), process batches up to 2,000 events, and can set a resume checkpoint to avoid reprocessing on retry.</li></ul>
<h5>Change Data Capture (CDC)</h5>
<p>Automatic change events for record creates, updates, deletes and undeletes on selected objects. The ChangeEventHeader carries changeType, changedFields and recordIds. Ideal for keeping external systems in sync without custom triggers.</p>
<h5>Choosing</h5>
<p>Use CDC to mirror data changes; use platform events for business events (Order Shipped) that don't map one-to-one to a record change.</p>`,
qa:[
["Publish After Commit vs Publish Immediately?","After Commit only delivers if the transaction commits — normal business events. Immediately delivers even on rollback — useful for error logging."],
["How do subscribers recover missed events?","Using the ReplayId within the retention window (72 hours for high-volume events)."],
["Platform events vs CDC?","CDC publishes record changes automatically; platform events carry custom business events you define and publish."],
["Who does a platform event trigger run as?","The Automated Process user, unless a PlatformEventSubscriberConfig specifies a running user."],
["How do you test platform event triggers?","Publish inside startTest/stopTest or call Test.getEventBus().deliver(), then assert results."],
["What is setResumeCheckpoint?","It marks the last successfully processed event so that if the trigger fails and retries, it resumes after that event."]]},

{id:"security", title:"Security & sharing", area:"Platform", scen:["A10"], read:`
<h5>Layers of access</h5>
<ol><li><b>Org-level</b>: login IP ranges, hours, MFA.</li><li><b>Object-level (CRUD)</b> and <b>field-level security</b> from profiles, permission sets and permission set groups (Salesforce is moving permissions to permission sets).</li><li><b>Record-level</b>: org-wide defaults (the baseline), role hierarchy (managers see subordinates' records), sharing rules (owner- or criteria-based), teams, territories, manual sharing and Apex managed sharing (Share objects with a custom RowCause). Restriction and scoping rules narrow access.</li></ol>
<h5>In code</h5>
<ul><li>Sharing keywords control record access only.</li><li>USER_MODE queries and DML enforce CRUD, FLS and sharing.</li><li>Security.stripInaccessible removes fields the user can't see.</li><li>Lightning Data Service enforces security automatically in LWC.</li></ul>
<h5>Design principle</h5>
<p>Start restrictive (Private OWD for sensitive objects) and open up with rules; never use "without sharing" to paper over a data-model problem.</p>`,
qa:[
["What's the most restrictive level and how do you open access?","Org-wide defaults set the baseline; the role hierarchy, sharing rules, teams, territories and manual or Apex sharing open it up."],
["Profiles vs permission sets?","Profiles give a baseline (one per user); permission sets and groups add access and are the recommended way to grant permissions."],
["How does Apex managed sharing work?","Insert records into the object's Share table (for example Account__Share for custom objects) with a custom RowCause so they survive ownership changes."],
["How do you enforce FLS in an Apex controller?","USER_MODE queries and DML, or Security.stripInaccessible on results before returning them."],
["What is a criteria-based sharing rule?","A rule sharing records that meet field criteria with a group or role, regardless of owner."]]},

{id:"sales", title:"Sales Cloud", area:"Clouds", scen:["S1","A3"], read:`
<h5>Core process</h5>
<p>Lead → qualification → <b>lead conversion</b> (creates Account, Contact and optionally Opportunity, with custom field mapping) → Opportunity through stages to Closed Won/Lost.</p>
<ul><li><b>Leads</b>: web-to-lead, assignment rules, queues, lead scoring (Einstein), duplicate and matching rules.</li><li><b>Opportunities</b>: stages and sales processes per record type, Path with guidance, products from price books (Opportunity Products), schedules for revenue or quantity.</li><li><b>Quotes</b> (standard quotes) and quote PDFs; complex pricing moves to CPQ or Revenue Cloud.</li><li><b>Forecasting</b>: collaborative forecasts by revenue or quantity, forecast categories mapped from stages, adjustments by managers.</li><li><b>Territory Management</b> (Enterprise Territory Management): territory models and hierarchies drive account access and forecasts.</li><li><b>Campaigns</b> and campaign influence; activity capture and sales engagement cadences.</li></ul>
<p>Since Dreamforce 2026, the product is branded simply Sales Cloud again, with agentic features layered on.</p>`,
qa:[
["What happens on lead conversion?","An Account and Contact are created or matched, an Opportunity optionally created, mapped custom fields copied, and the Lead marked converted."],
["How do forecast categories relate to stages?","Each opportunity stage maps to a forecast category (Pipeline, Best Case, Commit, Closed, Omitted) that drives forecast roll-ups."],
["How do you route leads to the right reps?","Lead assignment rules (criteria to users or queues), possibly round-robin via Flow or Omni-Channel, plus territory logic."],
["What is a sales process?","The set of opportunity stages available for a record type, letting different businesses use different stage paths."],
["Standard quotes vs CPQ/Revenue Cloud?","Standard quotes suit simple price-book pricing; complex bundles, rules, discounting and subscriptions need CPQ or Revenue Cloud."]]},

{id:"service", title:"Service Cloud", area:"Clouds", scen:["SV1","A1"], read:`
<h5>Case management</h5>
<ul><li>Channels create cases: Email-to-Case, Web-to-Case, messaging (Messaging for In-App and Web, WhatsApp and others), voice, and now Agentforce service agents.</li><li><b>Assignment rules</b> and <b>auto-response rules</b>; <b>escalation rules</b> by age or criteria.</li><li><b>Support processes</b> define case statuses per record type.</li></ul>
<h5>Service levels</h5>
<p><b>Entitlements</b> define what support a customer gets; <b>entitlement processes</b> contain <b>milestones</b> (first response in 1 hour) with success, warning and violation actions. Service contracts group entitlements.</p>
<h5>Routing</h5>
<p><b>Omni-Channel</b> pushes work to available agents by queue or by <b>skills-based routing</b>, respecting capacity; Omni-Channel flows customise routing and can route to agents (human or AI).</p>
<h5>Productivity</h5>
<p>Service Console, macros, quick text, <b>Lightning Knowledge</b> (articles, data categories, versions), case swarming in Slack, and Agentforce for deflection and agent assistance.</p>`,
qa:[
["How do entitlements and milestones work?","An entitlement links a customer to an entitlement process whose milestones track SLA steps with warning and violation actions."],
["Queue-based vs skills-based routing?","Queue-based sends work to agents in a queue; skills-based matches case attributes to agent skills and levels."],
["How does Email-to-Case work?","Emails to a routing address create cases (On-Demand Email-to-Case processes them in Salesforce), with threading to keep replies on the same case."],
["How would you automate escalations?","Escalation rules by age and criteria, or milestone violation actions in entitlement processes, plus Flow for notifications."],
["Where does Agentforce fit in Service Cloud?","Service agents deflect routine requests on digital channels and escalate to Omni-Channel queues with context; employee agents assist human agents."]]},

{id:"cpq", title:"Salesforce CPQ (legacy SBQQ)", area:"Clouds", scen:["C1"], read:`
<p>Salesforce CPQ is the managed package (namespace SBQQ) many companies still run. Salesforce now positions Revenue Cloud as the strategic platform for new implementations, so interviews often ask you to compare them.</p>
<h5>Data model</h5>
<p>SBQQ__Quote__c and SBQQ__QuoteLine__c (separate from standard Quote), Product Features and Product Options for bundles, Configuration Attributes, Contracts with SBQQ__Subscription__c records, and Assets.</p>
<h5>Rules</h5>
<ul><li><b>Product rules</b>: validation, selection, alert and filter rules for configuration.</li><li><b>Price rules</b>: price conditions and price actions evaluated at On Initialization, Before Calculate, On Calculate and After Calculate.</li><li><b>Lookup queries</b> and summary variables feed rules from tables and aggregates.</li></ul>
<h5>Pricing waterfall</h5>
<p>List price → special/contracted price → (block price, cost-plus, percent of total as pricing methods) → discount schedules (range or slab) → additional discount → partner and distributor discounts → net price.</p>
<h5>Subscriptions</h5>
<p>Subscription pricing (fixed or percent of total), proration, co-termination; amendments and renewals are generated from Contracts.</p>
<h5>Extensibility</h5>
<p>The <b>Quote Calculator Plugin (QCP)</b> is JavaScript with hooks (onInit, onBeforeCalculate, onBeforePriceRules, onAfterPriceRules, onAfterCalculate); Advanced Approvals (sbaa) for approval chains; quote templates for documents.</p>
<h5>CPQ vs Revenue Cloud</h5>
<p>CPQ: managed package, price rules and QCP. Revenue Cloud: native, pricing procedures and context definitions, constraint-based configuration, API-first.</p>`,
qa:[
["What's the difference between product rules and price rules?","Product rules govern configuration (validate, select, alert, filter options); price rules change field values during calculation using conditions and actions."],
["Range vs slab discount schedules?","Range applies the discount of the tier reached to all units; slab applies each tier's discount to the units within that tier."],
