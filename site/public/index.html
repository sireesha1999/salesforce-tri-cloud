["When would you use a Quote Calculator Plugin?","When price rules can't express the logic — complex calculations, cross-line logic or external lookups during calculation."],
["How are amendments and renewals created in CPQ?","From Contracts: amend creates an amendment quote co-termed to the contract; renew creates a renewal opportunity and quote from subscriptions."],
["How does CPQ compare with Revenue Cloud?","CPQ is a managed package with price rules and QCP; Revenue Cloud is native, API-first, with pricing procedures, context definitions and constraint-based configuration."],
["What are the price rule evaluation events?","On Initialization, Before Calculate, On Calculate and After Calculate (plus configurator events for option pricing)."]]}
];

const IV_SCENARIOS = [
 {id:"A1", topic:"triggers", level:"Medium", mins:30, title:"Roll up open cases to Account",
  prompt:"Maintain Account.Open_Case_Count__c (Number) as the number of open Cases on each Account. It must stay correct when cases are created, closed or reopened, moved to another account, deleted or undeleted, and must work for 200 records at once.",
  hints:["Collect account Ids from both old and new values on update (re-parenting).","One aggregate query: COUNT(Id) GROUP BY AccountId with IsClosed = false.","Default every affected account to 0 so accounts that lost their last case are reset."],
  files:["force-app/main/default/triggers/CaseTrigger.trigger","force-app/main/default/classes/CaseTriggerHandler.cls","force-app/main/default/classes/AccountCaseRollupService.cls","force-app/main/default/classes/AccountCaseRollupServiceTest.cls"],
  talk:"I use one trigger per object delegating to a handler. On update I only recalculate when AccountId or IsClosed changed, and include the old account for re-parenting. The service recalculates with one aggregate query and one DML, so it's bulk-safe regardless of batch size.",
  followups:["How would you avoid lock contention on hot accounts? (sort Ids, async recalculation, or a scheduled recalculation)","Could a roll-up summary field or Flow do this? (only on master-detail; Flow possible but heavier)"]},
 {id:"A2", topic:"triggers", level:"Easy", mins:20, title:"Prevent duplicate contact emails",
  prompt:"Block inserting or updating a Contact when another Contact already has the same email (case-insensitive), including duplicates inside the same batch. Updates that don't change the email must not be blocked.",
  hints:["Normalise with trim().toLowerCase() into a Map<String, Contact>.","Check within-batch duplicates while building the map.","One query with Email IN :keys; skip the record itself on update."],
  files:["force-app/main/default/triggers/ContactTrigger.trigger","force-app/main/default/classes/ContactTriggerHandler.cls","force-app/main/default/classes/ContactDuplicateService.cls","force-app/main/default/classes/ContactDuplicateServiceTest.cls"],
  talk:"Before trigger so I can use addError without DML. Normalised email map catches in-batch duplicates; one query catches existing records. In real projects I'd prefer standard Duplicate Rules — this shows bulk patterns.",
  followups:["How would you handle 'merge instead of block'?","What about Leads with the same email?"]},
 {id:"A3", topic:"triggers", level:"Medium", mins:30, title:"Trigger framework + Closed Won kick-off task",
  prompt:"Create a reusable trigger handler base class with bypass support. When an Opportunity becomes Closed Won, create exactly one kick-off Task for its owner, even if the record is updated again in the same transaction.",
  hints:["Base class with virtual methods per event and a switch on Trigger.operationType.","Compare IsWon old vs new.","Static Set<Id> recursion guard."],
  files:["force-app/main/default/classes/TriggerHandler.cls","force-app/main/default/classes/OpportunityTriggerHandler.cls","force-app/main/default/triggers/OpportunityTrigger.trigger","force-app/main/default/classes/OpportunityTriggerHandlerTest.cls"],
  talk:"The base class gives one consistent entry point and bypass for data loads. Recursion is guarded per record Id, not with a static Boolean, which would break across 200-record chunks.",
  followups:["How would you make bypass configurable without deployment? (custom metadata or custom permission)"]},
 {id:"A4", topic:"async", level:"Medium", mins:40, title:"Async account enrichment with callouts",
  prompt:"When accounts are created with a Website, call an external company-info API (GET /companies?domain=) and store employee count and industry. Handle failures without losing other records and respect callout limits.",
  hints:["Queueable + Database.AllowsCallouts; enqueue from an after-insert trigger.","Named Credential for endpoint and auth.","Chunk and chain to stay under 100 callouts per transaction; HttpCalloutMock in tests."],
  files:["force-app/main/default/classes/AccountEnrichmentQueueable.cls","force-app/main/default/classes/AccountEnrichmentQueueableTest.cls"],
  talk:"Callouts can't run synchronously in triggers, so I enqueue a Queueable that uses a Named Credential. It processes 50 accounts per job and chains the rest. Failures return null and the record is skipped; in production I'd log them.",
  followups:["How would you retry failed records?","How would you avoid enqueuing duplicates? (AsyncOptions duplicate signature)"]},
 {id:"A5", topic:"async", level:"Medium", mins:30, title:"Nightly batch to close stale leads",
  prompt:"Every night, set Status = 'Closed - Not Converted' on unconverted leads not modified for 90 days, and report how many succeeded and failed.",
  hints:["Batchable with QueryLocator; Database.Stateful for counters.","Partial-success update.","Schedulable execute() starts the batch."],
  files:["force-app/main/default/classes/StaleLeadBatch.cls","force-app/main/default/classes/StaleLeadBatchTest.cls"],
  talk:"QueryLocator handles volume; Stateful keeps totals across chunks; partial success avoids one bad lead failing 200. The same class is Schedulable for a cron entry.",
  followups:["How do you test date logic when LastModifiedDate can't be set? (parameterise the cutoff)"]},
 {id:"A6", topic:"integration", level:"Medium", mins:40, title:"Custom REST API for cases",
  prompt:"Expose GET /v1/cases/{id} returning a case summary and POST /v1/cases creating a case from JSON. Return 201, 400 (validation/invalid JSON/invalid id) or 404, and respect the calling user's permissions.",
  hints:["@RestResource with @HttpGet/@HttpPost.","DTO classes and JSON.deserialize.","WITH USER_MODE and Database.insert(record, AccessLevel.USER_MODE)."],
  files:["force-app/main/default/classes/CaseApi.cls","force-app/main/default/classes/CaseApiTest.cls"],
  talk:"A DTO keeps the external contract stable; user mode enforces the integration user's access; explicit status codes make the API predictable for consumers.",
  followups:["How would you version the API?","How would you make POST idempotent? (external ID + upsert)"]},
 {id:"A7", topic:"events", level:"Medium", mins:30, title:"Platform event: order shipped",
  prompt:"Publish an Order_Shipped__e event when orders ship and, in a subscriber, create a follow-up task on the account. Make the subscriber resilient to retries.",
  hints:["EventBus.publish returns SaveResults.","Event trigger: after insert only.","setResumeCheckpoint with ReplayId."],
  files:["force-app/main/default/classes/OrderEventPublisher.cls","force-app/main/default/classes/OrderShippedSubscriber.cls","force-app/main/default/triggers/OrderShippedTrigger.trigger","force-app/main/default/classes/OrderEventPublisherTest.cls"],
  talk:"Publish After Commit means subscribers only see shipped orders that really committed. The subscriber runs as the Automated Process user and checkpoints progress so retries don't duplicate work.",
  followups:["How would an external system subscribe? (Pub/Sub API)","When would you use CDC instead?"]},
 {id:"A8", topic:"flows", level:"Easy", mins:20, title:"Invocable Apex for Flow: business days",
  prompt:"Provide a Flow action that returns the number of business days (Mon–Fri) between two dates. It must be bulk-safe and locale-independent.",
  hints:["@InvocableMethod with List<Request> → List<Result>.","Derive weekday from a known Monday instead of toStartOfWeek()."],
  files:["force-app/main/default/classes/BusinessDaysCalculator.cls","force-app/main/default/classes/BusinessDaysCalculatorTest.cls"],
  talk:"Invocable methods are always bulk — one result per request. Descriptions on the variables make the action usable by Flow builders and Agentforce.",
  followups:["How would you exclude public holidays? (Holiday object or custom metadata)"]},
 {id:"A9", topic:"apex", level:"Easy", mins:30, title:"Collections kata (whiteboard round)",
  prompt:"Implement: top opportunity by amount per account; second-highest distinct number; anagram check; group contacts by email domain; chunk a list; first non-repeating character.",
  hints:["Maps for grouping; a single pass for second-highest.","Handle null and empty inputs."],
  files:["force-app/main/default/classes/CollectionKata.cls","force-app/main/default/classes/CollectionKataTest.cls"],
  talk:"I explain complexity (O(n) where possible), edge cases first, and write tests for each.",
  followups:["What is the complexity of your anagram check? (O(n log n) because of sorting; a count map gives O(n))"]},
 {id:"A10", topic:"soql", level:"Medium", mins:30, title:"Safe dynamic SOQL search",
  prompt:"Build an account search with optional filters (name contains, industry, minimum revenue), a user-chosen sort and a row limit — without SOQL injection and respecting user permissions.",
  hints:["Database.queryWithBinds with a bind map.","Whitelist sort fields.","Escape LIKE wildcards."],
  files:["force-app/main/default/classes/AccountSearchService.cls","force-app/main/default/classes/AccountSearchServiceTest.cls"],
  talk:"Every user value is a bind; sort fields come from a whitelist; USER_MODE enforces CRUD/FLS/sharing; the limit is clamped.",
  followups:["How would you expose this to an LWC? (@AuraEnabled controller)"]},
 {id:"L1", topic:"lwc", level:"Medium", mins:40, title:"LWC: debounced contact search",
  prompt:"Build an LWC that searches contacts by name or email as the user types (minimum 2 characters), shows results in a datatable with the account name, and handles loading, empty and error states.",
  hints:["@wire with a $searchTerm parameter and cacheable Apex.","Debounce with setTimeout (~300 ms).","Flatten Account.Name for the datatable."],
  files:["force-app/main/default/lwc/contactSearch/contactSearch.js","force-app/main/default/lwc/contactSearch/contactSearch.html","force-app/main/default/classes/ContactSearchController.cls","force-app/main/default/lwc/contactSearch/__tests__/contactSearch.test.js"],
  talk:"The wire re-runs when the reactive parameter changes, and the debounce limits server calls. The Apex is cacheable and user mode.",
  followups:["Why cacheable=true?","How would you add pagination?"]},
 {id:"L2", topic:"lwc", level:"Medium", mins:40, title:"LWC: inline-edit opportunities",
  prompt:"On an Account record page, list open opportunities and let users edit stage, amount and close date inline, saving all changes with clear success and partial-failure messages.",
  hints:["datatable draft-values and onsave.","updateRecord from lightning/uiRecordApi (no Apex DML).","Promise.allSettled + refreshApex."],
  files:["force-app/main/default/lwc/opportunityInlineEditor/opportunityInlineEditor.js","force-app/main/default/lwc/opportunityInlineEditor/opportunityInlineEditor.html"],
  talk:"LDS enforces validation and FLS; allSettled lets successful rows save even if one fails; refreshApex reloads the wired data.",
  followups:["How would you save in one server round trip? (Apex with Database.update(list,false))"]},
 {id:"F1", topic:"flows", level:"Medium", mins:25, title:"Flow design: high-priority case escalation",
  prompt:"When a Case is created with Priority = High for a customer with a Premium entitlement, set a target response time, assign to the Premium queue and notify the account owner. If it is still New after 1 hour, escalate to the duty manager.",
  solution:`<ol><li><b>Before-save record-triggered flow</b> on Case (create): if Priority = High → set Target_Response__c = now + 1 hour (no DML).</li><li><b>After-save record-triggered flow</b>: Get the account's active entitlement; if Premium → update OwnerId to the Premium queue (or let assignment rules do it), send a notification or email to the account owner.</li><li><b>Scheduled path</b> on the after-save flow: 1 hour after CreatedDate, re-check Status = New → assign to duty manager queue and post to a Slack or Chatter channel.</li><li><b>Fault paths</b> on Get/Update elements → log to an Error_Log__c record.</li><li>Alternative: entitlement processes with milestones and violation actions — preferable when SLAs are contractual.</li></ol>`,
  talk:"Before-save for same-record fields, after-save for related actions, scheduled path for time-based escalation, and entitlements if SLAs must be reported.",
  followups:["How would you test this flow? (Flow Test Mode / tests in Flow Builder)"]},
 {id:"F2", topic:"flows", level:"Easy", mins:20, title:"Flow design: guided returns screen flow",
  prompt:"Build a screen flow for agents to process a device return: choose the device, capture the reason, calculate the refund (business rules in Apex), create a Return__c record and a credit task.",
  solution:`<ol><li>Screen 1: lookup or data table of the customer's assets.</li><li>Screen 2: reason picklist and condition; conditional visibility for damage photos.</li><li>Apex action (invocable) to calculate refund — keeps business rules testable.</li><li>Create Records: Return__c; Create Records: Task for finance.</li><li>Fault path showing a friendly message and logging.</li><li>Launch from a quick action on Asset or Case.</li></ol>`,
  talk:"Screens for UX, Apex for rules, fault paths for resilience.", followups:["How would you let an Agentforce agent do the same? (reuse the autolaunched parts as an agent action)"]},
 {id:"I1", topic:"integration", level:"Hard", mins:45, title:"Design: order sync with an ERP",
  prompt:"Activated orders must reach the ERP within minutes; the ERP sends back invoice numbers and shipping status. The ERP is sometimes down for maintenance. Design the integration.",
  solution:`<ol><li><b>Outbound</b>: on order activation publish an Order_Activated__e platform event (Publish After Commit) or use CDC on Order.</li><li><b>Middleware</b> (MuleSoft or similar) subscribes via the <b>Pub/Sub API</b>, transforms and calls the ERP; retries with backoff while the ERP is down; replay IDs cover outages up to 72 hours; dead-letter queue beyond that.</li><li><b>Inbound</b>: middleware calls Salesforce REST (Composite or upsert on an External ID such as ERP_Invoice_Id__c) using an integration user authenticated with JWT bearer or client credentials.</li><li><b>Idempotency</b>: external IDs on Order and Invoice; event IDs in a processed table.</li><li><b>Monitoring</b>: integration log object, alerts on failures, reconciliation report.</li><li><b>Security</b>: integration user with least privilege (permission sets), Named/External Credentials if Salesforce calls out.</li></ol>`,
  talk:"Event-driven out, upsert-based in, middleware for retries and transformation, and external IDs for idempotency.", followups:["What if volume is 1 million orders a day? (Bulk API 2.0 for inbound, high-volume events)"]},
 {id:"C1", topic:"cpq", level:"Medium", mins:30, title:"CPQ: partner discount + floor price",
  prompt:"Partners get an extra 5% on subscription lines after price rules; net price must never go below a floor price; show total MRR on the quote. Decide between price rules and a QCP and implement.",
  hints:["A price rule could set the additional discount; the floor check and MRR roll-up across lines suit the QCP.","QCP fields must be listed on the custom script record."],
  files:["interview/cpq/quote-calculator-plugin.js"],
  talk:"I'd try declarative price rules first (with a summary variable for MRR). The QCP is justified when logic spans lines or needs calculations price rules can't express — and I flag below-floor lines for approval rather than silently changing price.",
  followups:["How would you do the same in Revenue Cloud? (decision table + pricing procedure element + approval)"]},
 {id:"S1", topic:"sales", level:"Medium", mins:25, title:"Sales Cloud design: lead routing and conversion",
  prompt:"Leads arrive from the website and events. Route UK logistics leads to a regional team round-robin, others to an inside-sales queue; on conversion, copy fleet size and source to the opportunity and create a discovery task.",
  solution:`<ol><li>Web-to-lead or API; duplicate and matching rules on email and company.</li><li><b>Lead assignment rules</b>: UK + Industry = Logistics → regional queue; else inside sales.</li><li>Round-robin: Omni-Channel routing for leads, or a Flow that assigns by a counter in custom metadata.</li><li><b>Lead field mapping</b>: Fleet_Size__c and Lead Source mapped to Account and Opportunity fields.</li><li>After-save flow on Opportunity created from conversion → create Discovery task.</li><li>Path on Lead and Opportunity with guidance; Einstein lead scoring if licensed.</li></ol>`,
  talk:"Standard features first (assignment rules, field mapping), automation only for gaps.", followups:["How do you report conversion rates by source?"]},
 {id:"SV1", topic:"service", level:"Medium", mins:25, title:"Service Cloud design: SLAs and routing",
  prompt:"Premium customers get 1-hour first response and 8-hour resolution; standard customers 8 hours and 3 days. Cases come by email, web chat and phone; route to agents by language and product skill.",
  solution:`<ol><li><b>Entitlements</b> on accounts (Premium, Standard) with <b>entitlement processes</b>: milestones First Response and Resolution, with warning and violation actions (notify, escalate).</li><li>Email-to-Case, Messaging for In-App and Web, and voice channels create cases with origin and language.</li><li><b>Omni-Channel skills-based routing</b>: skills for language and product; Omni-Channel flow sets required skills; capacity per agent.</li><li>Agentforce service agent on web chat for deflection, escalating to Omni-Channel with context.</li><li>Reports and dashboards on milestone compliance.</li></ol>`,
  talk:"Entitlements make SLAs measurable; skills-based routing matches work to the right agent; agents deflect routine requests.", followups:["How do you pause milestones while waiting on the customer? (stopped status)"]}
];

const SCEN_CODE = {"force-app/main/default/triggers/CaseTrigger.trigger": "trigger CaseTrigger on Case (after insert, after update, after delete, after undelete) {\n    new CaseTriggerHandler().run();\n}\n", "force-app/main/default/classes/CaseTriggerHandler.cls": "/**\n * Scenario A1 \u2014 keep Account.Open_Case_Count__c accurate.\n * Handles insert, close/reopen, re-parenting, delete and undelete in bulk.\n */\npublic with sharing class CaseTriggerHandler extends TriggerHandler {\n    protected override void afterInsert(List<SObject> newList) {\n        AccountCaseRollupService.recalculate(accountIds(newList));\n    }\n\n    protected override void afterUpdate(List<SObject> newList, Map<Id, SObject> oldMap) {\n        Set<Id> ids = new Set<Id>();\n        for (Case c : (List<Case>) newList) {\n            Case old = (Case) oldMap.get(c.Id);\n            // Only recalculate when something that affects the count changed.\n            if (c.AccountId != old.AccountId || c.IsClosed != old.IsClosed) {\n                ids.add(c.AccountId);\n                ids.add(old.AccountId); // the account the case moved away from\n            }\n        }\n        AccountCaseRollupService.recalculate(ids);\n    }\n\n    protected override void afterDelete(List<SObject> oldList) {\n        AccountCaseRollupService.recalculate(accountIds(oldList));\n    }\n\n    protected override void afterUndelete(List<SObject> newList) {\n        AccountCaseRollupService.recalculate(accountIds(newList));\n    }\n\n    private static Set<Id> accountIds(List<SObject> cases) {\n        Set<Id> ids = new Set<Id>();\n        for (Case c : (List<Case>) cases) {\n            ids.add(c.AccountId);\n        }\n        return ids;\n    }\n}\n", "force-app/main/default/classes/AccountCaseRollupService.cls": "/**\n * Recalculates open-case counts with ONE aggregate query and ONE DML,\n * whatever the batch size (bulk-safe, 200 records per trigger chunk).\n */\npublic with sharing class AccountCaseRollupService {\n    public static void recalculate(Set<Id> accountIds) {\n        accountIds.remove(null);\n        if (accountIds.isEmpty()) {\n            return;\n        }\n\n        // Default every account to zero so accounts that lost their last case are reset.\n        Map<Id, Integer> counts = new Map<Id, Integer>();\n        for (Id accountId : accountIds) {\n            counts.put(accountId, 0);\n        }\n\n        for (AggregateResult ar : [\n            SELECT AccountId acc, COUNT(Id) cnt\n            FROM Case\n            WHERE AccountId IN :accountIds AND IsClosed = FALSE\n            GROUP BY AccountId\n        ]) {\n            counts.put((Id) ar.get('acc'), (Integer) ar.get('cnt'));\n        }\n\n        List<Account> updates = new List<Account>();\n        for (Id accountId : counts.keySet()) {\n            updates.add(new Account(Id = accountId, Open_Case_Count__c = counts.get(accountId)));\n        }\n        update updates;\n    }\n}\n", "force-app/main/default/classes/AccountCaseRollupServiceTest.cls": "@IsTest\nprivate class AccountCaseRollupServiceTest {\n    private static Decimal openCount(Id accountId) {\n        return [SELECT Open_Case_Count__c FROM Account WHERE Id = :accountId].Open_Case_Count__c;\n    }\n\n    @IsTest\n    static void countsOpenCasesAcrossLifecycle() {\n        Account a = new Account(Name = 'Acme');\n        Account b = new Account(Name = 'Globex');\n        insert new List<Account>{ a, b };\n\n        List<Case> cases = new List<Case>{\n            new Case(AccountId = a.Id, Subject = 'One', Status = 'New'),\n            new Case(AccountId = a.Id, Subject = 'Two', Status = 'New'),\n            new Case(AccountId = a.Id, Subject = 'Three', Status = 'Closed')\n        };\n\n        Test.startTest();\n        insert cases;\n        Assert.areEqual(2, openCount(a.Id), 'Two open cases after insert');\n\n        cases[0].Status = 'Closed';\n        update cases[0];\n        Assert.areEqual(1, openCount(a.Id), 'Closing a case decrements');\n\n        cases[1].AccountId = b.Id;\n        update cases[1];\n        Assert.areEqual(0, openCount(a.Id), 'Re-parent removes from old account');\n        Assert.areEqual(1, openCount(b.Id), 'Re-parent adds to new account');\n\n        delete cases[1];\n        Assert.areEqual(0, openCount(b.Id), 'Delete decrements');\n\n        undelete cases[1];\n        Assert.areEqual(1, openCount(b.Id), 'Undelete restores');\n        Test.stopTest();\n    }\n\n    @IsTest\n    static void bulkInsertOfTwoHundredCases() {\n        Account a = new Account(Name = 'Bulk Co');\n        insert a;\n        List<Case> cases = new List<Case>();\n        for (Integer i = 0; i < 200; i++) {\n            cases.add(new Case(AccountId = a.Id, Subject = 'Case ' + i, Status = 'New'));\n        }\n        Test.startTest();\n        insert cases;\n        Test.stopTest();\n        Assert.areEqual(200, openCount(a.Id), 'All 200 counted in one transaction');\n    }\n}\n", "force-app/main/default/triggers/ContactTrigger.trigger": "trigger ContactTrigger on Contact (before insert, before update) {\n    new ContactTriggerHandler().run();\n}\n", "force-app/main/default/classes/ContactTriggerHandler.cls": "/** Scenario A2 \u2014 block duplicate Contact emails (within the batch and against the database). */\npublic with sharing class ContactTriggerHandler extends TriggerHandler {\n    protected override void beforeInsert(List<SObject> newList) {\n        ContactDuplicateService.preventDuplicates((List<Contact>) newList, null);\n    }\n\n    protected override void beforeUpdate(List<SObject> newList, Map<Id, SObject> oldMap) {\n        ContactDuplicateService.preventDuplicates((List<Contact>) newList, oldMap);\n    }\n}\n", "force-app/main/default/classes/ContactDuplicateService.cls": "/**\n * Duplicate-email guard.\n *  - normalises email (trim + lower case)\n *  - catches duplicates inside the same insert/update batch\n *  - catches duplicates already in the database with ONE query\n *  - ignores updates where the email did not change\n * In production you would usually use Duplicate Rules; interviewers ask for\n * the Apex version to test bulkification and map/set skills.\n */\npublic with sharing class ContactDuplicateService {\n    public static void preventDuplicates(List<Contact> contacts, Map<Id, SObject> oldMap) {\n        Map<String, Contact> byEmail = new Map<String, Contact>();\n\n        for (Contact c : contacts) {\n            if (String.isBlank(c.Email)) {\n                continue;\n            }\n            if (oldMap != null) {\n                Contact old = (Contact) oldMap.get(c.Id);\n                if (old != null && old.Email == c.Email) {\n                    continue; // unchanged (Apex string == is case-insensitive)\n                }\n            }\n            String key = c.Email.trim().toLowerCase();\n            if (byEmail.containsKey(key)) {\n                c.Email.addError('Duplicate email in this batch: ' + c.Email);\n                continue;\n            }\n            byEmail.put(key, c);\n        }\n\n        if (byEmail.isEmpty()) {\n            return;\n        }\n\n        for (Contact existing : [SELECT Id, Email FROM Contact WHERE Email IN :byEmail.keySet()]) {\n            Contact incoming = byEmail.get(existing.Email.toLowerCase());\n            if (incoming != null && incoming.Id != existing.Id) {\n                incoming.Email.addError('A contact with this email already exists (' + existing.Id + ')');\n            }\n        }\n    }\n}\n", "force-app/main/default/classes/ContactDuplicateServiceTest.cls": "@IsTest\nprivate class ContactDuplicateServiceTest {\n    @IsTest\n    static void blocksDuplicateAgainstDatabase() {\n        insert new Contact(LastName = 'Original', Email = 'amara@example.com');\n        Database.SaveResult sr = Database.insert(new Contact(LastName = 'Copy', Email = 'AMARA@example.com'), false);\n        Assert.isFalse(sr.isSuccess(), 'Case-insensitive duplicate should be blocked');\n    }\n\n    @IsTest\n    static void blocksDuplicateWithinBatch() {\n        List<Contact> batch = new List<Contact>{\n            new Contact(LastName = 'A', Email = 'dev@example.com'),\n            new Contact(LastName = 'B', Email = 'dev@example.com')\n        };\n        List<Database.SaveResult> results = Database.insert(batch, false);\n        Assert.isTrue(results[0].isSuccess(), 'First record is kept');\n        Assert.isFalse(results[1].isSuccess(), 'Second record in the same batch is blocked');\n    }\n\n    @IsTest\n    static void allowsUpdateWithoutEmailChange() {\n        Contact c = new Contact(LastName = 'Same', Email = 'same@example.com');\n        insert c;\n        c.LastName = 'Renamed';\n        update c; // must not flag itself as a duplicate\n        Assert.areEqual('Renamed', [SELECT LastName FROM Contact WHERE Id = :c.Id].LastName);\n    }\n\n    @IsTest\n    static void bulkInsertOfUniqueEmails() {\n        List<Contact> contacts = new List<Contact>();\n        for (Integer i = 0; i < 200; i++) {\n            contacts.add(new Contact(LastName = 'Bulk' + i, Email = 'bulk' + i + '@example.com'));\n        }\n        Test.startTest();\n        insert contacts;\n        Test.stopTest();\n        Assert.areEqual(200, [SELECT COUNT() FROM Contact]);\n    }\n}\n", "force-app/main/default/classes/TriggerHandler.cls": "/**\n * Minimal trigger framework: one trigger per object delegates to a handler\n * that overrides only the events it needs. Supports bypassing a handler by\n * name (for data loads and tests).\n *\n * Interview talking points:\n *  - one trigger per object keeps order of execution predictable\n *  - logic lives in testable classes, not in the trigger body\n *  - bypass lets bulk data loads skip automation deliberately\n */\npublic virtual class TriggerHandler {\n    private static final Set<String> BYPASSED = new Set<String>();\n\n    public static void bypass(String handlerName) {\n        BYPASSED.add(handlerName);\n    }\n\n    public static void clearBypass(String handlerName) {\n        BYPASSED.remove(handlerName);\n    }\n\n    public static Boolean isBypassed(String handlerName) {\n        return BYPASSED.contains(handlerName);\n    }\n\n    /** Called from the trigger body. */\n    public void run() {\n        if (!Trigger.isExecuting || isBypassed(getHandlerName())) {\n            return;\n        }\n        switch on Trigger.operationType {\n            when BEFORE_INSERT {\n                beforeInsert(Trigger.new);\n            }\n            when BEFORE_UPDATE {\n                beforeUpdate(Trigger.new, Trigger.oldMap);\n            }\n            when BEFORE_DELETE {\n                beforeDelete(Trigger.old);\n            }\n            when AFTER_INSERT {\n                afterInsert(Trigger.new);\n            }\n            when AFTER_UPDATE {\n                afterUpdate(Trigger.new, Trigger.oldMap);\n            }\n            when AFTER_DELETE {\n                afterDelete(Trigger.old);\n            }\n            when AFTER_UNDELETE {\n                afterUndelete(Trigger.new);\n            }\n        }\n    }\n\n    @TestVisible\n    protected String getHandlerName() {\n        return String.valueOf(this).substringBefore(':');\n    }\n\n    protected virtual void beforeInsert(List<SObject> newList) {}\n    protected virtual void beforeUpdate(List<SObject> newList, Map<Id, SObject> oldMap) {}\n    protected virtual void beforeDelete(List<SObject> oldList) {}\n    protected virtual void afterInsert(List<SObject> newList) {}\n    protected virtual void afterUpdate(List<SObject> newList, Map<Id, SObject> oldMap) {}\n    protected virtual void afterDelete(List<SObject> oldList) {}\n    protected virtual void afterUndelete(List<SObject> newList) {}\n}\n", "force-app/main/default/classes/OpportunityTriggerHandler.cls": "/**\n * Scenario A3 \u2014 when an opportunity becomes Closed Won, create ONE kick-off\n * task. A static set guards against recursion (workflow/flow field updates\n * can re-fire the update trigger in the same transaction).\n */\npublic with sharing class OpportunityTriggerHandler extends TriggerHandler {\n    @TestVisible\n    private static final Set<Id> ALREADY_PROCESSED = new Set<Id>();\n\n    protected override void afterUpdate(List<SObject> newList, Map<Id, SObject> oldMap) {\n        List<Task> tasks = new List<Task>();\n        for (Opportunity opp : (List<Opportunity>) newList) {\n            Opportunity old = (Opportunity) oldMap.get(opp.Id);\n            Boolean justWon = opp.IsWon && !old.IsWon;\n            if (justWon && !ALREADY_PROCESSED.contains(opp.Id)) {\n                ALREADY_PROCESSED.add(opp.Id);\n                tasks.add(new Task(\n                    WhatId = opp.Id,\n                    OwnerId = opp.OwnerId,\n                    Subject = 'Kick-off call',\n                    Priority = 'High',\n                    ActivityDate = Date.today().addDays(3)\n                ));\n            }\n        }\n        if (!tasks.isEmpty()) {\n            insert tasks;\n        }\n    }\n}\n", "force-app/main/default/triggers/OpportunityTrigger.trigger": "trigger OpportunityTrigger on Opportunity (after update) {\n    new OpportunityTriggerHandler().run();\n}\n", "force-app/main/default/classes/OpportunityTriggerHandlerTest.cls": "@IsTest\nprivate class OpportunityTriggerHandlerTest {\n    private static String wonStage() {\n        return [SELECT ApiName FROM OpportunityStage WHERE IsWon = TRUE AND IsActive = TRUE LIMIT 1].ApiName;\n    }\n\n    @IsTest\n    static void createsOneTaskPerWonOpportunityInBulk() {\n        List<Opportunity> opps = new List<Opportunity>();\n        for (Integer i = 0; i < 200; i++) {\n            opps.add(new Opportunity(Name = 'Opp ' + i, StageName = 'Prospecting', CloseDate = Date.today().addDays(30)));\n        }\n        insert opps;\n\n        String won = wonStage();\n        for (Opportunity o : opps) {\n            o.StageName = won;\n        }\n        Test.startTest();\n        update opps;\n        update opps; // second update must not create more tasks\n        Test.stopTest();\n\n        Assert.areEqual(200, [SELECT COUNT() FROM Task WHERE Subject = 'Kick-off call'], 'Exactly one task per opportunity');\n    }\n\n    @IsTest\n    static void bypassSkipsAutomation() {\n        Opportunity o = new Opportunity(Name = 'Bypass', StageName = 'Prospecting', CloseDate = Date.today());\n        insert o;\n        TriggerHandler.bypass('OpportunityTriggerHandler');\n        o.StageName = wonStage();\n        update o;\n        TriggerHandler.clearBypass('OpportunityTriggerHandler');\n        Assert.areEqual(0, [SELECT COUNT() FROM Task], 'Bypassed handler creates nothing');\n    }\n}\n", "force-app/main/default/classes/AccountEnrichmentQueueable.cls": "/**\n * Scenario A4 \u2014 enrich Accounts from an external REST API asynchronously.\n *  - Queueable (not @future) so it can take complex parameters and be chained\n *  - Database.AllowsCallouts for HTTP from async context\n *  - Named Credential \"Company_Info\" holds the endpoint and auth (no secrets in code)\n *  - Processes CHUNK_SIZE accounts per job and chains the rest (100 callouts/transaction limit)\n *  - Per-record failures are recorded, not thrown, so one bad domain doesn't fail the batch\n */\npublic with sharing class AccountEnrichmentQueueable implements Queueable, Database.AllowsCallouts {\n    @TestVisible\n    private static final Integer CHUNK_SIZE = 50;\n    private final List<Id> accountIds;\n\n    public AccountEnrichmentQueueable(List<Id> accountIds) {\n        this.accountIds = accountIds;\n    }\n\n    public void execute(QueueableContext context) {\n        List<Id> current = new List<Id>();\n        List<Id> remaining = new List<Id>();\n        for (Integer i = 0; i < accountIds.size(); i++) {\n            if (i < CHUNK_SIZE) {\n                current.add(accountIds[i]);\n            } else {\n                remaining.add(accountIds[i]);\n            }\n        }\n\n        List<Account> updates = new List<Account>();\n        for (Account acc : [SELECT Id, Website FROM Account WHERE Id IN :current AND Website != NULL]) {\n            CompanyInfo info = fetch(domainOf(acc.Website));\n            if (info != null) {\n                updates.add(new Account(Id = acc.Id, NumberOfEmployees = info.employees, Industry = info.industry));\n            }\n        }\n        if (!updates.isEmpty()) {\n            Database.update(updates, false);\n        }\n\n        if (!remaining.isEmpty() && !Test.isRunningTest()) {\n            System.enqueueJob(new AccountEnrichmentQueueable(remaining));\n        }\n    }\n\n    @TestVisible\n    private static String domainOf(String website) {\n        return website.toLowerCase().removeStart('https://').removeStart('http://').removeStart('www.').substringBefore('/');\n    }\n\n    private static CompanyInfo fetch(String domain) {\n        HttpRequest req = new HttpRequest();\n        req.setEndpoint('callout:Company_Info/companies?domain=' + EncodingUtil.urlEncode(domain, 'UTF-8'));\n        req.setMethod('GET');\n        req.setTimeout(10000);\n        try {\n            HttpResponse res = new Http().send(req);\n            if (res.getStatusCode() != 200) {\n                return null;\n            }\n            return (CompanyInfo) JSON.deserialize(res.getBody(), CompanyInfo.class);\n        } catch (CalloutException e) {\n            return null; // in production: log to a custom object / platform event\n        }\n    }\n\n    public class CompanyInfo {\n        public Integer employees;\n        public String industry;\n    }\n}\n", "force-app/main/default/classes/AccountEnrichmentQueueableTest.cls": "@IsTest\nprivate class AccountEnrichmentQueueableTest {\n    private class CompanyApiMock implements HttpCalloutMock {\n        public HttpResponse respond(HttpRequest req) {\n            HttpResponse res = new HttpResponse();\n            if (req.getEndpoint().contains('broken.example')) {\n                res.setStatusCode(500);\n                res.setBody('{\"error\":\"boom\"}');\n            } else {\n                res.setStatusCode(200);\n                res.setBody('{\"employees\": 250, \"industry\": \"Transportation\"}');\n            }\n            return res;\n        }\n    }\n\n    @IsTest\n    static void enrichesAccountsAndSkipsFailures() {\n        Account ok = new Account(Name = 'Swift Haulage', Website = 'https://www.swifthaulage.example/about');\n        Account bad = new Account(Name = 'Broken', Website = 'broken.example');\n        insert new List<Account>{ ok, bad };\n\n        Test.setMock(HttpCalloutMock.class, new CompanyApiMock());\n        Test.startTest();\n        System.enqueueJob(new AccountEnrichmentQueueable(new List<Id>{ ok.Id, bad.Id }));\n        Test.stopTest();\n\n        Account okAfter = [SELECT NumberOfEmployees, Industry FROM Account WHERE Id = :ok.Id];\n        Assert.areEqual(250, okAfter.NumberOfEmployees);\n        Assert.areEqual('Transportation', okAfter.Industry);\n        Assert.isNull([SELECT Industry FROM Account WHERE Id = :bad.Id].Industry, 'Failed callout leaves record untouched');\n    }\n\n    @IsTest\n    static void extractsDomain() {\n        Assert.areEqual('acme.com', AccountEnrichmentQueueable.domainOf('HTTPS://www.Acme.com/contact'));\n    }\n}\n", "force-app/main/default/classes/StaleLeadBatch.cls": "/**\n * Scenario A5 \u2014 close leads untouched for N days.\n *  - Batchable over a QueryLocator (up to 50 million rows)\n *  - Database.Stateful keeps running totals across execute() chunks\n *  - Partial-success DML so one bad record doesn't fail the chunk\n *  - Schedulable so it can run nightly:  System.schedule('Stale leads', '0 0 2 * * ?', new StaleLeadBatch(90));\n */\npublic with sharing class StaleLeadBatch implements Database.Batchable<SObject>, Database.Stateful, Schedulable {\n    public static final String CLOSED_STATUS = 'Closed - Not Converted';\n    private final Integer staleDays;\n    @TestVisible\n    private Integer closed = 0;\n    @TestVisible\n    private Integer failed = 0;\n\n    public StaleLeadBatch(Integer staleDays) {\n        this.staleDays = staleDays;\n    }\n\n    public Database.QueryLocator start(Database.BatchableContext bc) {\n        Datetime cutoff = System.now().addDays(-staleDays);\n        return Database.getQueryLocator([\n            SELECT Id, Status\n            FROM Lead\n            WHERE IsConverted = FALSE AND Status != :CLOSED_STATUS AND LastModifiedDate < :cutoff\n        ]);\n    }\n\n    public void execute(Database.BatchableContext bc, List<Lead> scope) {\n        for (Lead l : scope) {\n            l.Status = CLOSED_STATUS;\n        }\n        for (Database.SaveResult sr : Database.update(scope, false)) {\n            if (sr.isSuccess()) {\n                closed++;\n            } else {\n                failed++;\n            }\n        }\n    }\n\n    public void finish(Database.BatchableContext bc) {\n        // Real projects: send a summary email or write a log record.\n        System.debug(LoggingLevel.INFO, 'StaleLeadBatch closed=' + closed + ' failed=' + failed);\n    }\n\n    public void execute(SchedulableContext sc) {\n        Database.executeBatch(new StaleLeadBatch(staleDays), 200);\n    }\n}\n", "force-app/main/default/classes/StaleLeadBatchTest.cls": "@IsTest\nprivate class StaleLeadBatchTest {\n    @IsTest\n    static void closesStaleLeads() {\n        List<Lead> leads = new List<Lead>();\n        for (Integer i = 0; i < 50; i++) {\n            leads.add(new Lead(LastName = 'Lead' + i, Company = 'Co' + i, Status = 'Open - Not Contacted'));\n        }\n        insert leads;\n\n        Test.startTest();\n        // staleDays = -1 puts the cutoff in the future, so every lead qualifies\n        // (LastModifiedDate cannot be back-dated in tests).\n        Database.executeBatch(new StaleLeadBatch(-1), 200);\n        Test.stopTest();\n\n        Assert.areEqual(50, [SELECT COUNT() FROM Lead WHERE Status = :StaleLeadBatch.CLOSED_STATUS]);\n    }\n\n    @IsTest\n    static void schedulesNightly() {\n        Test.startTest();\n        String jobId = System.schedule('Stale leads test', '0 0 2 * * ?', new StaleLeadBatch(90));\n        Test.stopTest();\n        Assert.isNotNull(jobId);\n    }\n}\n", "force-app/main/default/classes/CaseApi.cls": "/**\n * Scenario A6 \u2014 a custom REST API (remote call-in).\n *   GET  /services/apexrest/v1/cases/{caseId}   -> case summary\n *   POST /services/apexrest/v1/cases            -> create case, 201 or 400\n * Uses a DTO so the external contract is stable even if fields change,\n * and USER_MODE so the calling integration user's permissions apply.\n */\n@RestResource(urlMapping='/v1/cases/*')\nglobal with sharing class CaseApi {\n    global class CaseDto {\n        public String id;\n        public String caseNumber;\n        public String subject;\n        public String status;\n        public String priority;\n        public String accountId;\n    }\n\n    global class CreateRequest {\n        public String accountId;\n        public String subject;\n        public String priority;\n    }\n\n    @HttpGet\n    global static void getCase() {\n        RestResponse res = RestContext.response;\n        String rawId = RestContext.request.requestURI.substringAfterLast('/');\n        Id caseId;\n        try {\n            caseId = Id.valueOf(rawId);\n        } catch (Exception e) {\n            respond(res, 400, new Map<String, String>{ 'error' => 'Invalid case id' });\n            return;\n        }\n        List<Case> found = [\n            SELECT Id, CaseNumber, Subject, Status, Priority, AccountId\n            FROM Case\n            WHERE Id = :caseId\n            WITH USER_MODE\n            LIMIT 1\n        ];\n        if (found.isEmpty()) {\n            respond(res, 404, new Map<String, String>{ 'error' => 'Case not found' });\n            return;\n        }\n        respond(res, 200, toDto(found[0]));\n    }\n\n    @HttpPost\n    global static void createCase() {\n        RestResponse res = RestContext.response;\n        CreateRequest body;\n        try {\n            body = (CreateRequest) JSON.deserialize(RestContext.request.requestBody.toString(), CreateRequest.class);\n        } catch (Exception e) {\n            respond(res, 400, new Map<String, String>{ 'error' => 'Invalid JSON' });\n            return;\n        }\n        if (body == null || String.isBlank(body.subject)) {\n            respond(res, 400, new Map<String, String>{ 'error' => 'subject is required' });\n            return;\n        }\n        Case c = new Case(\n            Subject = body.subject.left(255),\n            Priority = String.isBlank(body.priority) ? 'Medium' : body.priority,\n            AccountId = String.isBlank(body.accountId) ? null : body.accountId,\n            Origin = 'Web'\n        );\n        try {\n            Database.insert(c, AccessLevel.USER_MODE);\n        } catch (Exception e) {\n            respond(res, 400, new Map<String, String>{ 'error' => e.getMessage() });\n            return;\n        }\n        Case created = [SELECT Id, CaseNumber, Subject, Status, Priority, AccountId FROM Case WHERE Id = :c.Id];\n        respond(res, 201, toDto(created));\n    }\n\n    private static CaseDto toDto(Case c) {\n        CaseDto dto = new CaseDto();\n        dto.id = c.Id;\n        dto.caseNumber = c.CaseNumber;\n        dto.subject = c.Subject;\n        dto.status = c.Status;\n        dto.priority = c.Priority;\n        dto.accountId = c.AccountId;\n        return dto;\n    }\n\n    private static void respond(RestResponse res, Integer status, Object payload) {\n        res.statusCode = status;\n        res.addHeader('Content-Type', 'application/json');\n        res.responseBody = Blob.valueOf(JSON.serialize(payload));\n    }\n}\n", "force-app/main/default/classes/CaseApiTest.cls": "@IsTest\nprivate class CaseApiTest {\n    private static void setUp(String method, String uri, String body) {\n        RestRequest req = new RestRequest();\n        req.httpMethod = method;\n        req.requestURI = uri;\n        if (body != null) {\n            req.requestBody = Blob.valueOf(body);\n        }\n        RestContext.request = req;\n        RestContext.response = new RestResponse();\n    }\n\n    @IsTest\n    static void createsAndReadsCase() {\n        Account a = new Account(Name = 'Thames Couriers');\n        insert a;\n\n        setUp('POST', '/services/apexrest/v1/cases', '{\"accountId\":\"' + a.Id + '\",\"subject\":\"Tracker offline\",\"priority\":\"High\"}');\n        CaseApi.createCase();\n        Assert.areEqual(201, RestContext.response.statusCode);\n        Map<String, Object> created = (Map<String, Object>) JSON.deserializeUntyped(RestContext.response.responseBody.toString());\n        String caseId = (String) created.get('id');\n\n        setUp('GET', '/services/apexrest/v1/cases/' + caseId, null);\n        CaseApi.getCase();\n        Assert.areEqual(200, RestContext.response.statusCode);\n        Map<String, Object> fetched = (Map<String, Object>) JSON.deserializeUntyped(RestContext.response.responseBody.toString());\n        Assert.areEqual('Tracker offline', fetched.get('subject'));\n    }\n\n    @IsTest\n    static void rejectsMissingSubject() {\n        setUp('POST', '/services/apexrest/v1/cases', '{\"priority\":\"Low\"}');\n        CaseApi.createCase();\n        Assert.areEqual(400, RestContext.response.statusCode);\n    }\n\n    @IsTest\n    static void rejectsInvalidJson() {\n        setUp('POST', '/services/apexrest/v1/cases', '{not json');\n        CaseApi.createCase();\n        Assert.areEqual(400, RestContext.response.statusCode);\n    }\n\n    @IsTest\n    static void returns404ForUnknownCase() {\n        setUp('GET', '/services/apexrest/v1/cases/500000000000001', null);\n        CaseApi.getCase();\n        Assert.areEqual(404, RestContext.response.statusCode);\n    }\n}\n", "force-app/main/default/classes/OrderEventPublisher.cls": "/**\n * Scenario A7 \u2014 publish a platform event when an order ships.\n * Order_Shipped__e is High Volume with \"Publish After Commit\", so subscribers\n * only see events from transactions that actually committed.\n * EventBus.publish returns SaveResults: always check them.\n */\npublic with sharing class OrderEventPublisher {\n    public static List<Database.SaveResult> publishShipped(Map<String, Id> accountIdByOrderNumber) {\n        List<Order_Shipped__e> events = new List<Order_Shipped__e>();\n        for (String orderNumber : accountIdByOrderNumber.keySet()) {\n            events.add(new Order_Shipped__e(\n                Order_Number__c = orderNumber,\n                Account_Id__c = accountIdByOrderNumber.get(orderNumber)\n            ));\n        }\n        List<Database.SaveResult> results = EventBus.publish(events);\n        for (Database.SaveResult sr : results) {\n            if (!sr.isSuccess()) {\n                for (Database.Error err : sr.getErrors()) {\n                    System.debug(LoggingLevel.ERROR, 'Publish failed: ' + err.getStatusCode() + ' ' + err.getMessage());\n                }\n            }\n        }\n        return results;\n    }\n}\n", "force-app/main/default/classes/OrderShippedSubscriber.cls": "/**\n * Subscriber logic for Order_Shipped__e (called from the event trigger).\n * Platform event triggers run as the Automated Process user unless a\n * PlatformEventSubscriberConfig sets a running user, and they receive up to\n * 2,000 events per batch. setResumeCheckpoint lets a retry continue after the\n * last successfully processed event instead of reprocessing the whole batch.\n */\npublic without sharing class OrderShippedSubscriber {\n    public static void handle(List<Order_Shipped__e> events) {\n        List<Task> tasks = new List<Task>();\n        for (Order_Shipped__e e : events) {\n            if (String.isBlank(e.Account_Id__c)) {\n                continue;\n            }\n            tasks.add(new Task(\n                WhatId = e.Account_Id__c,\n                Subject = 'Order ' + e.Order_Number__c + ' shipped \u2014 confirm delivery',\n                ActivityDate = Date.today().addDays(2)\n            ));\n        }\n        if (!tasks.isEmpty()) {\n            insert tasks;\n        }\n        if (!events.isEmpty() && !Test.isRunningTest()) {\n            EventBus.TriggerContext.currentContext().setResumeCheckpoint(events[events.size() - 1].ReplayId);\n        }\n    }\n}\n", "force-app/main/default/triggers/OrderShippedTrigger.trigger": "trigger OrderShippedTrigger on Order_Shipped__e (after insert) {\n    OrderShippedSubscriber.handle(Trigger.new);\n}\n", "force-app/main/default/classes/OrderEventPublisherTest.cls": "@IsTest\nprivate class OrderEventPublisherTest {\n    @IsTest\n    static void publishedEventCreatesTask() {\n        Account a = new Account(Name = 'Harbour Movers');\n        insert a;\n\n        Test.startTest();\n        List<Database.SaveResult> results = OrderEventPublisher.publishShipped(new Map<String, Id>{ 'ORD-1001' => a.Id });\n        Test.stopTest(); // delivers published events to subscribers\n\n        Assert.isTrue(results[0].isSuccess(), 'Event published');\n        Task t = [SELECT Subject, WhatId FROM Task LIMIT 1];\n        Assert.areEqual(a.Id, t.WhatId);\n        Assert.isTrue(t.Subject.contains('ORD-1001'));\n    }\n\n    @IsTest\n    static void deliverWithoutStopTest() {\n        Account a = new Account(Name = 'Bluebird Vans');\n        insert a;\n        OrderEventPublisher.publishShipped(new Map<String, Id>{ 'ORD-2002' => a.Id });\n        Test.getEventBus().deliver(); // explicit delivery inside the test\n        Assert.areEqual(1, [SELECT COUNT() FROM Task WHERE WhatId = :a.Id]);\n    }\n}\n", "force-app/main/default/classes/BusinessDaysCalculator.cls": "/**\n * Scenario A8 \u2014 an invocable action for Flow (and Agentforce):\n * number of business days (Mon\u2013Fri) after startDate up to and including endDate.\n * Locale-independent: weekday is derived from a known Monday, not toStartOfWeek().\n */\npublic with sharing class BusinessDaysCalculator {\n    private static final Date KNOWN_MONDAY = Date.newInstance(1900, 1, 1);\n\n    public class Request {\n        @InvocableVariable(label='Start date' description='Counting starts the day after this date' required=true)\n        public Date startDate;\n        @InvocableVariable(label='End date' description='Last day counted (inclusive)' required=true)\n        public Date endDate;\n    }\n\n    public class Result {\n        @InvocableVariable(label='Business days' description='Weekdays between the dates; negative if end is before start')\n        public Integer businessDays;\n    }\n\n    @InvocableMethod(label='Count business days' description='Counts Monday-to-Friday days between two dates' category='Utilities')\n    public static List<Result> calculate(List<Request> requests) {\n        List<Result> results = new List<Result>();\n        for (Request r : requests) {\n            Result res = new Result();\n            res.businessDays = between(r.startDate, r.endDate);\n            results.add(res);\n        }\n        return results;\n    }\n\n    public static Integer between(Date startDate, Date endDate) {\n        if (startDate == null || endDate == null) {\n            return null;\n        }\n        if (endDate < startDate) {\n            return -between(endDate, startDate);\n        }\n        Integer count = 0;\n        for (Date d = startDate.addDays(1); d <= endDate; d = d.addDays(1)) {\n            if (isWeekday(d)) {\n                count++;\n            }\n        }\n        return count;\n    }\n\n    public static Boolean isWeekday(Date d) {\n        Integer dayIndex = Math.mod(KNOWN_MONDAY.daysBetween(d), 7); // 0 = Monday ... 6 = Sunday\n        return dayIndex < 5;\n    }\n}\n", "force-app/main/default/classes/BusinessDaysCalculatorTest.cls": "@IsTest\nprivate class BusinessDaysCalculatorTest {\n    @IsTest\n    static void countsAcrossWeekend() {\n        // Fri 2 Oct 2026 -> Mon 5 Oct 2026 = 1 business day (Monday)\n        Assert.areEqual(1, BusinessDaysCalculator.between(Date.newInstance(2026, 10, 2), Date.newInstance(2026, 10, 5)));\n    }\n\n    @IsTest\n    static void countsFullWeek() {\n        // Mon 5 Oct -> Mon 12 Oct = Tue..Fri (4) + Mon (1)\n        Assert.areEqual(5, BusinessDaysCalculator.between(Date.newInstance(2026, 10, 5), Date.newInstance(2026, 10, 12)));\n    }\n\n    @IsTest\n    static void handlesReversedAndNull() {\n        Assert.areEqual(-5, BusinessDaysCalculator.between(Date.newInstance(2026, 10, 12), Date.newInstance(2026, 10, 5)));\n        Assert.isNull(BusinessDaysCalculator.between(null, Date.today()));\n    }\n\n    @IsTest\n    static void invocableIsBulkSafe() {\n        List<BusinessDaysCalculator.Request> reqs = new List<BusinessDaysCalculator.Request>();\n        for (Integer i = 0; i < 200; i++) {\n            BusinessDaysCalculator.Request r = new BusinessDaysCalculator.Request();\n            r.startDate = Date.newInstance(2026, 10, 5);\n            r.endDate = Date.newInstance(2026, 10, 12);\n            reqs.add(r);\n        }\n        List<BusinessDaysCalculator.Result> results = BusinessDaysCalculator.calculate(reqs);\n        Assert.areEqual(200, results.size());\n        Assert.areEqual(5, results[199].businessDays);\n    }\n}\n", "force-app/main/default/classes/CollectionKata.cls": "/**\n * Scenario A9 \u2014 classic whiteboard / live-coding exercises in Apex.\n * Each method is O(n) or O(n log n) and handles null/empty input.\n */\npublic with sharing class CollectionKata {\n    /** Largest-amount opportunity per account (ties: first seen wins). */\n    public static Map<Id, Opportunity> topOpportunityByAccount(List<Opportunity> opps) {\n        Map<Id, Opportunity> best = new Map<Id, Opportunity>();\n        if (opps == null) {\n            return best;\n        }\n        for (Opportunity o : opps) {\n            if (o.AccountId == null || o.Amount == null) {\n                continue;\n            }\n            Opportunity current = best.get(o.AccountId);\n            if (current == null || o.Amount > current.Amount) {\n                best.put(o.AccountId, o);\n            }\n        }\n        return best;\n    }\n\n    /** Second-highest DISTINCT value, or null if there isn't one. */\n    public static Decimal secondHighest(List<Decimal> values) {\n        Decimal first = null;\n        Decimal second = null;\n        if (values == null) {\n            return null;\n        }\n        for (Decimal v : values) {\n            if (v == null || v == first) {\n                continue;\n            }\n            if (first == null || v > first) {\n                second = first;\n                first = v;\n            } else if (second == null || v > second) {\n                second = v;\n            }\n        }\n        return second;\n    }\n\n    /** Anagram check ignoring case, spaces and punctuation. */\n    public static Boolean isAnagram(String a, String b) {\n        if (a == null || b == null) {\n            return false;\n        }\n        return sortedLetters(a) == sortedLetters(b);\n    }\n\n    private static String sortedLetters(String s) {\n        List<String> chars = s.toLowerCase().replaceAll('[^a-z0-9]', '').split('');\n        chars.sort();\n        return String.join(chars, '');\n    }\n\n    /** Group contacts by email domain (lower case). Contacts without email go under ''. */\n    public static Map<String, List<Contact>> contactsByDomain(List<Contact> contacts) {\n        Map<String, List<Contact>> groups = new Map<String, List<Contact>>();\n        if (contacts == null) {\n            return groups;\n        }\n        for (Contact c : contacts) {\n            String domain = String.isBlank(c.Email) ? '' : c.Email.substringAfter('@').toLowerCase();\n            if (!groups.containsKey(domain)) {\n                groups.put(domain, new List<Contact>());\n            }\n            groups.get(domain).add(c);\n        }\n        return groups;\n    }\n\n    /** Split a list of Ids into chunks of at most size n (e.g. for callout or DML batching). */\n    public static List<List<Id>> chunk(List<Id> ids, Integer n) {\n        List<List<Id>> chunks = new List<List<Id>>();\n        if (ids == null || n == null || n < 1) {\n            return chunks;\n        }\n        List<Id> current = new List<Id>();\n        for (Id i : ids) {\n            current.add(i);\n            if (current.size() == n) {\n                chunks.add(current);\n                current = new List<Id>();\n            }\n        }\n        if (!current.isEmpty()) {\n            chunks.add(current);\n        }\n        return chunks;\n    }\n\n    /** First non-repeating character, or null. */\n    public static String firstUniqueChar(String s) {\n        if (String.isEmpty(s)) {\n            return null;\n        }\n        Map<String, Integer> counts = new Map<String, Integer>();\n        List<String> chars = s.split('');\n        for (String ch : chars) {\n            counts.put(ch, counts.containsKey(ch) ? counts.get(ch) + 1 : 1);\n        }\n        for (String ch : chars) {\n            if (counts.get(ch) == 1) {\n                return ch;\n            }\n        }\n        return null;\n    }\n}\n", "force-app/main/default/classes/CollectionKataTest.cls": "@IsTest\nprivate class CollectionKataTest {\n    @IsTest\n    static void topOpportunity() {\n        Id acc = '001000000000001';\n        List<Opportunity> opps = new List<Opportunity>{\n            new Opportunity(AccountId = acc, Name = 'Small', Amount = 100),\n            new Opportunity(AccountId = acc, Name = 'Big', Amount = 900),\n            new Opportunity(AccountId = acc, Name = 'NoAmount')\n        };\n        Assert.areEqual('Big', CollectionKata.topOpportunityByAccount(opps).get(acc).Name);\n    }\n\n    @IsTest\n    static void secondHighestDistinct() {\n        Assert.areEqual(7, CollectionKata.secondHighest(new List<Decimal>{ 9, 7, 9, 3 }));\n        Assert.isNull(CollectionKata.secondHighest(new List<Decimal>{ 5, 5 }));\n    }\n\n    @IsTest\n    static void anagrams() {\n        Assert.isTrue(CollectionKata.isAnagram('Dormitory', 'Dirty room!'));\n        Assert.isFalse(CollectionKata.isAnagram('Apex', 'Flow'));\n    }\n\n    @IsTest\n    static void groupsByDomain() {\n        Map<String, List<Contact>> g = CollectionKata.contactsByDomain(new List<Contact>{\n            new Contact(LastName = 'A', Email = 'a@Acme.com'),\n            new Contact(LastName = 'B', Email = 'b@acme.com'),\n            new Contact(LastName = 'C')\n        });\n        Assert.areEqual(2, g.get('acme.com').size());\n        Assert.areEqual(1, g.get('').size());\n    }\n\n    @IsTest\n    static void chunks() {\n        List<Id> ids = new List<Id>();\n        for (Integer i = 0; i < 5; i++) {\n            ids.add('001000000000001');\n        }\n        List<List<Id>> c = CollectionKata.chunk(ids, 2);\n        Assert.areEqual(3, c.size());\n        Assert.areEqual(1, c[2].size());\n    }\n\n    @IsTest\n    static void firstUnique() {\n        Assert.areEqual('a', CollectionKata.firstUniqueChar('salesforce')); // s,a,l,e,s... -> 'a' appears once first\n        Assert.isNull(CollectionKata.firstUniqueChar('aabb'));\n    }\n}\n", "force-app/main/default/classes/AccountSearchService.cls": "/**\n * Scenario A10 \u2014 dynamic SOQL done safely.\n *  - user input goes into BIND variables (Database.queryWithBinds), never concatenated\n *  - sort field and direction are whitelisted (cannot be bound)\n *  - AccessLevel.USER_MODE enforces CRUD, FLS and sharing for the running user\n */\npublic with sharing class AccountSearchService {\n    private static final Set<String> SORTABLE = new Set<String>{ 'Name', 'AnnualRevenue', 'CreatedDate' };\n\n    public class Criteria {\n        @AuraEnabled public String nameContains;\n        @AuraEnabled public String industry;\n        @AuraEnabled public Decimal minRevenue;\n        @AuraEnabled public String sortBy;\n        @AuraEnabled public Boolean descending;\n        @AuraEnabled public Integer maxRows;\n    }\n\n    public static List<Account> search(Criteria c) {\n        List<String> clauses = new List<String>();\n        Map<String, Object> binds = new Map<String, Object>();\n\n        if (c != null && String.isNotBlank(c.nameContains)) {\n            clauses.add('Name LIKE :namePattern');\n            binds.put('namePattern', '%' + escapeLike(c.nameContains.trim()) + '%');\n        }\n        if (c != null && String.isNotBlank(c.industry)) {\n            clauses.add('Industry = :industry');\n            binds.put('industry', c.industry);\n        }\n        if (c != null && c.minRevenue != null) {\n            clauses.add('AnnualRevenue >= :minRevenue');\n            binds.put('minRevenue', c.minRevenue);\n        }\n\n        String sortField = (c != null && SORTABLE.contains(c.sortBy)) ? c.sortBy : 'Name';\n        String direction = (c != null && c.descending == true) ? 'DESC' : 'ASC';\n        Integer rows = (c == null || c.maxRows == null) ? 50 : Math.max(1, Math.min(c.maxRows, 200));\n        binds.put('maxRows', rows);\n\n        String soql = 'SELECT Id, Name, Industry, AnnualRevenue FROM Account'\n            + (clauses.isEmpty() ? '' : ' WHERE ' + String.join(clauses, ' AND '))\n            + ' ORDER BY ' + sortField + ' ' + direction + ' NULLS LAST'\n            + ' LIMIT :maxRows';\n        return Database.queryWithBinds(soql, binds, AccessLevel.USER_MODE);\n    }\n\n    /** Escape LIKE wildcards so a user typing % or _ searches literally. */\n    @TestVisible\n    private static String escapeLike(String s) {\n        return s.replace('\\\\', '\\\\\\\\').replace('%', '\\\\%').replace('_', '\\\\_');\n    }\n}\n", "force-app/main/default/classes/AccountSearchServiceTest.cls": "@IsTest\nprivate class AccountSearchServiceTest {\n    @TestSetup\n    static void data() {\n        insert new List<Account>{\n            new Account(Name = 'Thames Couriers', Industry = 'Transportation', AnnualRevenue = 5000000),\n            new Account(Name = 'Essex Freight', Industry = 'Transportation', AnnualRevenue = 900000),\n            new Account(Name = 'Acme 100% Labs', Industry = 'Technology', AnnualRevenue = 2000000)\n        };\n    }\n\n    @IsTest\n    static void filtersAndSorts() {\n        AccountSearchService.Criteria c = new AccountSearchService.Criteria();\n        c.industry = 'Transportation';\n        c.sortBy = 'AnnualRevenue';\n        c.descending = true;\n        List<Account> res = AccountSearchService.search(c);\n        Assert.areEqual(2, res.size());\n        Assert.areEqual('Thames Couriers', res[0].Name);\n    }\n\n    @IsTest\n    static void escapesWildcardsAndIgnoresBadSortField() {\n        AccountSearchService.Criteria c = new AccountSearchService.Criteria();\n        c.nameContains = '100%';\n        c.sortBy = 'Name; DELETE'; // not whitelisted -> falls back to Name\n        List<Account> res = AccountSearchService.search(c);\n        Assert.areEqual(1, res.size());\n        Assert.areEqual('Acme 100% Labs', res[0].Name);\n    }\n\n    @IsTest\n    static void minRevenueAndLimit() {\n        AccountSearchService.Criteria c = new AccountSearchService.Criteria();\n        c.minRevenue = 1000000;\n        c.maxRows = 1;\n        Assert.areEqual(1, AccountSearchService.search(c).size());\n    }\n}\n", "force-app/main/default/lwc/contactSearch/contactSearch.js": "/**\n * Scenario L1 \u2014 debounced contact search.\n * Shows: @wire with a reactive parameter ($searchTerm), debouncing to avoid a\n * server call per keystroke, loading/empty/error states, and a datatable.\n */\nimport { LightningElement, wire } from 'lwc';\nimport searchContacts from '@salesforce/apex/ContactSearchController.searchContacts';\n\nconst DELAY_MS = 300;\nconst COLUMNS = [\n    { label: 'Name', fieldName: 'Name' },\n    { label: 'Email', fieldName: 'Email', type: 'email' },\n    { label: 'Phone', fieldName: 'Phone', type: 'phone' },\n    { label: 'Account', fieldName: 'AccountName' }\n];\n\nexport default class ContactSearch extends LightningElement {\n    columns = COLUMNS;\n    searchTerm = '';\n    contacts = [];\n    error;\n    isLoading = false;\n    delayTimeout;\n\n    @wire(searchContacts, { term: '$searchTerm' })\n    wiredContacts({ data, error }) {\n        this.isLoading = false;\n        if (data) {\n            // Flatten the relationship field for the datatable.\n            this.contacts = data.map((c) => ({ ...c, AccountName: c.Account ? c.Account.Name : '' }));\n            this.error = undefined;\n        } else if (error) {\n            this.contacts = [];\n            this.error = error.body ? error.body.message : 'Unknown error';\n        }\n    }\n\n    handleChange(event) {\n        const value = event.target.value;\n        window.clearTimeout(this.delayTimeout);\n        // eslint-disable-next-line @lwc/lwc/no-async-operation\n        this.delayTimeout = setTimeout(() => {\n            this.isLoading = value.trim().length >= 2;\n            this.searchTerm = value; // changing the reactive param re-invokes the wire\n        }, DELAY_MS);\n    }\n\n    get hasResults() {\n        return this.contacts.length > 0;\n    }\n\n    get showEmpty() {\n        return !this.isLoading && !this.error && this.searchTerm.trim().length >= 2 && this.contacts.length === 0;\n    }\n\n    disconnectedCallback() {\n        window.clearTimeout(this.delayTimeout);\n    }\n}\n", "force-app/main/default/lwc/contactSearch/contactSearch.html": "<template>\n    <lightning-card title=\"Contact search\" icon-name=\"standard:contact\">\n        <div class=\"slds-p-horizontal_medium\">\n            <lightning-input\n                type=\"search\"\n                label=\"Search by name or email\"\n                placeholder=\"Type at least 2 characters\"\n                onchange={handleChange}\n            ><\/lightning-input>\n\n            <template lwc:if={isLoading}>\n                <lightning-spinner alternative-text=\"Searching\" size=\"small\"><\/lightning-spinner>\n            <\/template>\n\n            <template lwc:if={error}>\n                <p class=\"slds-text-color_error slds-m-top_small\" data-id=\"error\">{error}<\/p>\n            <\/template>\n\n            <template lwc:if={hasResults}>\n                <lightning-datatable\n                    class=\"slds-m-top_small\"\n                    key-field=\"Id\"\n                    data={contacts}\n                    columns={columns}\n                    hide-checkbox-column\n                ><\/lightning-datatable>\n            <\/template>\n\n            <template lwc:if={showEmpty}>\n                <p class=\"slds-m-top_small\" data-id=\"empty\">No contacts found.<\/p>\n            <\/template>\n        <\/div>\n    <\/lightning-card>\n<\/template>\n", "force-app/main/default/classes/ContactSearchController.cls": "/** Apex for the LWC scenarios (L1, L2). cacheable=true allows @wire and client caching. */\npublic with sharing class ContactSearchController {\n    @AuraEnabled(cacheable=true)\n    public static List<Contact> searchContacts(String term) {\n        if (String.isBlank(term) || term.trim().length() < 2) {\n            return new List<Contact>();\n        }\n        String pattern = '%' + term.trim().replace('%', '\\\\%').replace('_', '\\\\_') + '%';\n        return [\n            SELECT Id, Name, Email, Phone, Account.Name\n            FROM Contact\n            WHERE Name LIKE :pattern OR Email LIKE :pattern\n            WITH USER_MODE\n            ORDER BY Name\n            LIMIT 20\n        ];\n    }\n\n    @AuraEnabled(cacheable=true)\n    public static List<Opportunity> openOpportunities(Id accountId) {\n        return [\n            SELECT Id, Name, StageName, Amount, CloseDate\n            FROM Opportunity\n            WHERE AccountId = :accountId AND IsClosed = FALSE\n            WITH USER_MODE\n            ORDER BY CloseDate\n            LIMIT 50\n        ];\n    }\n}\n", "force-app/main/default/lwc/contactSearch/__tests__/contactSearch.test.js": "import { createElement } from 'lwc';\nimport ContactSearch from 'c/contactSearch';\nimport searchContacts from '@salesforce/apex/ContactSearchController.searchContacts';\n\n// sfdx-lwc-jest auto-mocks @salesforce/apex imports as wire adapters,\n// so tests can push data or errors into the component.\njest.mock(\n    '@salesforce/apex/ContactSearchController.searchContacts',\n    () => {\n        const { createApexTestWireAdapter } = require('@salesforce/sfdx-lwc-jest');\n        return { default: createApexTestWireAdapter(jest.fn()) };\n    },\n    { virtual: true }\n);\n\nconst flush = () => Promise.resolve();\n\ndescribe('c-contact-search', () => {\n    afterEach(() => {\n        while (document.body.firstChild) {\n            document.body.removeChild(document.body.firstChild);\n        }\n        jest.clearAllMocks();\n    });\n\n    it('renders contacts returned by the wire', async () => {\n        const el = createElement('c-contact-search', { is: ContactSearch });\n        document.body.appendChild(el);\n\n        searchContacts.emit([{ Id: '003000000000001', Name: 'Priya Patel', Email: 'priya@swift.example', Account: { Name: 'Swift' } }]);\n        await flush();\n\n        const table = el.shadowRoot.querySelector('lightning-datatable');\n        expect(table).not.toBeNull();\n        expect(table.data[0].AccountName).toBe('Swift');\n    });\n\n    it('shows the error message when the wire fails', async () => {\n        const el = createElement('c-contact-search', { is: ContactSearch });\n        document.body.appendChild(el);\n\n        searchContacts.error({ message: 'Insufficient access' });\n        await flush();\n\n        const error = el.shadowRoot.querySelector('[data-id=\"error\"]');\n        expect(error).not.toBeNull();\n    });\n});\n", "force-app/main/default/lwc/opportunityInlineEditor/opportunityInlineEditor.js": "/**\n * Scenario L2 \u2014 inline-edit open opportunities on an Account page.\n * Shows: @api recordId, wired Apex, datatable draft values, saving with\n * Lightning Data Service updateRecord (respects FLS/validation, no Apex DML),\n * partial-failure handling, toast messages and refreshApex.\n */\nimport { LightningElement, api, wire } from 'lwc';\nimport { updateRecord } from 'lightning/uiRecordApi';\nimport { refreshApex } from '@salesforce/apex';\nimport { ShowToastEvent } from 'lightning/platformShowToastEvent';\nimport openOpportunities from '@salesforce/apex/ContactSearchController.openOpportunities';\n\nconst COLUMNS = [\n    { label: 'Name', fieldName: 'Name' },\n    { label: 'Stage', fieldName: 'StageName', editable: true },\n    { label: 'Amount', fieldName: 'Amount', type: 'currency', editable: true },\n    { label: 'Close date', fieldName: 'CloseDate', type: 'date-local', editable: true }\n];\n\nexport default class OpportunityInlineEditor extends LightningElement {\n    @api recordId;\n    columns = COLUMNS;\n    draftValues = [];\n    wiredResult;\n    opportunities = [];\n    error;\n\n    @wire(openOpportunities, { accountId: '$recordId' })\n    wired(result) {\n        this.wiredResult = result; // keep the provisioned value for refreshApex\n        if (result.data) {\n            this.opportunities = result.data;\n            this.error = undefined;\n        } else if (result.error) {\n            this.error = result.error.body ? result.error.body.message : 'Could not load opportunities';\n        }\n    }\n\n    async handleSave(event) {\n        const drafts = event.detail.draftValues;\n        const results = await Promise.allSettled(drafts.map((d) => updateRecord({ fields: { ...d } })));\n        const failed = results.filter((r) => r.status === 'rejected');\n\n        if (failed.length === 0) {\n            this.toast('Saved', `${drafts.length} opportunity(ies) updated`, 'success');\n            this.draftValues = [];\n        } else {\n            const reason = failed[0].reason && failed[0].reason.body ? failed[0].reason.body.message : 'Unknown error';\n            this.toast('Some changes were not saved', `${failed.length} failed: ${reason}`, 'error');\n        }\n        await refreshApex(this.wiredResult);\n    }\n\n    toast(title, message, variant) {\n        this.dispatchEvent(new ShowToastEvent({ title, message, variant }));\n    }\n\n    get hasRows() {\n        return this.opportunities.length > 0;\n    }\n}\n", "force-app/main/default/lwc/opportunityInlineEditor/opportunityInlineEditor.html": "<template>\n    <lightning-card title=\"Open opportunities\" icon-name=\"standard:opportunity\">\n        <template lwc:if={error}>\n            <p class=\"slds-p-horizontal_medium slds-text-color_error\">{error}<\/p>\n        <\/template>\n        <template lwc:if={hasRows}>\n            <lightning-datatable\n                key-field=\"Id\"\n                data={opportunities}\n                columns={columns}\n                draft-values={draftValues}\n                onsave={handleSave}\n                hide-checkbox-column\n            ><\/lightning-datatable>\n        <\/template>\n        <template lwc:else>\n            <p class=\"slds-p-horizontal_medium\">No open opportunities.<\/p>\n        <\/template>\n    <\/lightning-card>\n<\/template>\n", "interview/cpq/quote-calculator-plugin.js": "/**\n * Scenario C1 \u2014 Salesforce CPQ (SBQQ) Quote Calculator Plugin (QCP).\n *\n * Requirement: for partner accounts, apply an extra 5% partner discount to\n * subscription lines AFTER price rules run, but never let the net unit price\n * fall below the line's floor price (custom field Floor_Price__c). Also roll\n * up the total subscription MRR onto the quote (Total_MRR__c).\n *\n * Where it lives: a record of SBQQ__CustomScript__c (Code field), referenced\n * in CPQ package settings (Plugins > Quote Calculator Plugin). Every field the\n * script reads or writes must be listed in the record's Quote Fields /\n * Quote Line Fields so the calculator loads it.\n *\n * Hooks run in this order during calculation:\n *   onInit -> onBeforeCalculate -> onBeforePriceRules -> (price rules)\n *   -> onAfterPriceRules -> (calculator) -> onAfterCalculate\n * Each hook must return a Promise.\n */\n\nexport function onInit(quoteLineModels) {\n    return Promise.resolve();\n}\n\nexport function onAfterPriceRules(quoteModel, quoteLineModels, conn) {\n    const isPartner = quoteModel.record['Account_Tier__c'] === 'Partner';\n    if (!isPartner) {\n        return Promise.resolve();\n    }\n    quoteLineModels.forEach((line) => {\n        const r = line.record;\n        if (r['SBQQ__SubscriptionPricing__c']) {\n            // Additional discount is a percentage field on the quote line.\n            const current = r['SBQQ__AdditionalDiscount__c'] || 0;\n            r['SBQQ__AdditionalDiscount__c'] = current + 5;\n        }\n    });\n    return Promise.resolve();\n}\n\nexport function onAfterCalculate(quoteModel, quoteLineModels, conn) {\n    let totalMrr = 0;\n    quoteLineModels.forEach((line) => {\n        const r = line.record;\n        const floor = r['Floor_Price__c'];\n        if (floor != null && r['SBQQ__NetPrice__c'] != null && r['SBQQ__NetPrice__c'] < floor) {\n            // Guardrail: flag rather than silently change price, so approvals catch it.\n            r['Below_Floor__c'] = true;\n        }\n        if (r['SBQQ__SubscriptionPricing__c'] && r['SBQQ__NetTotal__c'] != null) {\n            const termMonths = r['SBQQ__SubscriptionTerm__c'] || quoteModel.record['SBQQ__SubscriptionTerm__c'] || 12;\n            totalMrr += r['SBQQ__NetTotal__c'] / termMonths;\n        }\n    });\n    quoteModel.record['Total_MRR__c'] = Math.round(totalMrr * 100) / 100;\n    return Promise.resolve();\n}\n"};

/* =========================================================================
   CLOUD SYNC (claude.ai db capability) — private per-user documents
   data/users/<id>/progress and data/users/<id>/content; shared "updates"
   collection written each morning by the scheduled update task.
   ========================================================================= */
const SYNC = { db:null, base:null, ready:false, timer:null, busy:Promise.resolve(), status:'local' };
const CONTENT_KEYS = ['notes','snippets','vault','drafts','stars','jobs','til','mocks','mockDraft'];
let lastSent = { p:'', c:'' };
let DB_UPDATES = [];
function splitState(){ const p={}, c={}; for(const k in S){ (CONTENT_KEYS.includes(k)?c:p)[k]=S[k]; } return {p,c}; }
function applyState(obj){
  S = Object.assign(structuredClone(DEFAULT), obj||{});
  S.settings = Object.assign(structuredClone(DEFAULT.settings), (obj&&obj.settings)||{});
  S.timer = Object.assign(structuredClone(DEFAULT.timer), (obj&&obj.timer)||{});
  saveLocal();
}
function setSyncStatus(s){
  SYNC.status=s;
  const el=document.getElementById('syncState'); if(!el) return;
  el.textContent = s==='synced' ? 'Synced to your account — available on any device you sign in on.'
    : s==='error' ? 'Sync paused — changes are kept in this browser and will sync on your next change.'
    : 'Saved in this browser only (sign in to sync).';
  el.dataset.state=s;
}
function scheduleSync(){ if(!SYNC.ready) return; clearTimeout(SYNC.timer); SYNC.timer=setTimeout(syncNow, 2500); }
function syncNow(){
  if(!SYNC.ready) return Promise.resolve();
  clearTimeout(SYNC.timer);
  const {p,c}=splitState(); const pj=JSON.stringify(p), cj=JSON.stringify(c);
  if(pj.length>240000 || cj.length>240000) toast('Your notes are very large — export a backup and trim old snippets so they keep syncing');
  SYNC.busy = SYNC.busy.then(async ()=>{
    try{
      if(pj!==lastSent.p && pj.length<=240000){ await SYNC.db.doc(SYNC.base+'/progress').set({json:pj}); lastSent.p=pj; }
      if(cj!==lastSent.c && cj.length<=240000){ await SYNC.db.doc(SYNC.base+'/content').set({json:cj}); lastSent.c=cj; }
      setSyncStatus('synced');
    }catch(e){ setSyncStatus('error'); }
  });
