<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#4f46e5">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<script src="/__/firebase/10.14.1/firebase-app-compat.js"></script>
<script src="/__/firebase/10.14.1/firebase-auth-compat.js"></script>
<script src="/__/firebase/10.14.1/firebase-firestore-compat.js"></script>
<script src="/__/firebase/init.js"></script>
<script>
/* Tri-Cloud Lab — standalone website adapter.
   Provides the same small API the portal uses (claude.use('db'|'user'|'sample'|'downloads'))
   backed by Firebase Auth, Cloud Firestore and the /api/ai Cloud Function. */
(function(){
  let resolveReady; const ready = new Promise(r => resolveReady = r);
  window.claude = { use: async (name) => { const impl = await ready; return impl ? impl(name) : null; } };

  function overlay(html){ const o = document.getElementById('auth'); o.innerHTML = html; o.hidden = false; }
  function hideOverlay(){ document.getElementById('auth').hidden = true; }

  function start(){
    if (typeof firebase === 'undefined' || !firebase.apps || !firebase.apps.length) {
      overlay('<div class="auth-box"><h1>Tri-Cloud Lab</h1><p>Firebase is not configured. Deploy with <code>firebase deploy</code> so <code>/__/firebase/init.js</code> is served.</p></div>');
      resolveReady(null); return;
    }
    const auth = firebase.auth(), fs = firebase.firestore();
    auth.onAuthStateChanged(async (user) => {
      if (!user) {
        overlay(`<div class="auth-box"><span class="mark" aria-hidden="true"></span><h1>Tri-Cloud Lab</h1><p>Your private Salesforce learning and interview hub.</p><button class="btn primary big" id="signIn" type="button">Sign in with Google</button><p class="muted" id="authMsg"></p></div>`);
        document.getElementById('signIn').onclick = () => auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(e => { document.getElementById('authMsg').textContent = 'Sign-in failed: ' + (e && e.message || e); });
        return;
      }
      try {
        await fs.doc('data/users/' + user.uid + '/progress').get(); // rules allow only the owner's email
      } catch (e) {
        overlay(`<div class="auth-box"><h1>Not authorised</h1><p>${(user.email||'This account')} can't open this site.</p><button class="btn" id="signOut2" type="button">Use another account</button></div>`);
        document.getElementById('signOut2').onclick = () => auth.signOut();
        return;
      }
      hideOverlay();
      resolveReady((name) => {
        if (name === 'db') return { doc: p => fs.doc(p), collection: p => fs.collection(p) };
        if (name === 'user') return { id: async () => user.uid, isOwner: async () => true };
        if (name === 'downloads') return { save: async ({ filename, data }) => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([data], { type: 'application/octet-stream' })); a.download = filename; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000); } };
        if (name === 'sample') return makeSample(user);
        return null;
      });
    });
  }

  function makeSample(user){
    async function sample(input, opts){
      opts = opts || {};
      let res;
      try {
        const token = await user.getIdToken();
        res = await fetch('/api/ai', { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
          body: JSON.stringify({ input, modelTier: opts.modelTier || 'default' }), signal: opts.signal });
      } catch (e) { throw { code: e && e.name === 'AbortError' ? 'cancelled' : 'upstream_error', message: String(e) }; }
      if (!res.ok) {
        const msg = await res.text().catch(() => '');
        throw { code: res.status === 429 ? 'rate_limited' : res.status === 403 ? 'not_granted' : res.status === 413 ? 'prompt_too_large' : 'upstream_error', message: msg };
      }
      let text = '';
      try {
        const reader = res.body.getReader(), dec = new TextDecoder();
        for (;;) {
          const { done, value } = await reader.read(); if (done) break;
          const delta = dec.decode(value, { stream: true }); if (!delta) continue;
          text += delta; if (opts.onText) { try { opts.onText({ text, delta }); } catch (e) {} }
        }
      } catch (e) { throw { code: e && e.name === 'AbortError' ? 'cancelled' : 'upstream_error', message: String(e), text }; }
      const marker = text.lastIndexOf('\u0000ERR:');
      if (marker >= 0) { const partial = text.slice(0, marker); throw { code: 'upstream_error', message: text.slice(marker + 5), text: partial }; }
      if (!text.trim()) throw { code: 'empty_completion', message: 'Empty answer' };
      return { text, truncated: false, modelTierApplied: opts.modelTier || 'default' };
    }
    sample.json = async (input, opts) => {
      const withFormat = typeof input === 'string' ? input + '\n\nReply with only valid JSON, no other text.' : input;
      const { text } = await sample(withFormat, Object.assign({}, opts, { onText: undefined }));
      const tryParse = s => { try { return JSON.parse(s); } catch (e) { return undefined; } };
      let v = tryParse(text.trim());
      if (v === undefined) { const m = text.match(/```(?:json)?\s*([\s\S]*?)```/); if (m) v = tryParse(m[1]); }
      if (v === undefined) { const a = Math.min(...['{', '['].map(c => { const i = text.indexOf(c); return i < 0 ? Infinity : i; })); const b = Math.max(text.lastIndexOf('}'), text.lastIndexOf(']')); if (a < b) v = tryParse(text.slice(a, b + 1)); }
      if (v === undefined) throw { code: 'invalid_json', message: 'No JSON in answer', text };
      return v;
    };
    sample.limits = async () => ({ maxPromptBytes: 262144 });
    return sample;
  }

  document.addEventListener('click', e => { if (e.target && e.target.id === 'signOut' && typeof firebase !== 'undefined') firebase.auth().signOut().then(() => location.reload()); });
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
})();

</script>

<title>Tri-Cloud Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#f6f7fb; --panel:#ffffff; --panel2:#f0f2f8; --ink:#1b2033; --muted:#636a85; --line:#e2e5ef;
  --accent:#3b5bdb; --accent-ink:#ffffff;
  --dc:#0d9488; --rc:#ea580c; --af:#8b5cf6; --tri:#2563eb;
  --ok:#16a34a; --warn:#d97706; --iv:#16a34a; --scrim:rgba(15,20,35,.45); --code:#0f172a; --code-ink:#e2e8f0;
  --shadow:0 1px 2px rgba(20,25,50,.06),0 4px 16px rgba(20,25,50,.05);
  --radius:12px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1117; --panel:#161a23; --panel2:#1d2230; --ink:#e7eaf3; --muted:#9aa3bd; --line:#2a3142;
    --accent:#6d8bff; --accent-ink:#0e1117; --code:#0a0d14; --code-ink:#d6deeb; --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1117; --panel:#161a23; --panel2:#1d2230; --ink:#e7eaf3; --muted:#9aa3bd; --line:#2a3142;
  --accent:#6d8bff; --accent-ink:#0e1117; --code:#0a0d14; --code-ink:#d6deeb; --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
h1,h2,h3{text-wrap:balance}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:240px minmax(0,1fr)}
nav.side{background:var(--panel);border-right:1px solid var(--line);padding:20px 14px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow:auto}
.brand{font-weight:700;font-size:17px;margin:0 8px 4px}
.brand small{display:block;font-weight:500;color:var(--muted);font-size:12px}
nav.side button.nav{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:0;background:none;padding:9px 10px;border-radius:8px;cursor:pointer;color:var(--muted);font-weight:500}
nav.side button.nav:hover{background:var(--panel2);color:var(--ink)}
nav.side button.nav.active{background:var(--accent);color:var(--accent-ink)}
.navsep{height:1px;background:var(--line);margin:14px 6px}
.side-foot{font-size:12px;color:var(--muted);margin:14px 8px 0}
main{padding:28px clamp(16px,3vw,40px) 60px;max-width:1240px;width:100%}
h1{font-size:26px;margin:0 0 4px}
h2{font-size:19px;margin:28px 0 10px}
h3{font-size:16px;margin:20px 0 8px}
.sub{color:var(--muted);margin:0 0 22px}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
.stat .k{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.stat .v{font-size:28px;font-weight:700;margin-top:4px}
.stat .h{font-size:12.5px;color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--panel2);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:#dc2626}
.btn.sm{padding:4px 10px;font-size:13px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.timer{display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:center}
.ring{width:150px;height:150px}
.ring circle{fill:none;stroke-width:12}
.ring .bgc{stroke:var(--panel2)}
.ring .fgc{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .5s}
.clock{font-size:40px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.bar{height:10px;background:var(--panel2);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;transition:width .4s}
.modrow{margin:12px 0}
.modrow .lbl{display:flex;justify-content:space-between;font-size:14px;margin-bottom:5px;font-weight:600}
.chart{display:flex;align-items:flex-end;gap:10px;height:150px;padding-top:10px}
.chart .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.chart .col i{width:100%;max-width:42px;background:var(--accent);border-radius:6px 6px 2px 2px;min-height:2px;opacity:.85}
.chart .col span{font-size:11.5px;color:var(--muted)}
.chart .col b{font-size:11px;color:var(--muted);font-weight:600}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.tab{border:1px solid var(--line);background:var(--panel);padding:6px 14px;border-radius:99px;cursor:pointer;font-weight:600;font-size:13.5px}
.tab.active{background:var(--ink);color:var(--bg);border-color:var(--ink)}
details.week{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:10px;box-shadow:var(--shadow)}
details.week>summary{list-style:none;cursor:pointer;padding:14px 18px;display:flex;gap:12px;align-items:center}
details.week>summary::-webkit-details-marker{display:none}
.wk{font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;color:#fff;white-space:nowrap}
.wtitle{flex:1;font-weight:600}
.wprog{font-size:13px;color:var(--muted);white-space:nowrap}
.items{padding:0 18px 14px}
.item{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px dashed var(--line)}
.item input[type=checkbox]{margin-top:4px;width:17px;height:17px;accent-color:var(--accent);flex:none}
.item.done .txt{color:var(--muted);text-decoration:line-through}
.badge{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:2px 7px;border-radius:5px;background:var(--panel2);color:var(--muted);flex:none;margin-top:2px}
.badge.theory{color:#2563eb}.badge.lab{color:#0b8f8f}.badge.exam{color:#c2410c}.badge.daily{color:#7c3aed}.badge.project{color:#15803d}
.score{width:70px;padding:3px 6px;border:1px solid var(--line);border-radius:6px;background:var(--panel2)}
textarea,input[type=text],input[type=number],input[type=date],input[type=url],select{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:9px 11px}
textarea{min-height:120px;resize:vertical;font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13.5px}
textarea.big{min-height:340px}
label.f{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin:10px 0 4px}
.saved{font-size:12px;color:var(--ok)}
.snip{border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:10px;background:var(--panel)}
.snip h4{margin:0;font-size:14.5px}
.snip pre{margin:8px 0 0}
pre{background:var(--code);color:var(--code-ink);padding:14px;border-radius:10px;overflow:auto;font:12.8px/1.5 "IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;position:relative;white-space:pre}
pre .copy{position:absolute;top:8px;right:8px;background:#ffffff1f;color:#fff;border:1px solid #ffffff33;border-radius:6px;font-size:11.5px;padding:3px 8px;cursor:pointer;font-family:system-ui}
code.i{background:var(--panel2);padding:1px 6px;border-radius:5px;font-size:.9em}
.guide{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:8px 26px 26px;box-shadow:var(--shadow)}
.guide h2{border-bottom:1px solid var(--line);padding-bottom:8px}
.guide table{border-collapse:collapse;width:100%;font-size:13.5px;margin:10px 0;display:block;overflow-x:auto}
.guide th,.guide td{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top}
.guide th{background:var(--panel2)}
.step{border-left:3px solid var(--line);padding:4px 0 4px 14px;margin:14px 0}
.step.done{border-left-color:var(--ok)}
.step>label{display:flex;gap:10px;align-items:flex-start;cursor:pointer;font-weight:700}
.step>label input{margin-top:4px;width:17px;height:17px;accent-color:var(--ok);flex:none}
.step .body{margin-top:6px}
.callout{border:1px solid var(--line);border-left:4px solid var(--warn);background:var(--panel2);border-radius:8px;padding:10px 14px;margin:12px 0;font-size:14px}
.callout.info{border-left-color:var(--accent)}
.pcard{cursor:pointer;transition:border-color .2s}
.pcard:hover{border-color:var(--accent)}
.pill{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--panel2);color:var(--muted)}
.toast{position:fixed;bottom:20px;right:20px;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;opacity:0;transform:translateY(10px);transition:.25s;pointer-events:none;z-index:9}
.toast.show{opacity:1;transform:none}
.lesson h4{margin:16px 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.lesson ul,.lesson ol{margin:0;padding-left:20px}
.lesson li{margin:5px 0}
.lesson.ldone h3{color:var(--ok)}
details.qa{border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin:6px 0;background:var(--panel2)}
details.qa summary{cursor:pointer;font-weight:600}
details.qa div{margin-top:6px;color:var(--muted)}
.lrow{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:0;background:none;padding:7px 8px;border-radius:8px;cursor:pointer;font-size:13.5px;line-height:1.35}
.lrow:hover{background:var(--panel2)}
.lrow.on{background:var(--panel2);outline:2px solid var(--accent)}
.lrow .dot{width:10px;height:10px;border-radius:50%;flex:none;margin-top:5px}
@media (max-width:900px){ #lgrid{grid-template-columns:1fr!important} }
.reading{font-size:15px;line-height:1.65}
.reading p{margin:8px 0}
.reading h5{font-size:14.5px;margin:16px 0 4px}
.reading ul,.reading ol{padding-left:20px;margin:6px 0}
.iv{border:1px solid var(--line);border-left:4px solid var(--af);background:var(--panel2);border-radius:8px;padding:10px 14px;margin:14px 0 4px}
.iv b{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--af)}
.iv p{margin:4px 0 0}
.refs{font-size:13.5px}
.upd{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;padding:12px 16px;margin-bottom:10px;box-shadow:var(--shadow)}
.upd.read{border-left-color:var(--line);opacity:.8}
.ucl-dc{color:#fff!important;background:var(--dc)!important}.ucl-rc{color:#fff!important;background:var(--rc)!important}.ucl-af{color:#fff!important;background:var(--af)!important}
.ucl-dev{color:#fff!important;background:#334155!important}.ucl-topic{color:#fff!important;background:var(--ok)!important}
.nbadge{background:#dc2626;color:#fff;border-radius:99px;font-size:11px;padding:1px 7px;margin-left:auto}
.sres{cursor:pointer}.sres:hover{border-color:var(--accent)}
mark{background:#fde68a;color:#111;border-radius:3px;padding:0 2px}

[hidden]{display:none!important}
/* sync status */
#syncState{display:block;margin-top:8px;padding:6px 8px;border-radius:8px;background:var(--panel2);font-size:11.5px;line-height:1.4}
#syncState[data-state="synced"]{color:var(--ok)}
#syncState[data-state="error"]{color:var(--warn)}
/* interview */
.pill.ok{color:#fff;background:var(--ok)}
.pill.lv-easy{color:var(--ok)}.pill.lv-medium{color:var(--warn)}.pill.lv-hard{color:#dc2626}
/* modal */
.modal{position:fixed;inset:0;background:var(--scrim);display:grid;place-items:center;z-index:30;padding:16px}
.modal .box{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:20px;max-width:420px;width:100%;box-shadow:var(--shadow)}
/* tutor */
#tutorBtn{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:20;border:0;border-radius:99px;padding:12px 18px;background:var(--af);color:#fff;font-weight:700;cursor:pointer;box-shadow:0 6px 20px rgba(60,20,120,.3)}
#tutorBtn:focus-visible,.btn:focus-visible,.tab:focus-visible,button.nav:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#tutor{position:fixed;top:env(safe-area-inset-top,0px);right:0;bottom:0;width:min(440px,100%);z-index:25;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;box-shadow:-8px 0 30px rgba(15,20,35,.18)}
#tutor header{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
#tutor header h3{margin:0;font-size:16px}
#tutorCtx{font-size:12px;color:var(--muted);margin-top:2px}
#tutorLog{flex:1;overflow:auto;padding:12px 16px;display:flex;flex-direction:column;gap:10px}
.tmsg{max-width:100%;padding:10px 12px;border-radius:10px;font-size:14px;line-height:1.55;overflow-wrap:anywhere}
.tmsg.user{background:var(--panel2);align-self:flex-end;max-width:90%}
.tmsg.assistant{border:1px solid var(--line)}
.tmsg pre{margin:8px 0;white-space:pre-wrap}
#tutor footer{padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:grid;gap:8px}
#tutor footer textarea{min-height:70px;font-family:inherit;font-size:14px}
.tchips{display:flex;gap:6px;flex-wrap:wrap}
.tchips .btn{font-size:12px;padding:4px 9px;font-weight:600}
body.tutor-open #tutorBtn{display:none}
@media (min-width:1200px){ body.tutor-open main{padding-right:470px} }
@media (prefers-reduced-motion:reduce){ *{transition:none!important;animation:none!important} }
.hidden{display:none!important}
.muted{color:var(--muted)}
.mobile-nav{display:none}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  nav.side{display:none}
  .mobile-nav{display:block;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:1px solid var(--line);padding:10px 16px}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g3,.g2{grid-template-columns:1fr}
  .timer{grid-template-columns:1fr;justify-items:center;text-align:center}
  .guide{padding:4px 16px 20px}
}

/* ================= colour, interaction & responsive layer ================= */
@property --p { syntax:'<number>'; inherits:true; initial-value:0; }
:root{ --vc:#4f46e5; --tint:color-mix(in srgb, var(--vc) 9%, var(--panel)); }
body{background:
  radial-gradient(900px 420px at 105% -8%, color-mix(in srgb, var(--vc) 16%, transparent), transparent 65%),
  radial-gradient(700px 380px at -10% 110%, color-mix(in srgb, var(--vc) 10%, transparent), transparent 60%),
  var(--bg); background-attachment:fixed; transition:background-color .3s}
main{padding-block:28px 60px; padding-inline:clamp(16px,3vw,40px)}
main > h1{font-size:28px;letter-spacing:-.01em}
main > h1::after{content:"";display:block;width:56px;height:5px;border-radius:9px;margin-top:10px;background:linear-gradient(90deg,var(--vc),color-mix(in srgb,var(--vc) 40%,#f59e0b))}
/* brand */
.brand{display:flex;gap:10px;align-items:center}
.mark{width:34px;height:34px;flex:none;border-radius:10px;background:conic-gradient(from 210deg,var(--dc),var(--tri),var(--af),var(--rc),var(--dc));box-shadow:inset 0 0 0 3px color-mix(in srgb,#fff 35%,transparent)}
.btext{display:block}
/* side nav */
nav.side button.nav{gap:10px;padding:7px 10px;margin:2px 0;color:var(--ink);transition:background .15s,transform .15s}
nav.side button.nav .ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);transition:background .15s,color .15s}
nav.side button.nav:hover{background:color-mix(in srgb,var(--c) 8%,transparent);transform:translateX(2px)}
nav.side button.nav.active{background:color-mix(in srgb,var(--c) 14%,var(--panel));color:var(--ink);box-shadow:inset 3px 0 0 var(--c)}
nav.side button.nav.active .ic{background:var(--c);color:#fff}
.nbadge{margin-left:auto}
/* buttons & tabs follow the section colour */
.btn{transition:transform .12s,box-shadow .15s,border-color .15s,background .15s}
.btn:hover{border-color:var(--vc);transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn.primary{background:var(--vc);border-color:var(--vc);color:#fff;box-shadow:0 4px 14px color-mix(in srgb,var(--vc) 30%,transparent)}
.tab{transition:background .15s,color .15s,border-color .15s}
.tab:hover{border-color:var(--vc);color:var(--vc)}
.tab.active{background:var(--vc);border-color:var(--vc);color:#fff}
/* cards */
.card{transition:transform .18s,box-shadow .18s,border-color .18s}
.pcard:hover,.sres:hover{transform:translateY(-3px);border-color:var(--vc);box-shadow:0 12px 28px color-mix(in srgb,var(--vc) 18%,transparent)}
.tile{--c:var(--vc);background:linear-gradient(140deg,color-mix(in srgb,var(--c) 18%,var(--panel)),var(--panel) 72%);border-color:color-mix(in srgb,var(--c) 30%,var(--line))}
.tile .v{color:var(--c)}
.tile:hover{transform:translateY(-2px)}
/* progress rings */
.rings{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:10px}
.ring-tile{display:flex;gap:12px;align-items:center;padding:10px;border-radius:12px;background:color-mix(in srgb,var(--c) 7%,var(--panel));border:1px solid color-mix(in srgb,var(--c) 22%,var(--line))}
.mring{width:62px;height:62px;flex:none;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--c) calc(var(--p)*1%), color-mix(in srgb,var(--c) 14%,var(--panel2)) 0);transition:--p .9s ease}
.mring span{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--panel);font-weight:700;font-size:13px;font-variant-numeric:tabular-nums}
/* bars & chart */
.bar>i{background-image:linear-gradient(90deg,transparent,color-mix(in srgb,#fff 30%,transparent))}
.chart .col i{background:linear-gradient(180deg,var(--vc),color-mix(in srgb,var(--vc) 45%,var(--panel)));opacity:1;transition:height .5s}
.chart .col:last-child i{box-shadow:0 0 0 3px color-mix(in srgb,var(--vc) 25%,transparent)}
.chart .col:last-child span{color:var(--vc);font-weight:700}
.timer .fgc{stroke:var(--vc)}
/* checklists */
.item{border-radius:8px;padding-inline:6px;transition:background .15s}
.item:hover{background:color-mix(in srgb,var(--vc) 6%,transparent)}
.item input[type=checkbox],.step>label input{accent-color:var(--vc)}
details.week>summary:hover{background:color-mix(in srgb,var(--vc) 5%,transparent);border-radius:var(--radius)}
/* lessons */
.lesson h4{color:var(--lc,var(--vc))}
.reading,.lesson > ul,.lesson > ol,.guide > p{max-width:76ch}
.lesson .reading h5{color:var(--lc,var(--vc))}
.lrow.on{outline-color:var(--vc);background:color-mix(in srgb,var(--vc) 9%,var(--panel))}
.iv{border-left-color:var(--lc,var(--vc))}
.iv b{color:var(--lc,var(--vc))}
details.qa{transition:background .15s}
details.qa[open]{background:color-mix(in srgb,var(--lc,var(--vc)) 7%,var(--panel))}
/* updates */
.upd.u-dc{border-left-color:var(--dc)}.upd.u-rc{border-left-color:var(--rc)}.upd.u-af{border-left-color:var(--af)}
.upd.u-dev{border-left-color:#475569}.upd.u-platform{border-left-color:var(--tri)}.upd.u-topic{border-left-color:var(--ok);background:color-mix(in srgb,var(--ok) 6%,var(--panel))}
.upd{transition:transform .15s}
.upd:hover{transform:translateX(3px)}
/* celebration */
.spark{position:fixed;width:7px;height:7px;border-radius:2px;pointer-events:none;z-index:40;animation:spark .85s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes spark{from{transform:translate(-50%,-50%) scale(1);opacity:1}to{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) rotate(200deg) scale(.4);opacity:0}}
/* tutor button picks up the section colour */
#tutorBtn{background:linear-gradient(135deg,var(--af),var(--vc));animation:pulse 2.8s ease-in-out 1.5s 2}
@keyframes pulse{50%{box-shadow:0 0 0 10px color-mix(in srgb,var(--af) 18%,transparent)}}
/* tab bar + sheet (mobile) */
.tabbar{display:none}
.sheet{position:fixed;inset:0;z-index:35;background:var(--scrim);display:flex;align-items:flex-end}
.sheet-box{width:100%;background:var(--panel);border-radius:18px 18px 0 0;padding:14px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:80vh;overflow:auto}
.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.sheet-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.sheet-list .nav{display:flex;gap:10px;align-items:center;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px;cursor:pointer;color:var(--ink);font-weight:600;font-size:13.5px;text-align:left}
.sheet-list .nav .ic{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);flex:none}
.sheet-list .nav.active{border-color:var(--c)}
.mtop{display:flex;gap:10px;align-items:center}
.mtop .mark{width:26px;height:26px;border-radius:8px}
#mview{margin-left:auto;font-size:13px;font-weight:600;color:var(--vc)}
/* responsive grids */
.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
main .card,main .guide,main .upd,main pre{min-width:0}
.grid.g2 > .grid.g2{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.toast{right:auto;left:50%;transform:translate(-50%,10px)}
.toast.show{transform:translate(-50%,0)}
/* tablet: icon rail */
@media (min-width:901px) and (max-width:1180px){
  .app{grid-template-columns:78px minmax(0,1fr)}
  nav.side{padding:16px 10px}
  nav.side .btext,nav.side .lbl,nav.side .side-foot,nav.side .navsep,nav.side .ngroup{display:none}
  nav.side button.nav{justify-content:center;padding:6px}
  nav.side button.nav .nbadge{position:absolute;transform:translate(14px,-12px)}
  nav.side button.nav{position:relative}
  .brand{justify-content:center;margin:0 0 12px}
}
/* phone */
@media (max-width:900px){
  .mobile-nav{padding:10px 16px}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:22;background:color-mix(in srgb,var(--panel) 92%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
  .tb{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;color:var(--muted);font-size:11px;font-weight:600;padding:4px 0;cursor:pointer}
  .tb .ic{position:relative;width:38px;height:28px;border-radius:99px;display:grid;place-items:center;transition:background .15s}
  .tb.active{color:var(--c)}
  .tb.active .ic{background:color-mix(in srgb,var(--c) 16%,transparent)}
  .tb .dot{position:absolute;top:3px;right:8px;width:8px;height:8px;border-radius:50%;background:#dc2626}
  main{padding-block:18px 110px}
  main > h1{font-size:23px}
  #tutorBtn{bottom:calc(78px + env(safe-area-inset-bottom,0px));right:14px;padding:10px 14px}
  #tutor{width:100%}
  .rings{grid-template-columns:repeat(2,minmax(0,1fr))}
  .mring{width:54px;height:54px}.mring span{width:40px;height:40px;font-size:12px}
  #lgrid > .card:first-child{max-height:none!important;display:flex;overflow-x:auto;gap:6px;padding:8px!important;scroll-snap-type:x mandatory}
  #lgrid > .card:first-child > div{display:none}
  #lgrid .lrow{min-width:210px;scroll-snap-align:start;border:1px solid var(--line)}
  .toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  .chart{gap:6px}
}
@media (max-width:420px){ .sheet-list{grid-template-columns:1fr} .stat .v{font-size:24px} .tile{padding:14px} }
@media (prefers-reduced-motion:reduce){ .mring{transition:none} #tutorBtn{animation:none} }

/* ================= features ================= */
.ngroup{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:14px 10px 4px}
kbd{font:600 11px "IBM Plex Mono",monospace;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;margin-left:6px;background:var(--panel2);color:var(--muted)}
.hello{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.hello h1{margin:0}
.mini-timer{display:flex;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 14px;box-shadow:var(--shadow)}
.mini-timer .clock{font-size:26px}
.today-grid{align-items:start;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:16px}
.today-grid .span2{grid-column:span 2}
@media (max-width:700px){ .today-grid .span2{grid-column:auto} }
.tick{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);flex:none;margin-top:2px;display:grid;place-items:center}
.tick.on{background:var(--ok);border-color:var(--ok)}
.tick.on::after{content:"";width:6px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.drillq{font-size:17px;font-weight:600;line-height:1.45;margin:10px 0;text-wrap:pretty}
.cd{display:flex;gap:12px;align-items:center;padding:8px 0}
.cd>b{font-size:30px;color:var(--vc);min-width:52px;text-align:center;font-variant-numeric:tabular-nums}
.wk-sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
.wk-sum>div{background:color-mix(in srgb,var(--vc) 7%,var(--panel2));border-radius:10px;padding:10px}
.wk-sum b{display:block;font-size:22px}.wk-sum span{font-size:12.5px;color:var(--muted)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.badge-i{border:1px dashed var(--line);border-radius:12px;padding:10px;text-align:center;opacity:.55;filter:grayscale(1)}
.badge-i span{font-size:26px;display:block}.badge-i b{display:block;font-size:13px;margin-top:4px}.badge-i small{color:var(--muted);font-size:11.5px}
.badge-i.on{opacity:1;filter:none;border-style:solid;border-color:color-mix(in srgb,#f59e0b 50%,var(--line));background:color-mix(in srgb,#f59e0b 9%,var(--panel))}
textarea.plain{font-family:inherit;font-size:14.5px}
.today-grid .item .btn{margin-left:auto}
.kanban{min-width:0}
@media (max-width:900px){ .app{grid-template-columns:minmax(0,1fr)} }
/* weak spots */
.weak{display:grid;gap:8px}
.wrow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:4px 10px;align-items:center;font-size:13.5px}
.wrow .wl{grid-column:1/-1;font-weight:600}
.wl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wbar{height:8px;border-radius:99px;background:color-mix(in srgb,var(--c) 14%,var(--panel2));overflow:hidden}
.wbar i{display:block;height:100%;background:var(--c);border-radius:99px}
.wv{font-variant-numeric:tabular-nums;min-width:26px;text-align:right}
/* flashcards */
.fcard{background:var(--panel);border:1px solid color-mix(in srgb,var(--c) 35%,var(--line));border-top:6px solid var(--c);border-radius:18px;padding:22px clamp(16px,4vw,34px);box-shadow:0 14px 34px color-mix(in srgb,var(--c) 14%,transparent);max-width:760px;margin:0 auto;animation:pop .25s ease}
@keyframes pop{from{transform:translateY(8px) scale(.99);opacity:.4}}
.fq{font-size:clamp(18px,2.4vw,23px);font-weight:600;line-height:1.4;margin:18px 0;text-wrap:balance}
.fa{font-size:16px;line-height:1.6;padding:14px 16px;border-radius:12px;background:color-mix(in srgb,var(--c) 8%,var(--panel2));margin-bottom:16px}
.btn.big{padding:12px 22px;font-size:15px}
.rate{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.rate .btn{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 6px}
.rate small{color:var(--muted);font-weight:500}
.rate .r0{border-color:#dc2626;color:#dc2626}.rate .r1{border-color:var(--warn);color:var(--warn)}.rate .r2{border-color:var(--ok);color:var(--ok)}.rate .r3{border-color:#0ea5e9;color:#0ea5e9}
.empty{text-align:center;padding:32px 20px}
/* mock */
.msteps{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}
.mstep{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);background:var(--panel);font-weight:700;cursor:pointer;color:var(--ink)}
.mstep.ans{border-color:var(--vc);color:var(--vc)}
.mstep.on{background:var(--vc);border-color:var(--vc);color:#fff}
.mclock{font-size:24px;color:var(--vc)}.mclock.late{color:#dc2626}
.mres summary{display:flex;gap:10px;align-items:center}
.bar>i.indet{width:40%;background:var(--vc);animation:indet 1.2s ease-in-out infinite}
@keyframes indet{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
/* career */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:12.5px;border:1px solid var(--line);border-radius:99px;padding:4px 10px;background:var(--panel);display:inline-flex;gap:6px;align-items:center;cursor:default}
label.chip{cursor:pointer}
.chip.on{background:color-mix(in srgb,#0284c7 12%,var(--panel));border-color:color-mix(in srgb,#0284c7 40%,var(--line));color:var(--ink)}
.kanban{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(200px,1fr);gap:10px;overflow-x:auto;padding-bottom:8px}
.kcol{background:var(--panel2);border-radius:12px;padding:8px;min-height:160px;transition:background .15s}
.kcol.over{background:color-mix(in srgb,var(--vc) 14%,var(--panel2))}
.khead{display:flex;justify-content:space-between;align-items:center;padding:4px 4px 8px}
.kcard{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--vc);border-radius:10px;padding:8px 10px;margin-bottom:8px;cursor:grab;display:grid;gap:2px;font-size:13.5px;transition:transform .12s}
.kcard:hover{transform:translateY(-2px)}.kcard.drag{opacity:.5}
.kcard small{color:var(--muted)}
.kcol[data-stage="Offer"] .kcard{border-left-color:var(--ok)}.kcol[data-stage="Rejected"] .kcard{border-left-color:#94a3b8}
.cert{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px dashed var(--line)}
.match h4{margin:14px 0 6px;color:var(--vc)}
/* glossary */
.gloss{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:10px}
.gterm{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:10px;padding:10px 12px;display:grid;gap:4px;font-size:14px}
.gterm b{color:var(--c)}
/* playground */
.pg{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:1100px){ .pg{grid-template-columns:1fr} }
.editor{display:grid;grid-template-columns:auto minmax(0,1fr);border-radius:10px;overflow:hidden;background:var(--code);height:420px}
.editor .gutter{margin:0;padding:12px 8px;text-align:right;color:#64748b;background:color-mix(in srgb,var(--code) 80%,#000);overflow:hidden;border-radius:0;user-select:none;font:12.8px/1.5 "IBM Plex Mono",monospace}
.editor textarea{border:0;border-radius:0;background:transparent;color:var(--code-ink);font:12.8px/1.5 "IBM Plex Mono",monospace;padding:12px;height:100%;resize:none;white-space:pre;overflow:auto;tab-size:4;min-height:0}
.editor textarea:focus{outline:2px solid var(--vc);outline-offset:-2px}
.pgout{max-height:560px;overflow:auto}
.pgout pre{white-space:pre-wrap}
/* focus mode */
.focus{position:fixed;inset:0;z-index:45;display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,color-mix(in srgb,var(--vc) 30%,var(--bg)),var(--bg) 70%);padding:16px}
.focus[data-phase="break"]{background:radial-gradient(circle at 50% 40%,color-mix(in srgb,var(--ok) 30%,var(--bg)),var(--bg) 70%)}
.focus-box{text-align:center}
.fphase{font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--vc)}
.focus[data-phase="break"] .fphase{color:var(--ok)}
.fclock{font:600 clamp(64px,16vw,140px)/1 "IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;margin:10px 0}
</style>

<script>
/* =========================================================================

 "They only work on data arriving via streaming sources (Ingestion API streaming, Web/Mobile SDK).",
 "Their main purpose is triggering data actions, not reporting."],
 {c:"c-dc",s:"Streaming insights / real-time section",yt:"Salesforce Data Cloud streaming insights data actions",th:"Data Cloud streaming insights"},
 ["Project 1 step p1-10: create Nimbus_Error_Spike.","Send a burst and watch for output rows after the window closes."],
 [["Why can't the file-uploaded usage feed a streaming insight?","File ingestion is batch; streaming insights need streaming sources."]]),
L("dc","Segments and activation",[
 "Segments filter unified profiles (and related data) into audiences; they publish on a schedule.",
 "Activation targets define where audiences go (Marketing Cloud, cloud storage, ad platforms); activations choose attributes and contact points to send.",
 "Use insights as segment filters to keep segment logic simple."],
 {c:"c-dc",s:"Segmentation and activation sections",yt:"Salesforce Data Cloud segmentation activation tutorial",th:"Data Cloud segmentation"},
 ["Build segment 'At-risk fleets': errors_30d > 5 from your insight.","Publish it and check membership count.","Explore activation target types (don't activate externally)."],
 [["Segment vs data action — which for a real-time alert?","Data action; segments are batch audiences."]]),
L("dc","Data actions, platform events and Flow",[
 "Data actions fire on streaming insight results or DMO changes that meet a rule, and send to a data action target (Salesforce platform event, webhook, Marketing Cloud).",
 "Salesforce platform event targets publish DataObjectDataChgEvent; a platform event–triggered Flow subscribes and reads the JSON in PayloadCurrentValue.",
 "Invocable Apex parses the payload and can query Data 360 through ConnectApi."],
 {c:"c-dc",s:"Data actions section",yt:"Salesforce Data Cloud data action platform event flow",th:"Data Cloud data actions"},
 ["Project 1 steps p1-11, p1-12 and p1-13.","Capture one real payload and confirm the key names."],
 [["Who does a platform-event Flow run as by default, and why does it matter?","The Automated Process user — it may lack permissions for your Apex/queries, so set a running user if needed."]],180),
L("dc","Enrichment and data graphs",[
 "Copy Field enrichment writes Data 360 values (such as insight measures) onto CRM records; Related List enrichment shows Data 360 records on CRM pages.",
 "Data graphs pre-join a profile with related DMOs into a fast JSON shape — used for real-time personalisation and grounding agents (Projects 3–4).",
 "Rule of thumb: copy only a few fields to CRM; keep the bulk in Data 360."],
 {c:"c-dc",s:"Enrichment / data graph sections",yt:"Salesforce Data Cloud copy field enrichment data graph",th:"Data Cloud enrichment"},
 ["Project 1 step p1-14: Copy Field enrichment to Contact.","Create a small data graph: Unified Individual → contact points → usage insight."],
 [["Why not copy every usage event onto Contact?","Data volume and storage; CRM needs the summary, not the raw events."]]),
L("dc","Project 1 verification day",[
 "Testing is a skill employers look for: each test has a precondition, action and expected result."],
 {c:"c-dc",s:"Any remaining sections",yt:"Salesforce Data Cloud end to end demo",th:"Data Cloud"},
 ["Run tests T1–T9 in Project 1 and tick each one.","Screenshot evidence (consolidation rate, profile, task created).","Fill the Project 1 card in Resume & Vault with your real numbers."],
 [["What was your measured end-to-end alert latency?","Record it — it goes in your resume bullet."]],270),

 "A full-length practice test under time pressure shows exam readiness better than topic quizzes."],
 {c:"c-dc2",s:"Final revision + practice questions",yt:"Salesforce Data Cloud consultant practice exam",th:"Data Cloud consultant certification"},
 ["Take a full-length timed practice test; record the score in Week 3.","Write the Project 1 architecture summary in your own words in the Vault."],

/* ---------- WEEK 4 · Revenue Cloud catalog ---------- */
L("rc","Revenue Cloud landscape",[
 "Modern Revenue Cloud (RLM / Revenue Cloud Advanced, now called Revenue Management in the newest docs) runs natively on the core platform — unlike legacy Salesforce CPQ, a managed package.",
 "Components: Product Catalog Management, Salesforce Pricing, Product Configurator, Transaction Management (quotes and orders), asset lifecycle, Billing, Dynamic Revenue Orchestrator (fulfilment) and Usage Management.",
 "Everything is API-first: the same services back the UI and the Connect APIs."],
 {c:"c-rc2",s:"Whole course (architecture primer)",yt:"Salesforce Revenue Cloud Advanced overview",th:"Revenue Lifecycle Management foundations"},
 ["Sign up for the Revenue Cloud Developer Edition (linked from Trailhead's Revenue Cloud modules).","App Launcher → Revenue Lifecycle Management; tour the tabs.","Setup → Revenue Settings: list what is enabled."],
 [["Name two differences between legacy CPQ and RLM.","RLM is native on core objects (no managed package) and uses pricing procedures/context definitions instead of the CPQ price rule engine."]]),
L("rc","The product data model",[
 "Product2 is still the product, but selling terms live in Product Selling Models (PSMs), linked via Product Selling Model Options.",
 "Price Book Entries are per product per selling model.",
 "Bundles use Product Component Groups and Product Related Components; classifications and attribute definitions describe configurable characteristics."],
 {c:"c-rc",s:"Product Catalog Management section",yt:"Salesforce Revenue Cloud product catalog management data model",th:"Revenue Cloud product catalog"},
 ["Open a sample bundle product in the DE org and trace its components.","Use Schema Builder (or Object Manager) to sketch Product2 → PSM Option → PSM and Product2 → Price Book Entry."],
 [["Why does a price book entry need a selling model?","The same product can be sold one-time, termed or evergreen at different prices."]]),
L("rc","Product selling models and proration",[
 "One Time: sold once. Term Defined: fixed term (for example 12 months) with a pricing term unit. Evergreen: renews until cancelled.",
 "Pricing term and unit define what the list price means (per month, per year).",
 "Proration policies decide how partial periods are charged on amendments."],
 {c:"c-rc",s:"Selling models",yt:"Salesforce Revenue Cloud product selling model term defined evergreen",th:"Revenue Cloud product selling models"},
 ["Project 2 step p2-2: create One Time, Annual Term and Monthly Evergreen; create a proration policy."],
 [["A customer adds 20 licences 6 months into a 12-month term at £18/month: list-price charge?","20 × £18 × 6 = £2,160 before discounts (monthly proration)."]]),
L("rc","Attributes and product classifications",[
 "Attribute picklists → attribute definitions → attribute categories → product classifications. Products based on a classification inherit its attributes.",
 "Attributes drive configuration rules and attribute-based pricing (for example 5G costs more)."],
 {c:"c-rc",s:"Attributes / classifications",yt:"Salesforce Revenue Cloud attributes product classification",th:"Revenue Cloud product attributes"},
 ["Project 2 step p2-3: Connectivity and Mount Type attributes, Telematics Device classification."],
 [["Why use a classification rather than adding attributes to each product?","Reuse and consistency across many similar products."]]),
L("rc","Catalogs, categories and qualification",[
 "Catalogs and categories organise what reps can browse; a product can sit in several categories.",
 "Qualification rules can hide or show products based on context (for example region or customer type)."],
 {c:"c-rc",s:"Catalog and category setup",yt:"Salesforce Revenue Cloud catalog categories",th:"Revenue Cloud catalog"},
 ["Create the Nimbus UK catalog with Hardware, Subscriptions, Add-ons, Services and Bundles categories.","Note where qualification rules are configured in your org."],
 [["Catalog vs price book?","Catalog = what can be browsed and how it's organised; price book = what it costs."]]),
L("rc","Lab day: products, price book entries and the bundle",[
 "The most common catalog bug is a missing price book entry for one product/selling-model pair — the product silently won't appear."],
 {c:"c-rc",s:"Bundles / product structure demo",yt:"Salesforce Revenue Cloud create bundle product component group",th:"Revenue Cloud bundles"},
 ["Project 2 steps p2-4 and p2-5.","Browse the catalog from a test quote to confirm every product appears with the right selling models."],
 [["A product shows in the catalog but not with Monthly Evergreen. Why?","There's no price book entry for that product with the Monthly Evergreen selling model (or the PSM option is missing)."]],270),
L("rc","Week 4 review and exam",[
 "Draw the catalog data model from memory, then compare to your notes."],
 {c:"c-rc",s:"Revision",yt:"Salesforce Revenue Cloud consultant exam catalog",th:"Revenue Cloud consultant"},
 ["Closed-book exam: catalog data model and selling models; record score in Week 4."],
 [["List the five objects you touch to make a sellable configurable product.","Product2, Product Classification/Attribute Definitions, Product Selling Model (+ Option), Price Book Entry, Catalog/Category."]],270),

/* ---------- WEEK 5 · Pricing & configuration ---------- */
L("rc","Salesforce Pricing architecture",[
 "A context definition describes the data a pricing run can see (header, lines, attributes) and maps it to records such as Quote and Quote Line Item.",
 "A pricing procedure is an expression set of pricing elements (list price, adjustments, discounts, rollups) executed in order.",
 "Decision tables are fast lookups used by elements; the price waterfall shows each step's effect on a line."],
 {c:"c-rc",s:"Price management section",yt:"Salesforce Revenue Cloud pricing procedure context definition",th:"Price management with Revenue Cloud"},
 ["Open the default pricing procedure; list its elements in order.","Run Simulate with sample input and read the output."],
 [["Why clone instead of editing the default procedure?","Upgrades and other features expect the shipped default; your copy is safe to change."]]),
L("rc","Price adjustment schedules and attribute pricing",[
 "Volume schedules price all units at the tier reached; tiered (slab) schedules price each band separately — know the difference for exams.",
 "Attribute-based adjustments change price by attribute value (5G +£30)."],
 {c:"c-rc",s:"Discounts / adjustments",yt:"Salesforce Revenue Cloud price adjustment schedule volume tiered",th:"Revenue Cloud price adjustment"},
 ["Project 2 step p2-7: volume tiers, 5G uplift, partner decision table."],
 [["60 units at £18, tiers 1–49 0% and 50+ 8%: volume vs tiered total?","Volume: 60 × 18 × 0.92 = £993.60. Tiered: 49 × 18 + 11 × 18 × 0.92 = £882 + £182.16 = £1,064.16."]]),
L("rc","Context definitions in depth",[
 "Context definitions have nodes (such as SalesTransaction and SalesTransactionItem), attributes on nodes, and mappings to objects and fields.",
 "Extending the standard definition adds your custom fields without breaking the standard one; it must be activated and set as default."],
 {c:"c-rc",s:"Context definitions",yt:"Salesforce Revenue Cloud context definition extend custom field",th:"Revenue Cloud context definitions"},
 ["Project 2 step p2-6: Customer_Tier__c on Account and Quote, extended context, mapping."],
 [["Your decision table never applies the partner discount. First check?","Whether CustomerTier is mapped and populated in the context (simulate the procedure)."]]),
L("rc","Build the pricing procedure",[
 "Element order is business logic: an uplift before a percentage discount changes the result.",
 "After changing price data or decision tables, run Sync Pricing Data or the engine uses stale caches."],
 {c:"c-rc",s:"Pricing procedure build demo",yt:"Salesforce Revenue Cloud build pricing procedure sync pricing data",th:"Revenue Cloud pricing procedure"},
 ["Project 2 step p2-8.","Simulate with 60 vehicles, Standard tier, then Partner tier; compare with the oracle table."],
 [["Prices didn't change after editing a tier. Why?","Pricing data wasn't synced, or the procedure wasn't re-activated / set as default."]]),
L("rc","Product Configurator and rules",[
 "The configurator validates and auto-adjusts bundles using rules, increasingly expressed in Constraint Modeling Language (CML) or a visual constraint builder.",
 "Rule types to know: require, exclude, validate and auto-set attribute values."],
 {c:"c-rc",s:"Product Configurator section",yt:"Salesforce Revenue Cloud product configurator CML constraint",th:"Revenue Cloud product configurator"},
 ["Project 2 step p2-9: Driver Safety AI requires 5G."],
 [["Validation vs auto-set — which is the better user experience?","Auto-set, when the right value is unambiguous; validation when the user must choose."]]),
L("rc","Lab day: pricing test oracle",[
 "Testing pricing means comparing to hand calculations, including tier boundaries (49, 50, 199, 200)."],
 {c:"c-rc",s:"Any remaining pricing content",yt:"Salesforce Revenue Cloud price waterfall",th:"Revenue Cloud pricing"},
 ["Run Project 2 tests T1–T5.","Record mismatches and fixes in Notes."],
 [["Why test 49 and 50, not just 60?","Boundary values catch off-by-one tier definitions."]],270),
L("rc","Week 5 exam: pricing drills",[
 "Do 10 price calculations by hand, then check them in the org."],
 {c:"c-rc",s:"Revision",yt:"Revenue Cloud pricing exam questions",th:"Revenue Cloud pricing"},
 ["Hand-calculate 10 quotes (mix of tiers, tier, 5G); verify each in the org; record score."],
 [["Partner tier on the 60-vehicle kit — expected total?","£21,302.04 (per the Project 2 oracle)."]],270),

/* ---------- WEEK 6 · Quote-to-cash ---------- */
L("rc","Transaction Management: quotes",[
 "Quotes are built from the catalog (Browse Catalogs), configured, then priced by the default pricing procedure.",
 "The same can be done headlessly with the Place Sales Transaction API — useful for agents in Project 4.",
 "Also exists: ramp deals (different quantities or prices across segments of a term) and line grouping."],
 {c:"c-rc",s:"Transaction Management section",yt:"Salesforce Revenue Cloud quote browse catalog transaction management",th:"Efficient sales with Revenue Cloud"},
 ["Create a quote for Thames Couriers with the Starter Kit; configure and price it.","Read the Place Sales Transaction API page in the Revenue Cloud developer guide for your API version."],
 [["Why would an agent call an API rather than click Browse Catalogs?","Agents act through actions (Flow/Apex/API), not the UI."]]),
L("rc","Discount approvals with Flow",[
 "Modern approvals use Flow approval orchestration: stages, approvers, and outcomes that update records.",
 "Gate downstream steps (Create Order) with validation so unapproved quotes can't progress."],
 {c:"c-rc",s:"Approvals (if covered)",yt:"Salesforce flow approval orchestration tutorial",th:"Flow approval processes"},
 ["Project 2 step p2-10."],
 [["Where does the audit trail of approvals live?","In the approval work items and history on the record."]]),
L("rc","Orders and assets",[
 "Quote → Create Order copies lines to an order; activating the order (directly or via fulfilment) creates assets.",
 "Assets represent what the customer owns; Asset State Periods record quantity and amount over time."],
 {c:"c-rc",s:"Orders and assets",yt:"Salesforce Revenue Cloud order to asset",th:"Revenue Cloud assets"},
 ["Project 2 step p2-11; inspect Asset State Periods."],
 [["Why model assets with state periods instead of one quantity field?","To keep history: what the customer had, when — needed for amendments, renewals and revenue."]]),
L("rc","Amend, renew and cancel",[
 "Asset-based actions create new transactions: amend (change quantity mid-term, co-termed), renew (next term) and cancel (negative lines).",
 "Co-terming aligns end dates; proration policy determines partial-period charges."],
 {c:"c-rc",s:"Asset lifecycle / amendments",yt:"Salesforce Revenue Cloud amend renew cancel asset",th:"Revenue Cloud asset lifecycle"},
 ["Project 2 step p2-12: amend +20 at month 7, renew, cancel a test asset."],
 [["Expected amendment charge in the guide's scenario?","£1,987.20 (20 × £18 × 6 × 0.92, Standard tier)."]]),
L("rc","Billing, DRO and Usage Management (overview)",[
 "Billing turns orders into billing schedules and invoices.",
 "Dynamic Revenue Orchestrator decomposes orders into fulfilment steps.",
 "Usage Management handles metered consumption (usage resources, rates, entitlements) — the foundation of the Project 4 capstone. Know the concepts even if your DE org has limited features."],
 {c:"c-rc",s:"DRO and usage-based billing sections",yt:"Salesforce Revenue Cloud usage based billing dynamic revenue orchestrator",th:"Revenue Cloud usage management"},
 ["Explore whichever of Billing, DRO and Usage Management are visible in your org; note object names.","Write one paragraph on how usage data could flow from Data 360 into Revenue Cloud."],
 [["Which component would you use to bill overages?","Usage Management together with Billing."]]),
L("rc","Project 2 verification and Git evidence",[
 "Retrieving metadata into Git turns clicks into reviewable portfolio evidence."],
 {c:"c-rc",s:"Any remaining sections",yt:"Salesforce Revenue Cloud end to end demo quote to cash",th:"Revenue Cloud"},
 ["Run Project 2 tests T6–T9.","sf project retrieve start for your custom fields, flows and pricing-related metadata; push to a private repo.","Update the Vault card for Project 2."],
 [["Which test proves co-terming worked?","T8 — the amended asset state period ends on the original end date."]],270),
L("rc","Revenue Cloud mock exam and write-up",[
 "Check Trailhead Academy for the current Revenue Cloud certification name before booking."],
 {c:"c-rc",s:"Revision",yt:"Salesforce Revenue Cloud consultant practice questions",th:"Revenue Cloud consultant"},
 ["Timed practice test; record the score in Week 6.","Write the Project 2 architecture summary in the Vault."],

/* ---------- WEEK 7 · Agentforce foundations ---------- */
L("af","What an Agentforce agent is",[
 "An agent = subagents (called topics in the legacy builder) + instructions (how to behave) + actions (what it can do), orchestrated by a reasoning engine that classifies the request, picks a subagent, plans and calls actions.",
 "Agent types include service agents (customer-facing) and employee agents (internal), all under the Agentforce 360 umbrella.",
 "Agents act through a dedicated agent user — its permissions bound what the agent can see and do."],
 {c:"c-af",s:"Agentforce concepts section",yt:"Salesforce Agentforce explained topics actions instructions",th:"Agentforce basics"},
 ["In your Agentforce DE org: Setup → Einstein / Agentforce setup; enable features.","Open Agents (Agentforce Studio) and inspect a template agent's topics and actions."],
 [["Topic vs action?","A topic groups a job and its instructions; actions are the concrete tools the agent can call within it."]]),
L("af","The Einstein Trust Layer",[
 "Protections between your data and the LLM: secure grounding, data masking, zero data retention with model providers, toxicity detection and an audit trail.",
 "Audit and feedback data can be stored in Data 360 for review."],
 {c:"c-af",s:"Trust Layer section",yt:"Einstein Trust Layer explained",th:"Einstein Trust Layer"},
 ["Setup → Einstein Trust Layer: review masking and audit settings.","Write a short explanation of the Trust Layer for a non-technical stakeholder in Notes."],
 [["What does zero data retention mean?","The model provider doesn't store or train on your prompts and responses."]]),
L("af","Agentforce Builder and Agent Script",[
 "The newer Agentforce Builder adds Agent Script, letting you mix deterministic steps (always do X) with LLM reasoning — hybrid reasoning for reliability.",
 "Use deterministic logic for compliance-critical steps; leave open-ended conversation to the LLM."],
 {c:"c-af2",s:"Agent Builder / newest sections",yt:"Salesforce Agentforce Builder Agent Script",th:"Agentforce Builder"},
 ["Create a service agent from a template.","Open Agentforce Studio, switch between Canvas and Script views, and identify the config, system, variables, start_agent and subagent blocks."],
 [["Give one step that should be deterministic.","Identity verification before sharing account data."]]),
L("af","Subagents (topics) and instructions",[
 "The topic's classification description decides when it is chosen — write it like a routing rule, with examples of what is in and out of scope.",
 "Instructions should be specific and testable ('Always confirm the device ID before running diagnostics'), not vague ('be helpful')."],
 {c:"c-af",s:"Topics / custom agent section",yt:"Agentforce topic instructions best practices",th:"Agentforce topics"},
 ["Create topic 'Device Troubleshooting' with scope, 4 instructions and 2 standard actions.","Test 10 utterances in the builder preview; note misroutes."],
 [["An order-status question goes to Device Troubleshooting. Fix?","Tighten both topics' descriptions with explicit in-scope and out-of-scope examples."]]),
L("af","Actions and the reasoning trace",[
 "Standard actions (record lookups, knowledge answers) are quick wins; custom actions come next week.",
 "The builder's reasoning view shows which topic and actions were chosen and why — the main debugging tool."],
 {c:"c-af",s:"Actions section",yt:"Agentforce agent builder testing conversation preview",th:"Agentforce actions"},
 ["Add standard actions to your topic; inspect the reasoning trace for 5 utterances.","Save a 'debugging checklist' snippet."],
 [["Where do you look first when the wrong action runs?","The reasoning trace: topic chosen, action chosen and inputs."]]),
L("af","Lab day: a two-topic agent",[
 "Breadth of test utterances matters more than perfect wording."],
 {c:"c-af",s:"Hands-on agent build",yt:"build Agentforce service agent step by step",th:"Agentforce service agent"},
 ["Build a second topic 'Account & Billing Questions'.","Write and run 20 test utterances (including off-topic and adversarial ones); log the results."],
 [["What should happen with an off-topic request?","A polite decline or escalation — not a hallucinated answer."]],270),
L("af","Week 7 review and exam",[
 "Explain topics, instructions, actions, reasoning and the Trust Layer without notes."],
 {c:"c-af",s:"Revision",yt:"Agentforce Specialist exam agent concepts",th:"Agentforce Specialist"},
 ["Closed-book exam; record the score in Week 7."],
 [["Name the Trust Layer protections.","Secure grounding, masking, zero retention, toxicity detection, audit trail."]],270),

/* ---------- WEEK 8 · Actions & grounding ---------- */
L("af","Flow actions",[
 "Autolaunched flows become agent actions; the agent reads input and output descriptions to decide when and how to call them — write them carefully.",
 "Return concise, structured outputs the agent can turn into a reply."],
 {c:"c-af",s:"Custom actions with Flow",yt:"Agentforce custom action flow",th:"Agentforce flow actions"},
 ["Build an autolaunched flow 'Get Device Status' (input deviceId; outputs status and lastSeen); add it as an action.","Test it from the agent."],
 [["Why does the input description matter?","The LLM uses it to extract the right value from the conversation."]]),
L("af","Apex actions",[
 "@InvocableMethod with @InvocableVariable descriptions; bulkified; with sharing; handle nulls and return friendly errors.",
 "Use Apex when logic is complex, needs callouts or must be unit tested."],
 {c:"c-af",s:"Apex actions",yt:"Agentforce invocable Apex action",th:"Agentforce Apex actions"},
 ["Write an Apex action 'Create Support Case' with a test class; deploy; add to the agent.","Save the class as a snippet."],
 [["Why bulkify an invocable method an agent calls one at a time?","The same method can be invoked in bulk by Flow or other contexts; it's also required good practice."]]),
L("af","Prompt Builder and templates",[
 "Template types include Sales Email, Field Generation, Record Summary and Flex.",
 "Ground templates with merge fields, related lists, Flow, Apex or Data 360 data, so outputs reflect real records."],
 {c:"c-af",s:"Prompt engineering section",yt:"Salesforce Prompt Builder flex template grounding",th:"Prompt Builder"},
 ["Create a Flex template summarising a customer's devices and open cases; attach it as an agent action."],
 [["Field Generation vs Flex?","Field Generation fills a specific field on a record page; Flex is general-purpose with custom inputs."]]),
L("af","Grounding with Data 360 (RAG)",[
 "Unstructured content (PDFs, knowledge) is chunked, embedded and indexed (vector or hybrid search index) in Data 360; retrievers fetch relevant chunks at runtime.",
 "Agentforce Data Library gives a guided way to set this up for agents."],
 {c:"c-af",s:"Agentforce & Data Cloud section",yt:"Agentforce data library RAG Data Cloud search index",th:"Agentforce data library"},
 ["Create a Data Library from a 'Nimbus Tracker Troubleshooting' PDF you write.","Ask the agent 3 questions only that document answers."],
 [["Why ground instead of fine-tuning?","Grounding keeps answers current and traceable to source documents."]]),
L("af","Testing Center",[
 "Batch tests define an utterance and the expected topic, actions and outcome — regression tests for agents."],
 {c:"c-af2",s:"Testing / evaluation",yt:"Agentforce Testing Center",th:"Agentforce Testing Center"},
 ["Create 15 test cases; run them; record the pass rate."],
 [["What do you re-run after changing an instruction?","The whole test suite — instructions affect routing globally."]]),
L("af","Lab day: iterate to green",[
 "Change one thing at a time and re-test."],
 {c:"c-af",s:"Any remaining action content",yt:"Agentforce troubleshooting topics actions",th:"Agentforce"},
 ["Fix failing tests via descriptions and instructions; aim for at least 90% pass.","Log each change and its effect in Notes."],
 [["Your pass rate drops after a fix. Next step?","Inspect the newly failing cases' reasoning traces; revert if needed."]],270),
L("af","Week 8 exam",[
 "Focus on action design and grounding scenarios."],
 {c:"c-af",s:"Revision",yt:"Agentforce Specialist prompt builder questions",th:"Agentforce Specialist"},
 ["Closed-book exam; record the score in Week 8."],
 [["Flow vs Apex vs prompt-template action — when each?","Flow for declarative record logic; Apex for complex logic/callouts; prompt template for generated text."]],270),

/* ---------- WEEK 10 · Tri-Cloud architecture ---------- */
L("tri","Usage-based selling end to end",[
 "Business goal: detect customers outgrowing their plan from usage data, then propose the right upsell automatically.",
 "Data 360 aggregates usage per unified customer; Revenue Cloud holds entitlements, assets and pricing; Agentforce turns the signal into a conversation or quote."],
 {c:"c-rc",s:"Usage-based billing section (re-watch)",yt:"Salesforce usage based pricing Revenue Cloud Data Cloud",th:"Revenue Cloud usage"},
 ["Sketch the capstone flow: usage → insight → signal → quote → agent outreach.","List the objects each cloud owns."],
 [["Which system is the source of truth for what the customer bought?","Revenue Cloud assets."]]),
L("tri","Utilisation vs entitlement in Data 360",[
 "Bring asset or entitlement quantities into Data 360 (CRM connector) and compare them with usage in a calculated insight: utilisation = used / entitled."],
 {c:"c-dc",s:"Calculated insights (re-watch)",yt:"Data Cloud calculated insight join CRM data",th:"Data Cloud calculated insights"},
 ["Stream Asset (or your entitlement object) into Data 360; draft the utilisation insight SQL."],
 [["Why compute utilisation in Data 360 instead of Apex?","Scale, scheduling and reuse by segments, agents and data actions."]]),
L("tri","Integration patterns and reliability",[

/* ---------------- WEEK 1 ---------------- */
READ[1] = {r:`
<p><b>Data 360</b> is Salesforce's data platform. It was launched as Customer 360 Audiences, then called Salesforce CDP, Genie, Data Cloud and — since Dreamforce 2025 — Data 360, positioned as the data layer for Agentforce. Its job is to collect customer data from everywhere, make it consistent, work out which records belong to the same person or company, and make that unified picture usable in real time by CRM users, automation and AI agents.</p>
<h5>The pipeline, stage by stage</h5>
<ul>
<li><b>Connectors</b> know how to reach a source: the Salesforce CRM connector, cloud storage (Amazon S3, Google Cloud Storage, Azure), the Ingestion API, the Web and Mobile SDKs, MuleSoft and partner connectors. Unstructured connectors (Google Drive, SharePoint and others) bring in documents for AI.</li>
<li><b>Data streams</b> are individual ingestion jobs. Each has a category (Profile, Engagement or Other), a primary key, and for engagement data an event-time field.</li>
<li><b>Data Lake Objects (DLOs)</b> store what was ingested, in the source's own shape.</li>
<li><b>Mapping</b> connects DLO fields to the standard <b>Customer 360 Data Model</b>, producing <b>Data Model Objects (DMOs)</b>. DMOs are a harmonised view over the DLOs, not a second copy.</li>
<li><b>Identity resolution</b> links DMO records that represent the same individual or account into <b>unified profiles</b>.</li>
<li><b>Insights</b> compute metrics: calculated insights (batch SQL) and streaming insights (near real time over windows).</li>
<li><b>Action</b>: segments and activations push audiences out; data actions fire events into Salesforce Flow or webhooks; enrichments show Data 360 values on CRM records; data graphs and retrievers ground agents.</li>
</ul>
<h5>Zero copy and credits</h5>
<p>Not all data has to be ingested. Zero-copy federation queries Snowflake, Databricks, Redshift and Google BigQuery in place, and data shares push Data 360 data back out without pipelines. Everything you do consumes credits, which is why architecture choices (how often to refresh, whether to federate) have a cost dimension.</p>
<h5>Why it matters in 2026</h5>
<p>Salesforce now presents Data 360 as the context engine for agents: agents answer better when they can see the unified profile, recent engagement and relevant documents. Summer ’26 added Data 360 Headless (exposing business context to external AI apps through an MCP server) and near-real-time zero-copy sharing with BigQuery.</p>`,
 iv:"Data 360 ingests or federates data from many sources, maps it to a common data model, resolves identities into unified profiles, computes insights, and then activates that context — to marketing, to automation through data actions, and to Agentforce as grounding. DLOs hold raw data; DMOs are the harmonised layer everything downstream uses.",
 refs:[REF.DCQS,REF.DCBEN,REF.DCS26,THS("Data 360")]};

READ[2] = {r:`
<p>The <b>Customer 360 Data Model</b> is Salesforce's standard vocabulary for customer data. Using it means every downstream feature — identity resolution, segmentation, agents — knows where to find names, emails and events without custom configuration.</p>
<h5>Party-centric design</h5>
<p>A <b>party</b> is someone you do business with: an <b>Individual</b> (a person) or an <b>Account</b> (an organisation). Ways of reaching a party are separate objects called <b>contact points</b>: Contact Point Email, Phone, Address and App. Each contact point has a <b>Party</b> field holding the ID of the individual it belongs to. This separation lets one person have many emails and lets identity resolution compare contact points across sources.</p>
<p><b>Party Identification</b> holds external identifiers — a loyalty number, an app user ID, a billing account number — with an identification name (the type) and number (the value). Matching on these is often the most reliable rule you have.</p>
<h5>Categories</h5>
<ul>
<li><b>Profile</b>: who someone is (Individual, contact points, Party Identification).</li>
<li><b>Engagement</b>: what they did and when (email opens, web visits, orders, product usage). Always time-stamped.</li>
<li><b>Other</b>: reference or slowly changing data (products, subscriptions, stores).</li>
</ul>
<p>The category is set on the data stream and must match the DMO you map to.</p>
<h5>Extending the model</h5>
<p>When something doesn't fit, create a custom DMO or add custom fields rather than abusing a standard field. Relationships between DMOs (for example usage event → Individual, N:1) are what allow insights and segments to join data.</p>
<h5>Common mistakes</h5>
<ul><li>Mapping an email straight onto Individual instead of Contact Point Email — identity resolution won't use it.</li><li>Forgetting the Party field on contact points.</li><li>Choosing Profile for event data, which loses the time dimension.</li></ul>`,
 iv:"The model is party-centric: Individual and Account are parties, contact points hang off them via the Party field, and Party Identification stores external IDs. Profile, Engagement and Other categories tell the platform how to treat the data, and custom DMOs with relationships extend it.",
 refs:[REF.DCQS,THS("Customer 360 Data Model")]};

READ[3] = {r:`
<p>A <b>data stream</b> is the configuration that brings one object from one source into Data 360. Getting its settings right prevents most data-quality problems later.</p>
<h5>Key settings</h5>
<ul>
<li><b>Category</b>: Profile, Engagement or Other.</li>
<li><b>Primary key</b>: must be unique. If two rows share a key, the later one overwrites the earlier — data silently disappears.</li>
<li><b>Record modified field</b>: tells the platform which version of a record is newest.</li>
<li><b>Event time field</b> (engagement only): when the event happened. Insights, windows and segments use it.</li>
<li><b>Refresh mode</b>: upsert applies changes by key; full refresh replaces the whole data set. Use upsert when the source sends deltas.</li>
</ul>
<h5>Source options</h5>
<ul>
<li><b>Salesforce CRM connector</b>: connects your org (and others). <b>Starter bundles</b> (Sales, Service and so on) create streams and standard mappings in one go.</li>
<li><b>Cloud storage</b> (S3, GCS, Azure): scheduled file pickup — ideal for exports from warehouses or billing systems.</li>
<li><b>Ingestion API</b>: streaming (small JSON batches, near real time) or bulk (CSV jobs). The only way to feed streaming insights from a custom app.</li>
<li><b>Web and Mobile SDKs</b>: behavioural events from websites and apps.</li>
<li><b>MuleSoft and partner connectors</b> for everything else.</li>
</ul>
<h5>Design guidance</h5>
<p>Decide per source whether you need history (ingest) or just access (federate). Keep raw fields in the DLO even if you don't map them yet. Name streams consistently (Source_Object) — you will have dozens.</p>`,
 iv:"Each stream defines source, category, primary key, record-modified and (for engagement) event-time fields, plus refresh mode. I pick upsert for delta feeds, use starter bundles for CRM, and treat a non-unique primary key as the number-one risk because it silently overwrites data.",
 refs:[REF.DCINT,REF.DCQS,THS("Data Cloud data streams")]};

READ[4] = {r:`
<p>Once data lands in a DLO you need to inspect it and often clean it. Two tools matter: <b>Data Explorer</b> and <b>stream formula fields</b>.</p>
<h5>Data Explorer</h5>
<p>Data Explorer browses DLOs, DMOs, unified objects and insights with filters and column selection. Use it to check record counts after every ingestion, spot nulls, and confirm formula fields worked. For anything more complex, switch to Query Editor and SQL.</p>
<h5>Formula fields on data streams</h5>
<p>Formula fields are calculated during ingestion and stored on the DLO. Typical uses:</p>
<ul>
<li><b>Normalisation</b>: lower-case and trim emails, strip spaces from phone numbers.</li>
<li><b>Composite keys</b>: concatenate two fields when no single column is unique.</li>
<li><b>Constants</b>: a literal such as "Nimbus App ID" to populate the identification name on Party Identification.</li>
<li><b>Derived values</b>: flags or buckets used later in segments.</li>
</ul>
<p>Cleaning at ingestion is cheaper and simpler than fixing data in every downstream rule. Field data types are fixed once deployed, so decide carefully between text, number, date and date-time.</p>
<h5>Batch transforms</h5>
<p>For heavier reshaping (joins, aggregations before mapping) Data 360 offers batch data transforms and, more recently, code extensions that run custom Python — including over zero-copy data. Use formula fields for row-level fixes and transforms for set-level work.</p>`,
 iv:"I validate every ingestion in Data Explorer, then use stream formula fields for row-level cleansing — normalising emails, building composite keys, adding constants — so identity resolution and mapping stay simple. Set-level reshaping goes into batch transforms.",
 refs:[REF.DCINT,THS("Data Cloud formula fields")]};

READ[5] = {r:`
<p>Data 360 is powerful but metered, and it often holds sensitive data. Three operational topics come up in every implementation and interview: <b>data spaces</b>, <b>permissions</b> and <b>consumption</b>.</p>
<h5>Data spaces</h5>
<p>A data space is a logical partition of data and metadata — streams, DMOs, identity rulesets, insights and segments can belong to a space. Typical uses are separating brands, regions or business units. Users are granted access per space. Every org starts with a <i>default</i> space.</p>
<h5>Permissions</h5>
<p>Access is layered: Data Cloud/Data 360 permission sets define what features a user can use (admin, architect, marketing roles and so on); data space membership defines which data they can see; and newer controls such as row-level security on data graphs (Summer ’26) restrict what agents can retrieve.</p>
<h5>Consumption and credits</h5>
<p>Ingestion, transforms, identity resolution, insights, segments, activations and queries all consume credits at different rates. Good practice:</p>
<ul>
<li>Refresh and run only as often as the decision needs (daily health scores don't need hourly runs).</li>
<li>Prefer incremental (upsert) ingestion.</li>
<li>Federate large data you only occasionally query.</li>
<li>Monitor consumption where your org reports it.</li>
</ul>
<h5>Governance</h5>
<p>Consent data, data retention, deletion requests and audit all live here too. In interviews, mentioning cost and governance alongside features signals architect-level thinking.</p>`,
 iv:"Data spaces partition data and metadata by brand or region; permission sets plus space membership control access, and data-graph row-level security protects what agents see. Because every operation consumes credits, I schedule runs to match business need and federate data I only occasionally query.",
 refs:[REF.DCQS,REF.DCS26,THS("Data Cloud data spaces")]};

READ[6] = {r:`
<p>Today is a build day: you create the Project 1 sources. The reading explains <i>why</i> the data is designed the way it is.</p>
<h5>Design the answer before you build</h5>
<p>Professional data engineers build a <b>test oracle</b> — a data set where the correct result is known in advance. Your generator creates 300 people and distributes them so CRM holds people 0–199, the app 100–299 and billing 150–249. So 500 source rows should resolve to about 300 unified individuals. If identity resolution gives 450, something is wrong; if 200, you are over-merging.</p>
<h5>Realistic mess</h5>
<ul>
<li><b>Email case and whitespace</b> — fixed with formula fields.</li>
<li><b>Nicknames</b> (Ben vs Benjamin) — handled by fuzzy first-name matching combined with exact surname and phone.</li>
<li><b>Different IDs per system</b> — handled by Party Identification for the app ID.</li>
</ul>
<h5>Loading CRM data</h5>
<p>The Data Import Wizard can create Accounts and Contacts in one pass, matching accounts by name. For larger loads you'd use Data Loader or the Bulk API via the Salesforce CLI.</p>
<h5>Evidence</h5>
<p>Screenshot stream run status and record counts as you go — they become portfolio evidence and help debug later.</p>`,
 iv:"I always design test data with a known expected outcome — here 500 records engineered to unify into about 300 — so I can objectively verify identity resolution rather than eyeballing it.",

READ[7] = {r:`
<h5>Week 1 cheat sheet</h5>
<ul>
<li><b>Pipeline</b>: connectors → streams → DLOs → mapping → DMOs → identity resolution → unified profiles → insights → segments/activations/data actions/enrichment/agent grounding.</li>

<h5>Exam technique</h5>
